name: Publish Docker Images to GHCR

# Builds Tasbir's Docker images and pushes them to GitHub Container Registry
# so a server can deploy with `image:` pulls — no repo clone needed on the box.
#
#   on tag push:       v1.0.0 -> ghcr.io/<owner>/tasbir-api:1.0.0 + :latest
#   on push to main:             -> :main (rolling dev image)
#   on manual dispatch:          -> :<branch-or-ref> + :latest
#
# Images:
#   ghcr.io/<owner>/tasbir-api       (backend/Dockerfile — api, worker, beat)
#   ghcr.io/<owner>/tasbir-playwright (backend/Dockerfile.playwright)
#   ghcr.io/<owner>/tasbir-frontend   (frontend/Dockerfile)

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tasbir-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: tasbir-playwright
            context: ./backend
            dockerfile: ./backend/Dockerfile.playwright
          - name: tasbir-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}"
          TAGS="$IMAGE:${GITHUB_SHA::12}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$TAGS,$IMAGE:$VERSION,$IMAGE:latest"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TAGS="$TAGS,$IMAGE:main"
          else
            REF="${GITHUB_REF_NAME//\//-}"
            TAGS="$TAGS,$IMAGE:$REF,$IMAGE:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
