# Tasbir Brand Profile
# Used by the strategist, copywriter, and designer for context-aware generation.
# Edit these to match your brand identity.

brand:
  name: "Sabin Pokharel"
  tagline: "AI & Math Explorer"
  mission: >
    Exploring the intersection of artificial intelligence and mathematics,
    building practical tools for learning and knowledge management.
  story: >
    Sabin Pokharel is a computational mathematics student who builds
    open-source tools like Lemma (FSRS-powered flashcards for Obsidian),
    Theorem (local-first reading app), and Pebble (offline-first note-taking
    companion). His work focuses on making learning more effective through
    spaced repetition, local-first software, and thoughtful design.
  url: "https://pokharelsabin.com.np"
  social:
    github: "sapienskid"
    twitter: "sapienskid"
    linkedin: "sapienskid"

# Footer row — rendered on every post (bottom-anchored, hairline rule above).
# Left: name (tracked uppercase). Right: handle (tracked uppercase).
footer:
  left: "SABIN POKHAREL"
  right: "@SAPIENSKID"

# Approved category labels — every post has exactly one, matching the site's
# taxonomy. Never invent a new one without adding it here first.
# Optional per-category "ground" reserves black-ground for that category.
categories:
  - name: "PORTFOLIO"
    description: "Project posts"
  - name: "PROJECT"
    description: "Individual build/ship updates"
  - name: "WRITING"
    description: "Blog posts"
  - name: "THE LIMITS No.{issue}"
    description: "Newsletter posts — substitute the real issue number"
  - name: "NOTE"
    description: "Short-form/thought posts"
    ground: "black"

# Overrides for generated content — leave empty to let the LLM decide.
# When set, these values are used instead of LLM generation.
overrides:
  badge: ""
  tagline: ""
  category: ""
