# Campaign presets — tone + ground per post type.
# Ground must be one of: white | black (the only allowed backgrounds).
# Referenced by key in the API: { "campaign": "default" }

default:
  label: "Default"
  tone: "professional"
  ground: "white"
  language: "clean editorial, weight-and-size hierarchy, generous whitespace"

educational:
  label: "Educational"
  tone: "warm professional"
  ground: "white"
  language: "clean, readable, math-friendly, generous whitespace"

product-launch:
  label: "Product Launch"
  tone: "energetic"
  ground: "black"
  language: "bold minimal, strong typographic contrast"

thought-leadership:
  label: "Thought Leadership"
  tone: "sophisticated"
  ground: "black"
  language: "editorial, generous whitespace, quiet confidence"

tutorial:
  label: "Tutorial"
  tone: "friendly technical"
  ground: "white"
  language: "clean step-by-step, math-friendly"

mathematics:
  label: "Mathematics"
  tone: "precise academic"
  ground: "white"
  language: "clean, math-friendly, large formulas"

stem:
  label: "STEM"
  tone: "clear technical"
  ground: "white"
  language: "clean technical, code and formulas"
