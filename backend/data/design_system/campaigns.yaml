# Campaign presets — define visual style, tone, and background per post type
# Campaigns are referenced by key in the API: { "campaign": "default" }

default:
  label: "Default"
  tone: "professional"
  visual_style: "clean editorial"
  background: "dark gradient"
  illustrations: "geometric accents"

educational:
  label: "Educational"
  tone: "warm professional"
  visual_style: "clean, readable, diagram-friendly"
  background: "dark with subtle grid"
  illustrations: "diagrams, code snippets, math"

product-launch:
  label: "Product Launch"
  tone: "energetic"
  visual_style: "bold minimal"
  background: "solid dark with accent glow"
  illustrations: "product mockup, logo"

thought-leadership:
  label: "Thought Leadership"
  tone: "sophisticated"
  visual_style: "editorial, serif-friendly"
  background: "dark premium"
  illustrations: "minimal, abstract shapes"

tutorial:
  label: "Tutorial"
  tone: "friendly technical"
  visual_style: "clean step-by-step"
  background: "dark with grid pattern"
  illustrations: "screenshots, code blocks, diagrams"

mathematics:
  label: "Mathematics"
  tone: "precise academic"
  visual_style: "clean, math-friendly, large formulas"
  background: "dark with subtle grid"
  illustrations: "mathematical expressions, formulas, diagrams, graphs"

stem:
  label: "STEM"
  tone: "clear technical"
  visual_style: "clean technical, code and formulas"
  background: "dark with geometric grid"
  illustrations: "equations, code snippets, diagrams, graphs"
