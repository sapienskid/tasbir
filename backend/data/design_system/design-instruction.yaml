# Design Instruction — compositional constraints for the visual system.
# Encodes the Swiss / International Typographic Style for Sabin Pokharel.
# Injected into designer & verifier prompts at runtime. No code changes needed.

style:
  name: "Swiss / International Typographic Style"
  palette: "monochrome"           # strictly grayscale — no hue of any kind
  allowed_grounds: ["white", "black"]
  default_ground: "white"
  accent: "none"
  max_weights_per_family: 2       # two weights max per typeface
  shadows: false
  border_radius: "0px"
  illustrations: false
  icons: false
  emoji: false
  gradients: false
  # Default illustration style for the media plan (DB-backed, Studio-editable):
  # "procedural" (Anthropic-style organic mark — clean, editorial, preferred),
  # "compose" (single hero mark), or a curated DiceBear id. Empty → media-plan
  # LLM picks. "compose" renders ONE bold hero element, never a scatter.
  illustration_style: "procedural"

type_voice:
  display: |
    Space Grotesk (var(--font-display)) is the signature display voice.
    Use it ONLY for the headline and the footer wordmark. Big, tight,
    confident — this is what makes the post recognizable.
  serif: |
    Source Serif 4 (var(--font-serif)) is the editorial text voice. It
    carries the subhead and body copy — the long-form reading. Serif at
    reading sizes reads as premium editorial and gives the math/content
    its literary quality.
  body: |
    Inter (var(--font-sans)) is the quiet interface voice — category label,
    metadata, and the footer handle. Small, tracked, uppercase. Hierarchy
    comes from weight, size, voice contrast, and tracking — never from color.

type_scale:
  base_canvas_width: 1080
  # Per-family type multiplier on top of width scaling. Tall formats
  # (portrait/story) get larger type so the canvas reads full without
  # leftover space; square/landscape stay at 1.0.
  family_scale:
    square: 1.0
    portrait: 1.18
    story: 1.45
    landscape: 1.0
  # Sizes are at base_canvas_width; scale by width/1080 for other formats.
  # THREE voices: display (headline + wordmark), serif (subhead + body),
  # sans (category + metadata + handle). Per-family max 2 weights.
  roles:
    category:
      family: "sans"
      size: 22
      weight: 500
      tracking: "0.12em"
      case: "uppercase"
      line_height: 1.2
      max_chars: 24
    headline:
      family: "display"
      size: 76
      weight: 700
      tracking: "-0.01em"
      case: "sentence"
      line_height: 1.0
      max_lines:
        square: 4
        portrait: 4
        story: 4
        landscape: 3
    subhead:
      family: "serif"
      size: 36
      weight: 400
      tracking: 0
      case: "sentence"
      line_height: 1.3
      max_lines: 3
      measure_px: 600
    body:
      family: "serif"
      size: 28
      weight: 400
      tracking: 0
      case: "sentence"
      line_height: 1.4
      max_lines: 5
      min_size: 24
      measure_px: 600            # max body column width at 1080 (proper measure)
    metadata:
      family: "sans"
      size: 20
      weight: 500
      tracking: "0.08em"
      case: "uppercase"
      line_height: 1.2
      min_size: 18

spacing:
  unit: 8
  scale: [8, 16, 24, 32, 48, 64, 96, 128]
  margin: 64                       # px, every edge, every format
  margin_story_vertical: 160       # px, top/bottom on 9:16 to clear platform UI
  gap_category_label: 24           # px, label → headline
  gap_headline_body: 32            # px, headline → subhead/body
  gap_footer_rule: 24              # px, rule → footer text
  gap_section: 96                  # px, section separation on tall formats

format_families:
  instagram-square: square
  instagram-portrait: portrait
  instagram-story: story
  linkedin-post: landscape
  twitter-card: landscape
  facebook-post: landscape
  pinterest-pin: portrait

formats:
  square:
    label: "Square post"
    margins: [64, 64, 64, 64]
    footer_y: 1016
  portrait:
    label: "Portrait post (4:5)"
    margins: [64, 64, 64, 64]
  story:
    label: "Story/Reel (9:16)"
    margins: [160, 64, 160, 64]
    headline_zone: [160, 700]
    footer_y: 1760
  landscape:
    label: "Landscape (16:9)"
    margins: [64, 64, 64, 64]

footer:
  enabled: true
  rule: "1px hairline"
  gap: 24
  style: "metadata"
  wordmark:
    family: "display"
    size: 24
    weight: 500
    tracking: "-0.01em"
    case: "uppercase"

# Approved composition archetypes. One is picked deterministically per post
# so layouts vary across content while staying within the strict system.
layout_archetypes:
  editorial-stack:
    description: "Category kicker, full-width display headline, then subhead + body in the constrained measure column, footer bottom-anchored. Headline-led with generous whitespace."
  split-editorial:
    description: "Full-width display headline anchored top; subhead, body, and/or math placed in a separate offset column or block beside it. Asymmetric editorial composition."
  quiet-minimal:
    description: "Reduced content: category, display headline, one short subhead line, footer. Most of the canvas is intentional whitespace; the headline floats high."

images:
  default_crop: "sharp_rect"
  text_overlay_fade: "targeted"

math:
  dedicated_grid_block: true
  fallback: "reduce_headline"

do_dont:
  do:
    - "Left-align everything, always"
    - "Use weight and size for hierarchy — never color"
    - "THREE VOICES: display (Space Grotesk) for headline + wordmark; serif (Source Serif 4) for subhead + body; sans (Inter) for category, metadata, handle"
    - "Constrain subhead/body copy to the measure (~600px at 1080) — never full-width lines"
    - "Keep hairline rules exactly 1px: hairline on white-ground, hairline-inverted on black-ground"
    - "Use generous whitespace — flexible space is intentional, not empty by accident"
    - "A single composed illustration (the Scene Composer: custom hero + content-mapped line motifs + hand-drawn Highlights accents — OR a procedural abstract figure, OR a curated DiceBear figure) may fill the designated illustration slot — it must stay strictly monochrome (brand grays via var(--color-*), resolved through the design system tokens), and photos in the image slot render grayscale with a small credit caption"
  dont:
    - "No hue of any kind — not even 'just a little' blue, amber, or green"
    - "No icons or decorative motifs outside the designated illustration slot"
    - "No centering"
    - "No more than 2 weights per family (Space Grotesk 500+700, Source Serif 4 400, Inter 500)"
    - "Never use the display face for body, subhead, category, or metadata text"
    - "Never use the serif for headlines, category labels, metadata, or the wordmark"
    - "No shadows, gradients, borders-with-radius, or any softening effect"
    - "No third color, ever — if a post needs emphasis, use weight or size"
