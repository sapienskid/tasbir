<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

/* landscape: tight horizontal card, vertical rule splitting columns */
.sheet {
  height: 100%;
  padding: {{ (height * 0.12) | round | int }}px {{ (width * 0.05) | round | int }}px;
  display: flex;
  gap: {{ (width * 0.05) | round | int }}px;
}

.left { flex: 0 0 46%; display: flex; flex-direction: column; justify-content: space-between; }
.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.016) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.052) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 0.98;
  max-width: {{ (width * 0.44) | round | int }}px;
}
.left-foot { font-family: var(--font-sans); font-size: {{ (width * 0.014) | round | int }}px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-tertiary); }
body[data-ground="black"] .left-foot { color: var(--color-text-secondary); }

/* the vertical rule — the structural spine */
.rule { width: 1px; background: var(--color-border); }
body[data-ground="black"] .rule { background: var(--color-border-inverted); }

.right { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.body {
  font-size: {{ (width * 0.022) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.36) | round | int }}px;
}
.subhead {
  font-size: {{ (width * 0.028) | round | int }}px;
  line-height: 1.4;
  max-width: {{ (width * 0.38) | round | int }}px;
}

.image {
  width: 100%;
  height: {{ (height * 0.34) | round | int }}px;
  overflow: hidden;
  border: 1px solid var(--color-border);
  margin-top: {{ (height * 0.06) | round | int }}px;
  background: var(--color-text-tertiary);
}
body[data-ground="black"] .image { border-color: var(--color-border-inverted); }
.image img { width: 100%; height: 100%; object-fit: cover; display: block; }

.footer-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: {{ (height * 0.1) | round | int }}px;
  padding-top: {{ (width * 0.012) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.014) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="left">
      <div class="kicker" data-slot="kicker">{{ kicker }}</div>
      <h1 class="headline" data-slot="headline">{{ headline }}</h1>
      <div class="left-foot" data-slot="meta">{{ meta }}</div>
    </div>
    <div class="rule"></div>
    <div class="right">
      {% if subhead %}
      <div class="subhead" data-slot="subhead">{{ subhead }}</div>
      {% endif %}
      {% if body %}
      <div class="body" data-slot="body">{{ body }}</div>
      {% endif %}
      {% if has_image %}
      <figure class="image"><img data-image-key="0" alt=""/></figure>
      {% endif %}
      {% if footer_right %}
      <div class="footer-row">
        <span data-slot="footer_right">{{ footer_right }}</span>
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
