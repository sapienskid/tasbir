<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  height: 100%;
  padding: {{ (height * 0.05) | round | int }}px;
  display: flex;
  flex-direction: column;
  position: relative;
}

.index {
  position: absolute;
  top: {{ (height * 0.04) | round | int }}px;
  right: {{ (width * 0.05) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (173 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 0.8;
  color: var(--color-text-tertiary);
  font-variant-numeric: tabular-nums;
}
body[data-ground="black"] .index { color: var(--color-text-secondary); }

.kicker {
  font-family: var(--font-sans);
  font-size: {{ (22 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.headline {
  margin-top: {{ (height * 0.028) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (89 * tscale) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.0;
  max-width: {{ (width * 0.84) | round | int }}px;
}

.body {
  margin-top: {{ (height * 0.03) | round | int }}px;
  font-size: {{ (30 * tscale) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.66) | round | int }}px;
}
.subhead {
  margin-top: {{ (height * 0.03) | round | int }}px;
  font-size: {{ (39 * tscale) | round | int }}px;
  line-height: 1.4;
  max-width: {{ (width * 0.66) | round | int }}px;
}

.rule { margin-top: auto; }

.image {
  width: {{ (width * 0.5) | round | int }}px;
  height: {{ (height * 0.2) | round | int }}px;
  overflow: hidden;
  border: 1px solid var(--color-border);
  margin-top: {{ (height * 0.03) | round | int }}px;
  margin-left: auto;
  background: var(--color-text-tertiary);
}
body[data-ground="black"] .image { border-color: var(--color-border-inverted); }
.image img { width: 100%; height: 100%; object-fit: cover; display: block; }

.meta-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: {{ (width * 0.022) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (21 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="index">{{ loop_index }}</div>
    <div class="kicker" data-slot="kicker">{{ kicker }}</div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if subhead %}
    <div class="subhead" data-slot="subhead">{{ subhead }}</div>
    {% endif %}
    {% if body %}
    <div class="body" data-slot="body">{{ body }}</div>
    {% endif %}
    {% if has_image %}
    <figure class="image"><img data-image-key="0" alt=""/></figure>
    {% endif %}
    {% if footer_right %}
    <div class="meta-line">
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
</body>
</html>
