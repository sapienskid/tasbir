<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  position: relative;
  height: 100%;
  padding: {{ (height * 0.05) | round | int }}px;
  display: flex;
  flex-direction: column;
}

/* header row: kicker left, index numeral right — separate rows, no collision. */
.toprow {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: {{ (width * 0.03) | round | int }}px;
}
.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.index {
  font-family: var(--font-display);
  font-size: {{ (width * 0.12) | round | int }}px;
  font-weight: clamp(300, calc(var(--font-weight-display, 700) - 200), 900);
  line-height: 0.9;
  letter-spacing: -0.03em;
  color: var(--color-text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
body[data-ground="black"] .index { color: var(--color-text-secondary); }

/* content flow: text block + optional image block. media_position flips the
   image to top/bottom (stacked) or left/right (side-by-side). */
.flow {
  flex: 1;
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: {% if media_position == "bottom" %}column{% elif media_position == "top" %}column-reverse{% elif media_position == "left" %}row-reverse{% else %}row{% endif %};
}

.text {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.headline {
  margin-top: {{ (height * 0.02) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (width * 0.078) | round | int }}px;
  font-weight: var(--font-weight-display, 700);
  letter-spacing: -0.015em;
  line-height: 1.0;
  max-width: {{ (width * 0.84) | round | int }}px;
}
.subhead {
  margin-top: {{ (width * 0.03) | round | int }}px;
  font-size: {{ (width * 0.034) | round | int }}px;
  line-height: 1.4;
  color: var(--color-text);
  max-width: {{ (width * 0.68) | round | int }}px;
}
.body {
  margin-top: {{ (width * 0.03) | round | int }}px;
  font-size: {{ (width * 0.028) | round | int }}px;
  line-height: 1.55;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.7) | round | int }}px;
}

/* framed photo block — a tall side column in row layouts, a horizontal block
   in column layouts, with the rule on the edge it sits against */
.image {
  {% if media_position in ("left", "right") %}flex: 0 0 40%; width: auto; height: 100%; margin-top: 0;
  {% elif media_position == "top" %}flex: 0 0 18%; width: {{ (width * 0.5) | round | int }}px; margin-top: 0;
  {% else %}flex: 0 0 18%; width: {{ (width * 0.5) | round | int }}px; margin-top: {{ (width * 0.03) | round | int }}px;
  {% endif %}
  overflow: hidden;
  border-radius: var(--radius-md, 0px);
  box-shadow: var(--shadow-md, none);
  {% if media_position == "left" %}border: 1px solid var(--color-border); border-right-width: 0;
  {% elif media_position == "right" %}border: 1px solid var(--color-border); border-left-width: 0;
  {% else %}border: 1px solid var(--color-border);{% endif %}
}
body[data-ground="black"] .image { border-color: var(--color-border-inverted); }
.image img, .image svg { width: 100%; height: 100%; object-fit: cover; display: block; }

.meta-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: {{ (width * 0.02) | round | int }}px;
  padding-top: {{ (width * 0.02) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.018) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
body[data-ground="black"] .subhead { color: var(--color-text-inverted); }
{% if logo %}
{% set lh = [ (width * 0.03) | round | int, 24 ] | max %}
/* brand logo — on solid ground only, clear space >= 1x its own height, never rotated/recoloured */
.brand-logo { height: {{ lh }}px; width: auto; max-width: {{ (width * 0.22) | round | int }}px; object-fit: contain; display: block; margin-left: auto; margin-right: {{ lh * 2 }}px; }
{% endif %}
{% if has_accent %}
/* accent · kicker highlight chip — ink text on the accent fill (the accent is never a text colour);
   the padding is cancelled by an equal negative margin so nothing reflows; an empty kicker gets no chip */
.kicker:not(:empty), body[data-ground="black"] .kicker:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
  border-radius: var(--radius-sm, 0px);
  width: fit-content;
  padding: .34em .66em .34em .8em;
  margin-left: -.8em;
  margin-right: -.66em;
  margin-top: -.34em;
  margin-bottom: -.34em;
}
/* accent · the index numeral sits on an accent block (ink numeral); padding cancelled by negative margin */
.index:not(:empty), body[data-ground="black"] .index:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
  border-radius: var(--radius-sm, 0px);
  padding: .1em .16em .1em .16em;
  margin: -.1em -.16em -.1em -.16em;
}
{% endif %}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="toprow">
      <span class="kicker" data-slot="kicker">{{ kicker }}</span>
      {% if logo %}<img class="brand-logo" data-logo src="{{ logo }}" alt="">{% endif %}
      <span class="index">{{ loop_index }}</span>
    </div>
    <div class="flow">
      <div class="text">
        <h1 class="headline" data-slot="headline">{{ headline }}</h1>
        {% if subhead %}
        <div class="subhead" data-slot="subhead">{{ subhead }}</div>
        {% endif %}
        {% if body %}
        <div class="body" data-slot="body">{{ body }}</div>
        {% endif %}
      </div>
      {% if has_image %}
      <div class="image"><img data-image-key="0" alt=""/></div>
      {% endif %}
    </div>
    {% if meta or footer_right %}
    <div class="meta-line">
      <span data-slot="meta">{{ meta }}</span>
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
</body>
</html>
