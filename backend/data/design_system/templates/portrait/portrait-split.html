<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet { height: 100%; padding: {{ (height * 0.045) | round | int }}px {{ (width * 0.06) | round | int }}px; }

.kicker {
  font-family: var(--font-sans);
  font-size: {{ (22 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.headline {
  margin-top: {{ (height * 0.03) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (78 * tscale) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.018em;
  line-height: 1.02;
  max-width: {{ (width * 0.8) | round | int }}px;
}

.body {
  margin-top: {{ (height * 0.035) | round | int }}px;
  font-size: {{ (30 * tscale) | round | int }}px;
  line-height: 1.55;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.62) | round | int }}px;
}

/* quiet lower region — meta low, tighter now that type is scaled up */
.lower {
  margin-top: {{ (height * 0.04) | round | int }}px;
  padding-top: {{ (width * 0.022) | round | int }}px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-sans);
  font-size: {{ (21 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="kicker" data-slot="kicker">{{ kicker }}</div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if subhead %}
    <div class="body" data-slot="subhead" style="color:var(--color-text);font-size: {{ (37 * tscale) | round | int }}px;line-height:1.4;">{{ subhead }}</div>
    {% endif %}
    {% if body %}
    <div class="body" data-slot="body">{{ body }}</div>
    {% endif %}
    {% if footer_right %}
    <div class="lower">
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
</body>
</html>
