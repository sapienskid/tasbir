<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

/* Placement-parametric portrait split. Default top = image above text; the
   media comes first in the DOM, so column keeps it on top and the other
   directions flip it. */
.card {
  height: 100%;
  display: flex;
  flex-direction: {% if media_position == "bottom" %}column-reverse{% elif media_position == "left" %}row-reverse{% elif media_position == "right" %}row{% else %}column{% endif %};
}

/* media zone — image owns a 42%-of-the-axis block (top/bottom height, or the
   left/right width), rule on the edge it sits against */
.media {
  flex: 0 0 42%;
  min-width: 0;
  min-height: 0;
  position: relative;
  overflow: hidden;
  {% if media_position == "bottom" %}border-top: 1px solid var(--color-border);
  {% elif media_position == "left" %}border-right: 1px solid var(--color-border);
  {% elif media_position == "right" %}border-left: 1px solid var(--color-border);
  {% else %}border-bottom: 1px solid var(--color-border);{% endif %}
}
body[data-ground="black"] .media {
  {% if media_position == "bottom" %}border-top-color: var(--color-border-inverted);
  {% elif media_position == "left" %}border-right-color: var(--color-border-inverted);
  {% elif media_position == "right" %}border-left-color: var(--color-border-inverted);
  {% else %}border-bottom-color: var(--color-border-inverted);{% endif %}
}
.media img, .media svg { display: block; width: 100%; height: 100%; object-fit: cover; }

.text {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  padding: {{ (width * 0.06) | round | int }}px {{ (width * 0.07) | round | int }}px;
  display: flex;
  flex-direction: column;
}
.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.headline {
  margin-top: {{ (width * 0.03) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (width * 0.074) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.0;
  max-width: 92%;
}
.subhead {
  margin-top: {{ (width * 0.03) | round | int }}px;
  font-family: var(--font-serif);
  font-size: {{ (width * 0.032) | round | int }}px;
  line-height: 1.35;
  color: var(--color-text);
  max-width: 86%;
}
.body {
  margin-top: {{ (width * 0.02) | round | int }}px;
  font-family: var(--font-serif);
  font-size: {{ (width * 0.027) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  max-width: 84%;
}
.footer {
  margin-top: auto;
  padding-top: {{ (width * 0.02) | round | int }}px;
}
.handle {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="card">
    {% if has_image %}
    <div class="media"><img data-image-key="0" alt=""/></div>
    {% endif %}
    <div class="text">
      <span class="kicker" data-slot="kicker">{{ kicker }}</span>
      <h1 class="headline" data-slot="headline">{{ headline }}</h1>
      {% if subhead %}
      <div class="subhead" data-slot="subhead">{{ subhead }}</div>
      {% endif %}
      {% if body %}
      <div class="body" data-slot="body">{{ body }}</div>
      {% endif %}
      {% if footer_right %}
      <div class="footer">
        <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
