<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  position: relative;
  height: 100%;
  padding: {{ (height * 0.06) | round | int }}px;
  overflow: hidden;
}

/* a hairline rule crossing the canvas — asymmetry by placement */
.cross-rule {
  position: absolute;
  left: {{ (width * 0.12) | round | int }}px;
  right: {{ (width * 0.08) | round | int }}px;
  top: {{ (height * 0.44) | round | int }}px;
  border-top: 1px solid var(--color-border);
}
body[data-ground="black"] .cross-rule { border-color: var(--color-border-inverted); }

.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
  position: absolute;
  top: {{ (height * 0.06) | round | int }}px;
  left: {{ (width * 0.06) | round | int }}px;
}

/* headline pushed off-grid to the upper-right */
.headline {
  position: absolute;
  top: {{ (height * 0.14) | round | int }}px;
  left: {{ (width * 0.46) | round | int }}px;
  right: {{ (width * 0.06) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (width * 0.065) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.018em;
  line-height: 1.0;
  text-align: left;
}

/* body in a counter-column lower-left */
.body {
  position: absolute;
  left: {{ (width * 0.06) | round | int }}px;
  bottom: {{ (height * 0.12) | round | int }}px;
  width: {{ (width * 0.44) | round | int }}px;
  font-size: {{ (width * 0.027) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
}

.subhead {
  position: absolute;
  left: {{ (width * 0.06) | round | int }}px;
  bottom: {{ (height * 0.12) | round | int }}px;
  width: {{ (width * 0.52) | round | int }}px;
  font-size: {{ (width * 0.036) | round | int }}px;
  line-height: 1.35;
}

.footer {
  position: absolute;
  left: {{ (width * 0.06) | round | int }}px;
  right: {{ (width * 0.06) | round | int }}px;
  bottom: {{ (height * 0.05) | round | int }}px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
  padding-top: {{ (width * 0.02) | round | int }}px;
}
.footer 
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="kicker" data-slot="kicker">{{ kicker }}</div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    <div class="cross-rule"></div>
    {% if body %}
    <div class="body" data-slot="body">{{ body }}</div>
    {% else %}
    <div class="subhead" data-slot="subhead">{{ subhead }}</div>
    {% endif %}
    {% if footer_right %}
    <div class="footer">
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
</body>
</html>
