<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

/* full-bleed background photo */
.bg { position: absolute; inset: 0; }
.bg .auto-photo, .bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scrim { position: absolute; inset: 0; background: var(--color-bg); opacity: 0.74; }
body[data-ground="black"] .scrim { background: var(--color-bg-inverted); }

.content {
  position: relative;
  z-index: 2;
  height: 100%;
  overflow: hidden;
  padding: {{ (height * 0.08) | round | int }}px {{ (width * 0.08) | round | int }}px;
  display: flex;
  flex-direction: column;
  justify-content: safe center;
}
.kicker {
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.074) | round | int }}px;
  font-weight: var(--font-weight-display, 700);
  letter-spacing: -0.02em;
  line-height: 1.0;
  margin-top: {{ (height * 0.03) | round | int }}px;
  max-width: {{ (width * 0.84) | round | int }}px;
}
.body {
  margin-top: {{ (height * 0.03) | round | int }}px;
  font-family: var(--font-serif);
  font-size: {{ (width * 0.026) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text);
  max-width: {{ (width * 0.72) | round | int }}px;
}

.footer {
  position: absolute;
  left: {{ (width * 0.08) | round | int }}px;
  bottom: {{ (height * 0.045) | round | int }}px;
  right: {{ (width * 0.08) | round | int }}px;
  z-index: 2;
  padding-top: {{ (height * 0.018) | round | int }}px;
  display: flex;
  justify-content: flex-start;
  align-items: baseline;
}
.handle {
  font-size: {{ (width * 0.018) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--color-text);
  background: var(--color-bg);
  padding: 4px calc(10px + var(--radius-sm, 0px) * .4);
  border-radius: var(--radius-sm, 0px);
}
body[data-ground="black"] .handle {
  color: var(--color-text-inverted);
  background: var(--color-bg-inverted);
}
.subhead {
  margin-top: {{ (height * 0.02) | round | int }}px;
  font-family: var(--font-serif);
  font-size: {{ (width * 0.034) | round | int }}px;
  line-height: 1.35;
  color: var(--color-text);
  max-width: {{ (width * 0.72) | round | int }}px;
}
body[data-ground="black"] .subhead, body[data-ground="black"] .body { color: var(--color-text-inverted); }
{% if logo %}
{% set lh = [ (width * 0.03) | round | int, 24 ] | max %}
/* brand logo — on solid ground only, clear space >= 1x its own height, never rotated/recoloured */
body { position: relative; }
.brand-logo { position: absolute; right: {{ (width * 0.08) | round | int }}px; bottom: {{ (height * 0.045) | round | int }}px; z-index: 3; height: {{ lh }}px; width: auto; max-width: {{ (width * 0.22) | round | int }}px; object-fit: contain; display: block; }
{% endif %}
{% if has_accent %}
/* accent · kicker highlight chip — ink text on the accent fill (the accent is never a text colour);
   the padding is cancelled by an equal negative margin so nothing reflows; an empty kicker gets no chip */
.kicker:not(:empty), body[data-ground="black"] .kicker:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
  border-radius: var(--radius-sm, 0px);
  width: fit-content;
  padding: .34em .66em .34em .8em;
  margin-left: -.8em;
  margin-right: -.66em;
  margin-top: -.34em;
  margin-bottom: -.34em;
}
/* accent · edge marker — a bar flush with the canvas edge, the height of the headline */
.headline { position: relative; }
.headline:not(:empty)::before {
  content: "";
  position: absolute;
  left: -{{ (width * 0.08) | round | int }}px;
  top: .1em;
  bottom: .1em;
  width: {{ (width * 0.009) | round | int }}px;
  background: var(--color-accent, transparent);
  border-radius: 0 var(--radius-sm, 0px) var(--radius-sm, 0px) 0;
}
{% endif %}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  {% if has_image %}
  <div class="bg"><img data-image-key="0" alt=""/><div class="scrim"></div></div>
  {% endif %}
  <div class="content">
    <span class="kicker" data-slot="kicker">{{ kicker }}</span>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if subhead %}
    <div class="subhead" data-slot="subhead">{{ subhead }}</div>
    {% endif %}
    {% if body %}
    <div class="body" data-slot="body">{{ body }}</div>
    {% endif %}
  </div>
  {% if footer_right %}
  <div class="footer">
    <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
  </div>
  {% endif %}
{% if logo %}{% if not has_image %}<img class="brand-logo" data-logo src="{{ logo }}" alt="">{% endif %}{% endif %}
</body>
</html>
