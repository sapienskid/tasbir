<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  height: 100%;
  padding: {{ (height * 0.06) | round | int }}px;
  display: flex;
  flex-direction: column;
}

/* kicker with a short over-rule — a designed start, not a plain label */
.kicker-row { display: flex; align-items: baseline; gap: 16px; }
.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.over-rule { width: {{ (width * 0.10) | round | int }}px; height: 1px; background: var(--color-border); }
body[data-ground="black"] .over-rule { background: var(--color-border-inverted); }

.spacer { flex: 1; }

.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.082) | round | int }}px;
  font-weight: var(--font-weight-display, 700);
  letter-spacing: -0.015em;
  line-height: 0.98;
  max-width: {{ (width * 0.92) | round | int }}px;
}

.body {
  margin-top: {{ (width * 0.045) | round | int }}px;
  font-size: {{ (width * 0.028) | round | int }}px;
  font-weight: 400;
  line-height: 1.45;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.62) | round | int }}px;
}

/* footer band — rule + handle, bottom-anchored */
.footer { margin-top: auto; }
.footer-row {
  display: flex;
  justify-content: flex-start;
  align-items: baseline;
  padding-top: {{ (width * 0.024) | round | int }}px;
}
.handle {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.subhead { color: var(--color-text); }
body[data-ground="black"] .subhead { color: var(--color-text-inverted); }
{% if logo %}
{% set lh = [ (width * 0.03) | round | int, 24 ] | max %}
/* brand logo — on solid ground only, clear space >= 1x its own height, never rotated/recoloured */
body { position: relative; }
.brand-logo { position: absolute; right: {{ (height * 0.06) | round | int }}px; bottom: {{ (height * 0.06) | round | int }}px; height: {{ lh }}px; width: auto; max-width: {{ (width * 0.22) | round | int }}px; object-fit: contain; display: block; }
{% endif %}
{% if has_accent %}
/* accent · kicker highlight chip — ink text on the accent fill (the accent is never a text colour);
   the padding is cancelled by an equal negative margin so nothing reflows; an empty kicker gets no chip */
.kicker:not(:empty), body[data-ground="black"] .kicker:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
  border-radius: var(--radius-sm, 0px);
  width: fit-content;
  padding: .34em .66em .34em .8em;
  margin-left: -.8em;
  margin-right: -.66em;
  margin-top: -.34em;
  margin-bottom: -.34em;
}
/* accent · edge marker — a bar flush with the canvas edge, the height of the headline */
.headline { position: relative; }
.headline:not(:empty)::before {
  content: "";
  position: absolute;
  left: -{{ (height * 0.06) | round | int }}px;
  top: .1em;
  bottom: .1em;
  width: {{ (width * 0.009) | round | int }}px;
  background: var(--color-accent, transparent);
  border-radius: 0 var(--radius-sm, 0px) var(--radius-sm, 0px) 0;
}
{% endif %}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="kicker-row">
      <span class="over-rule"></span>
      <span class="kicker" data-slot="kicker">{{ kicker }}</span>
    </div>
    <div class="spacer"></div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if subhead %}
    <div class="body subhead" data-slot="subhead" style="font-size:{{ (width * 0.034) | round | int }}px;">{{ subhead }}</div>
    {% endif %}
    {% if body %}
    <div class="body" data-slot="body">{{ body }}</div>
    {% endif %}
    {% if footer_right %}
    <div class="footer">
        <div class="footer-row">
        <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
      </div>
    </div>
    {% endif %}
  </div>
{% if logo %}<img class="brand-logo" data-logo src="{{ logo }}" alt="">{% endif %}
</body>
</html>
