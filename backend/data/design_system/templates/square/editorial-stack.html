<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  height: 100%;
  padding: {{ (height * 0.06) | round | int }}px;
  display: flex;
  flex-direction: column;
}

/* kicker with a short over-rule — a designed start, not a plain label */
.kicker-row { display: flex; align-items: baseline; gap: 16px; }
.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.over-rule { width: {{ (width * 0.10) | round | int }}px; height: 1px; background: var(--color-border); }
body[data-ground="black"] .over-rule { background: var(--color-border-inverted); }

.spacer { flex: 1; }

.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.082) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 0.98;
  max-width: {{ (width * 0.92) | round | int }}px;
}

.body {
  margin-top: {{ (width * 0.045) | round | int }}px;
  font-size: {{ (width * 0.028) | round | int }}px;
  font-weight: 400;
  line-height: 1.45;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.62) | round | int }}px;
}

/* footer band — rule + wordmark/handle, bottom-anchored */
.footer { margin-top: auto; }
.rule { border-top: 1px solid var(--color-border); }
body[data-ground="black"] .rule { border-color: var(--color-border-inverted); }
.footer-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: {{ (width * 0.024) | round | int }}px;
}
.wordmark {
  font-family: var(--font-display);
  font-size: {{ (width * 0.024) | round | int }}px;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.handle {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="kicker-row">
      <span class="over-rule"></span>
      <span class="kicker" data-slot="kicker">{{ kicker }}</span>
    </div>
    <div class="spacer"></div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if subhead %}
    <div class="body" data-slot="subhead" style="font-size:{{ (width * 0.034) | round | int }}px; color: var(--color-text);">{{ subhead }}</div>
    {% endif %}
    {% if body %}
    <div class="body" data-slot="body">{{ body }}</div>
    {% endif %}
    {% if tagline %}
    <div class="body" data-slot="tagline" style="margin-top:{{ (width * 0.05) | round | int }}px; font-family: var(--font-sans); font-size:{{ (width * 0.021) | round | int }}px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color: var(--color-text-secondary);">{{ tagline }}</div>
    {% endif %}
    <div class="footer">
      <div class="rule"></div>
      <div class="footer-row">
        <span class="wordmark" data-slot="footer_left">{{ footer_left }}</span>
        <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
      </div>
    </div>
  </div>
</body>
</html>
