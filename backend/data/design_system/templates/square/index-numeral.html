<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  position: relative;
  height: 100%;
  padding: {{ (height * 0.06) | round | int }}px;
  display: flex;
  flex-direction: column;
}

/* header row: kicker left, index numeral right — the index can never collide
   with the headline because they live on separate rows. */
.toprow {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: {{ (width * 0.03) | round | int }}px;
}
.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.index {
  font-family: var(--font-display);
  font-size: {{ (width * 0.11) | round | int }}px;
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: -0.03em;
  color: var(--color-text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
body[data-ground="black"] .index { color: var(--color-text-secondary); }

.spacer { flex: 1; }

.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.070) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.0;
  max-width: {{ (width * 0.82) | round | int }}px;
}

.body {
  margin-top: {{ (width * 0.04) | round | int }}px;
  font-size: {{ (width * 0.027) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.66) | round | int }}px;
}

.meta-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: auto;
  padding-top: {{ (width * 0.02) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.018) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="toprow">
      <span class="kicker" data-slot="kicker">{{ kicker }}</span>
      <span class="index">{{ loop_index }}</span>
    </div>
    <div class="spacer"></div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if body %}
    <div class="body" data-slot="body">{{ body }}</div>
    {% endif %}
    {% if meta or footer_right %}
    <div class="meta-line">
      <span data-slot="meta">{{ meta }}</span>
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
</body>
</html>
