<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  position: relative;
  height: 100%;
  padding: {{ (height * 0.06) | round | int }}px;
  display: flex;
  flex-direction: column;
}

/* the index numeral — oversized, tabular, a magazine device */
.index {
  position: absolute;
  top: {{ (height * 0.05) | round | int }}px;
  right: {{ (width * 0.05) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (width * 0.24) | round | int }}px;
  font-weight: 500;
  line-height: 0.8;
  letter-spacing: -0.04em;
  color: var(--color-text-tertiary);
  font-variant-numeric: tabular-nums;
}
body[data-ground="black"] .index { color: var(--color-text-secondary); }

.kicker {
  margin-top: {{ (width * 0.02) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.spacer { flex: 1; }

.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.070) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.0;
  max-width: {{ (width * 0.72) | round | int }}px;
}

.meta-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.018) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
  border-top: 1px solid var(--color-border);
  padding-top: {{ (width * 0.02) | round | int }}px;
  margin-top: {{ (width * 0.06) | round | int }}px;
}
body[data-ground="black"] .meta-line { border-color: var(--color-border-inverted); }

.footer-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: {{ (width * 0.022) | round | int }}px;
}
.wordmark {
  font-family: var(--font-display);
  font-size: {{ (width * 0.024) | round | int }}px;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.handle {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="index">{{ loop_index }}</div>
    <div class="kicker" data-slot="kicker">{{ kicker }}</div>
    <div class="spacer"></div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if body %}
    <div style="margin-top:{{ (width * 0.04) | round | int }}px; font-size:{{ (width * 0.026) | round | int }}px; line-height:1.5; color:var(--color-text-secondary); max-width:{{ (width * 0.62) | round | int }}px;" data-slot="body">{{ body }}</div>
    {% endif %}
    {% if tagline %}
    <div class="tagline" data-slot="tagline" style="margin-top:{{ (width * 0.045) | round | int }}px; font-family:var(--font-sans); font-size:{{ (width * 0.021) | round | int }}px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-text-secondary);">{{ tagline }}</div>
    {% endif %}
    <div class="meta-line">
      <span data-slot="meta">{{ meta }}</span>
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
    <div class="footer-row">
      <span class="wordmark" data-slot="footer_left">{{ footer_left }}</span>
    </div>
  </div>
</body>
</html>
