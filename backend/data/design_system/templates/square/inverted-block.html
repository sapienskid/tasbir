<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

/* the inverted block — the classic Swiss device */
.block {
  position: absolute;
  top: {{ (height * 0.05) | round | int }}px;
  left: {{ (width * 0.05) | round | int }}px;
  width: {{ (width * 0.9) | round | int }}px;
  height: {{ (height * 0.5) | round | int }}px;
  background: var(--color-bg-inverted);
  color: var(--color-text-inverted);
  display: flex;
  align-items: flex-end;
  padding: {{ (width * 0.06) | round | int }}px;
}
body[data-ground="black"] .block {
  background: var(--color-bg);
  color: var(--color-text);
}

.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  margin-bottom: {{ (width * 0.02) | round | int }}px;
}
body[data-ground="black"] .kicker { color: var(--color-text-secondary); }

.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.075) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.018em;
  line-height: 0.98;
  max-width: {{ (width * 0.78) | round | int }}px;
}

.lower {
  position: absolute;
  top: {{ (height * 0.6) | round | int }}px;
  left: {{ (width * 0.06) | round | int }}px;
  right: {{ (width * 0.06) | round | int }}px;
  bottom: {{ (height * 0.05) | round | int }}px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.body {
  font-size: {{ (width * 0.026) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.66) | round | int }}px;
}
.subhead {
  font-size: {{ (width * 0.035) | round | int }}px;
  line-height: 1.35;
  max-width: {{ (width * 0.66) | round | int }}px;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: {{ (width * 0.02) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="block">
    <div>
      <div class="kicker" data-slot="kicker">{{ kicker }}</div>
      <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    </div>
  </div>
  <div class="lower">
    <div>
      {% if subhead %}
      <div class="subhead" data-slot="subhead">{{ subhead }}</div>
      {% endif %}
      {% if body %}
      <div class="body" data-slot="body">{{ body }}</div>
      {% endif %}
    </div>
    {% if footer_right %}
    <div class="footer">
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
</body>
</html>
