<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

/* the inverted block — the classic Swiss device */
.block {
  position: absolute;
  top: {{ (height * 0.05) | round | int }}px;
  left: {{ (width * 0.05) | round | int }}px;
  width: {{ (width * 0.9) | round | int }}px;
  height: {{ (height * 0.5) | round | int }}px;
  background: var(--color-bg-inverted);
  color: var(--color-text-inverted);
  border-radius: var(--radius-md, 0px);
  box-shadow: var(--shadow-md, none);
  display: flex;
  align-items: flex-end;
  padding: {{ (width * 0.06) | round | int }}px;
}
body[data-ground="black"] .block {
  background: var(--color-bg);
  color: var(--color-text);
}

.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  margin-bottom: {{ (width * 0.02) | round | int }}px;
}
body[data-ground="black"] .kicker { color: var(--color-text-secondary); }

.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.075) | round | int }}px;
  font-weight: var(--font-weight-display, 700);
  letter-spacing: -0.018em;
  line-height: 0.98;
  max-width: {{ (width * 0.78) | round | int }}px;
}

.lower {
  position: absolute;
  top: {{ (height * 0.6) | round | int }}px;
  left: {{ (width * 0.06) | round | int }}px;
  right: {{ (width * 0.06) | round | int }}px;
  bottom: {{ (height * 0.05) | round | int }}px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.body {
  font-size: {{ (width * 0.026) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.66) | round | int }}px;
}
.subhead {
  font-size: {{ (width * 0.035) | round | int }}px;
  line-height: 1.35;
  max-width: {{ (width * 0.66) | round | int }}px;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: {{ (width * 0.02) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

{% if logo %}
{% set lh = [ (width * 0.03) | round | int, 24 ] | max %}
/* brand logo — on solid ground only, clear space >= 1x its own height, never rotated/recoloured */
body { position: relative; }
.brand-logo { position: absolute; right: {{ (width * 0.06) | round | int }}px; bottom: {{ (height * 0.05) | round | int }}px; height: {{ lh }}px; width: auto; max-width: {{ (width * 0.22) | round | int }}px; object-fit: contain; display: block; }
{% endif %}
{% if has_accent %}
/* accent · kicker highlight chip — ink text on the accent fill (the accent is never a text colour);
   the padding is cancelled by an equal negative margin so nothing reflows; an empty kicker gets no chip */
.kicker:not(:empty), body[data-ground="black"] .kicker:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
  border-radius: var(--radius-sm, 0px);
  width: fit-content;
  padding: .34em .66em .34em .8em;
  margin-left: -.8em;
  margin-right: -.66em;
  margin-top: -.34em;
  margin-bottom: calc({{ (width * 0.02) | round | int }}px - .34em);
}
/* accent · a solid stripe along the block's bottom edge */
.block::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: {{ (width * 0.012) | round | int }}px;
  background: var(--color-accent, transparent);
  border-radius: 0 0 var(--radius-md, 0px) var(--radius-md, 0px);
}
{% endif %}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="block">
    <div>
      <div class="kicker" data-slot="kicker">{{ kicker }}</div>
      <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    </div>
  </div>
  <div class="lower">
    <div>
      {% if subhead %}
      <div class="subhead" data-slot="subhead">{{ subhead }}</div>
      {% endif %}
      {% if body %}
      <div class="body" data-slot="body">{{ body }}</div>
      {% endif %}
    </div>
    {% if footer_right %}
    <div class="footer">
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
{% if logo %}<img class="brand-logo" data-logo src="{{ logo }}" alt="">{% endif %}
</body>
</html>
