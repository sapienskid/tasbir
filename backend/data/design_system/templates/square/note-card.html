<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

/* a thin inset frame — the "note card" */
.frame {
  position: absolute;
  inset: {{ (height * 0.045) | round | int }}px {{ (width * 0.045) | round | int }}px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md, 0px);
  box-shadow: var(--shadow-md, none);
}
body[data-ground="black"] .frame { border-color: var(--color-border-inverted); }

.sheet {
  position: absolute;
  inset: {{ (height * 0.09) | round | int }}px {{ (width * 0.09) | round | int }}px;
  display: flex;
  flex-direction: column;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.spacer { flex: 1; }

.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.068) | round | int }}px;
  font-weight: var(--font-weight-display, 700);
  letter-spacing: -0.015em;
  line-height: 1.02;
  max-width: {{ (width * 0.8) | round | int }}px;
}

.body {
  margin-top: {{ (width * 0.04) | round | int }}px;
  font-size: {{ (width * 0.026) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.66) | round | int }}px;
}

.footnote {
  margin-top: auto;
  padding-top: {{ (width * 0.022) | round | int }}px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.handle { color: var(--color-text-secondary); }

.subhead { color: var(--color-text); }
body[data-ground="black"] .subhead { color: var(--color-text-inverted); }
{% if logo %}
{% set lh = [ (width * 0.03) | round | int, 24 ] | max %}
/* brand logo — on solid ground only, clear space >= 1x its own height, never rotated/recoloured */
body { position: relative; }
.brand-logo { position: absolute; right: {{ (width * 0.09) | round | int }}px; bottom: {{ (height * 0.09) | round | int }}px; height: {{ lh }}px; width: auto; max-width: {{ (width * 0.22) | round | int }}px; object-fit: contain; display: block; }
{% endif %}
{% if has_accent %}
/* accent · kicker highlight chip — ink text on the accent fill (the accent is never a text colour);
   the padding is cancelled by an equal negative margin so nothing reflows; an empty kicker gets no chip */
.topline [data-slot="kicker"]:not(:empty), body[data-ground="black"] .topline [data-slot="kicker"]:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
  border-radius: var(--radius-sm, 0px);
  width: fit-content;
  padding: .34em .66em .34em .8em;
  margin-left: -.8em;
  margin-right: -.66em;
  margin-top: -.34em;
  margin-bottom: -.34em;
}
/* accent · a tab straddling the frame's top edge, aligned with the text margin */
.frame::before {
  content: "";
  position: absolute;
  left: {{ (width * 0.045) | round | int }}px;
  top: -{{ (width * 0.004) | round | int + 1 }}px;
  width: {{ (width * 0.16) | round | int }}px;
  height: {{ (width * 0.007) | round | int }}px;
  background: var(--color-accent, transparent);
  border-radius: var(--radius-sm, 0px);
}
{% endif %}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="frame"></div>
  <div class="sheet">
    <div class="topline">
      <span data-slot="kicker">{{ kicker }}</span>
    </div>
    <div class="spacer"></div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if subhead %}
    <div class="body subhead" data-slot="subhead" style="font-size:{{ (width * 0.033) | round | int }}px;line-height:1.35;">{{ subhead }}</div>
    {% endif %}
    {% if body %}
    <div class="body" data-slot="body">{{ body }}</div>
    {% endif %}
    {% if footer_right %}
    <div class="footnote">
      <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
{% if logo %}<img class="brand-logo" data-logo src="{{ logo }}" alt="">{% endif %}
</body>
</html>
