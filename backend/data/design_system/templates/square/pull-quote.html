<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  height: 100%;
  padding: {{ (height * 0.06) | round | int }}px;
  display: flex;
  flex-direction: column;
}

/* kicker as a thin spine on the left */
.spine {
  display: flex;
  align-items: center;
  gap: 16px;
}
.spine-bar { width: 3px; height: {{ (width * 0.06) | round | int }}px; background: var(--color-text); }
body[data-ground="black"] .spine-bar { background: var(--color-text-inverted); }
.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.headline-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.088) | round | int }}px;
  font-weight: var(--font-weight-display, 700);
  letter-spacing: -0.02em;
  line-height: 0.95;
  max-width: {{ (width * 0.9) | round | int }}px;
}

.source-line {
  margin-top: {{ (width * 0.06) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
}
body[data-ground="black"] .source-line { color: var(--color-text-secondary); }

.footer {
  padding-top: {{ (width * 0.02) | round | int }}px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
}
.handle {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.subhead { color: var(--color-text); }
body[data-ground="black"] .subhead { color: var(--color-text-inverted); }
{% if logo %}
{% set lh = [ (width * 0.03) | round | int, 24 ] | max %}
/* brand logo — on solid ground only, clear space >= 1x its own height, never rotated/recoloured */
body { position: relative; }
.brand-logo { position: absolute; right: {{ (height * 0.06) | round | int }}px; bottom: {{ (height * 0.06) | round | int }}px; height: {{ lh }}px; width: auto; max-width: {{ (width * 0.22) | round | int }}px; object-fit: contain; display: block; }
{% endif %}
{% if has_accent %}
/* accent · kicker highlight chip — ink text on the accent fill (the accent is never a text colour);
   the padding is cancelled by an equal negative margin so nothing reflows; an empty kicker gets no chip */
.kicker:not(:empty), body[data-ground="black"] .kicker:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
  border-radius: var(--radius-sm, 0px);
  width: fit-content;
  padding: .34em .66em .34em .45em;
  margin-left: -.45em;
  margin-right: -.66em;
  margin-top: -.34em;
  margin-bottom: -.34em;
}
/* accent · a short thick bar under the pull-quote, in the gap above the source line */
.headline { position: relative; }
.headline:not(:empty)::after {
  content: "";
  position: absolute;
  left: 0;
  top: 100%;
  margin-top: {{ (width * 0.018) | round | int }}px;
  width: {{ (width * 0.12) | round | int }}px;
  height: {{ (width * 0.009) | round | int }}px;
  background: var(--color-accent, transparent);
  border-radius: var(--radius-sm, 0px);
}
{% endif %}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="spine">
      <span class="spine-bar"></span>
      <span class="kicker" data-slot="kicker">{{ kicker }}</span>
    </div>
    <div class="headline-zone">
      <h1 class="headline" data-slot="headline">{{ headline }}</h1>
      {% if subhead %}
      <div class="source-line subhead" data-slot="subhead" style="text-transform:none;letter-spacing:0;font-family:var(--font-serif);font-size:{{ (width * 0.032) | round | int }}px;font-weight:400;max-width:{{ (width * 0.62) | round | int }}px;line-height:1.4;margin-top:{{ (width * 0.05) | round | int }}px;">{{ subhead }}</div>
      {% endif %}
    </div>
    {% if footer_right %}
    <div class="footer">
      <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
{% if logo %}<img class="brand-logo" data-logo src="{{ logo }}" alt="">{% endif %}
</body>
</html>
