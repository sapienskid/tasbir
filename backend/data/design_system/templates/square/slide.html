<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.slide {
  position: relative;
  height: 100%;
  padding: {{ (height * 0.07) | round | int }}px {{ (width * 0.08) | round | int }}px;
  display: flex;
  flex-direction: column;
}

/* optional corner illustration (media director decides per slide) */
.art {
  position: absolute;
  right: {{ (width * 0.05) | round | int }}px;
  bottom: {{ (height * 0.11) | round | int }}px;
  width: 150px;
  height: 150px;
}
.art svg, .art .figure { width: 100%; height: 100%; }

/* top rail: category left, slide counter right */
.top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
body[data-ground="black"] .kicker { color: var(--color-text-secondary); }
.counter {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--color-text-secondary);
}
body[data-ground="black"] .counter { color: var(--color-text-secondary); }

/* text zone: headline (cover only) + verbatim body */
.text {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: safe center;
  min-height: 0;
  overflow: hidden;
}
.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.070) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.02;
  margin-bottom: {{ (width * 0.06) | round | int }}px;
  max-width: {{ (width * 0.88) | round | int }}px;
}
.body {
  font-size: {{ (width * 0.026) | round | int }}px;
  line-height: 1.5;
  white-space: pre-line;
  max-width: {{ (width * 0.82) | round | int }}px;
}
body[data-ground="black"] .body { color: var(--color-text-inverted); }

/* footer */
.footer {
  border-top: 1px solid var(--color-border);
  padding-top: {{ (width * 0.02) | round | int }}px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
body[data-ground="black"] .footer { border-color: var(--color-border-inverted); }
.wordmark {
  font-family: var(--font-display);
  font-size: {{ (width * 0.022) | round | int }}px;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.handle {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
body[data-ground="black"] .handle { color: var(--color-text-secondary); }
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="slide">
    <div class="top">
      <span class="kicker" data-slot="kicker">{{ kicker }}</span>
      {% if slide_total %}
      <span class="counter" data-slot="counter">{{ slide_index }}/{{ slide_total }}</span>
      {% endif %}
    </div>
    <div class="text">
      {% if headline %}
      <h1 class="headline" data-slot="headline">{{ headline }}</h1>
      {% endif %}
      {% if body %}
      <div class="body" data-slot="body">{{ body }}</div>
      {% endif %}
    </div>
    <div class="footer">
      <span class="wordmark" data-slot="footer_left">{{ footer_left }}</span>
      <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% if illustration %}
    <div class="art">{{ illustration | safe }}</div>
    {% endif %}
  </div>
</body>
</html>
