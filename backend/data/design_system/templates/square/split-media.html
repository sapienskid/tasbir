<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.card { height: 100%; display: flex; }

.text {
  flex: 1 1 55%;
  min-width: 0;
  overflow: hidden;
  padding: {{ (height * 0.07) | round | int }}px {{ (width * 0.05) | round | int }}px;
  display: flex;
  flex-direction: column;
  justify-content: safe center;
}
.kicker {
  font-size: {{ (width * 0.020) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.headline {
  font-family: var(--font-display);
  font-size: {{ (width * 0.066) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.0;
  margin-top: {{ (height * 0.03) | round | int }}px;
  max-width: {{ (width * 0.52) | round | int }}px;
}
.body {
  margin-top: {{ (height * 0.03) | round | int }}px;
  font-family: var(--font-serif);
  font-size: {{ (width * 0.024) | round | int }}px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.5) | round | int }}px;
}
body[data-ground="black"] .body { color: var(--color-text-secondary); }

/* right image column — fills its half, object-fit cover */
.media {
  flex: 1 1 45%;
  min-width: 0;
  position: relative;
  overflow: hidden;
  border-left: 1px solid var(--color-border);
}
body[data-ground="black"] .media { border-color: var(--color-border-inverted); }
.media .auto-photo, .media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.media-empty {
  width: 100%;
  height: 100%;
  background: var(--color-text-tertiary);
}

.footer {
  position: absolute;
  left: {{ (width * 0.05) | round | int }}px;
  bottom: {{ (height * 0.035) | round | int }}px;
  right: 0;
  border-top: 1px solid var(--color-border);
  padding-top: {{ (height * 0.018) | round | int }}px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
body[data-ground="black"] .footer { border-color: var(--color-border-inverted); }
.wordmark { font-family: var(--font-display); font-size: {{ (width * 0.021) | round | int }}px; font-weight: 500; letter-spacing: -0.01em; text-transform: uppercase; }
.handle { font-size: {{ (width * 0.018) | round | int }}px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: var(--color-text-secondary); }
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="card">
    <div class="text">
      <span class="kicker" data-slot="kicker">{{ kicker }}</span>
      <h1 class="headline" data-slot="headline">{{ headline }}</h1>
      {% if body %}
      <div class="body" data-slot="body">{{ body }}</div>
      {% endif %}
    </div>
    {% if has_image %}
    <div class="media"><img data-image-key="0" alt=""/></div>
    {% else %}
    <div class="media"><div class="media-empty"></div></div>
    {% endif %}
    <div class="footer">
      <span class="wordmark" data-slot="footer_left">{{ footer_left }}</span>
      <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
    </div>
  </div>
</body>
</html>
