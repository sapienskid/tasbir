<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
/* this composition is inherently dark — black is the natural ground */
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.card {
  width: 100%;
  height: 100%;
  padding: {{ (height * 0.09) | round | int }}px {{ (width * 0.07) | round | int }}px;
  display: flex;
  flex-direction: column;
  position: relative;
}

.brandrow {
  display: flex;
  align-items: center;
  gap: 14px;
}
.mark {
  width: {{ (width * 0.045) | round | int }}px;
  height: {{ (width * 0.045) | round | int }}px;
  background: var(--color-text);
  color: var(--color-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm, 0px);
  font-family: var(--font-display);
  font-weight: clamp(300, calc(var(--font-weight-display, 700) - 200), 900);
  font-size: {{ (22 * tscale) | round | int }}px;
}
body[data-ground="black"] .mark { background: var(--color-text-inverted); color: var(--color-bg-inverted); }

/* seeded typographic glyph texture — monochrome, varies per post */
.grid {
  position: absolute;
  top: {{ (height * 0.16) | round | int }}px;
  left: {{ (width * 0.07) | round | int }}px;
  right: {{ (width * 0.07) | round | int }}px;
  height: {{ (height * 0.24) | round | int }}px;
  overflow: hidden;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 1fr;
  align-items: center;
  gap: {{ (height * 0.02) | round | int }}px {{ (width * 0.02) | round | int }}px;
  font-size: {{ (26 * tscale) | round | int }}px;
  font-weight: 500;
  color: var(--color-text-tertiary);
  pointer-events: none;
}
body[data-ground="black"] .grid { color: var(--color-text-secondary); }
.grid span { text-align: center; line-height: 1; }

.kicker {
  margin-top: auto;
  margin-bottom: {{ (height * 0.02) | round | int }}px;
  font-size: {{ (22 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

/* badge → headline: inverted block device */
.headline {
  font-family: var(--font-display);
  font-size: {{ (48 * tscale) | round | int }}px;
  font-weight: clamp(300, calc(var(--font-weight-display, 700) - 200), 900);
  line-height: 1.25;
  letter-spacing: -0.015em;
  max-width: {{ (width * 0.86) | round | int }}px;
  background: var(--color-text);
  color: var(--color-bg);
  padding: {{ (width * 0.03) | round | int }}px {{ (width * 0.035) | round | int }}px;
  border-radius: var(--radius-md, 0px);
  box-shadow: var(--shadow-md, none);
}
body[data-ground="black"] .headline {
  background: var(--color-text-inverted);
  color: var(--color-bg-inverted);
}

.footerrow {
  margin-top: {{ (height * 0.025) | round | int }}px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.handle {
  font-size: {{ (22 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.subhead {
  margin-top: {{ (height * 0.02) | round | int }}px;
  font-family: var(--font-serif);
  font-size: {{ (34 * tscale) | round | int }}px;
  line-height: 1.4;
  color: var(--color-text);
  max-width: {{ (width * 0.86) | round | int }}px;
}
body[data-ground="black"] .subhead { color: var(--color-text-inverted); }
{% if logo %}
{% set lh = [ (width * 0.03) | round | int, 24 ] | max %}
/* brand logo — on solid ground only, clear space >= 1x its own height, never rotated/recoloured */
body { position: relative; }
.brand-logo { position: absolute; top: {{ (height * 0.09) | round | int }}px; right: {{ (width * 0.07) | round | int }}px; height: {{ lh }}px; width: auto; max-width: {{ (width * 0.22) | round | int }}px; object-fit: contain; display: block; }
{% endif %}
{% if has_accent %}
/* accent · the index mark and the headline badge sit on accent fills (ink text) — the accent is never a text colour */
.mark:not(:empty), body[data-ground="black"] .mark:not(:empty),
.headline:not(:empty), body[data-ground="black"] .headline:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
}
{% endif %}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="card">
    <div class="brandrow">
      <span class="mark">{{ loop_index }}</span>
    </div>

    <div class="grid">
      {% for g in decor_pattern %}<span>{{ g }}</span>{% endfor %}
    </div>

    <div class="kicker" data-slot="kicker">{{ kicker }}</div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if subhead %}
    <div class="subhead" data-slot="subhead">{{ subhead }}</div>
    {% endif %}

    {% if meta or footer_right %}
    <div class="footerrow">
      <span style="color:var(--color-text-tertiary);font-size:{{ (20 * tscale) | round | int }}px;">{{ meta }}</span>
      <span class="handle" data-slot="footer_right">{{ footer_right }}</span>
    </div>
    {% endif %}
  </div>
{% if logo %}<img class="brand-logo" data-logo src="{{ logo }}" alt="">{% endif %}
</body>
</html>
