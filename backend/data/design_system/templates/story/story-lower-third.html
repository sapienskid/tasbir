<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

/* story: 160px clear top/bottom for platform UI, headline in upper third */
.sheet { height: 100%; padding: {{ (height * 0.09) | round | int }}px {{ (width * 0.07) | round | int }}px; display: flex; flex-direction: column; }

.kicker {
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.headline {
  margin-top: {{ (height * 0.035) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (width * 0.078) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.0;
  max-width: {{ (width * 0.86) | round | int }}px;
}

.spacer { flex: 1; }

.image {
  width: 100%;
  height: {{ (height * 0.16) | round | int }}px;
  overflow: hidden;
  border: 1px solid var(--color-border);
  margin-top: {{ (height * 0.04) | round | int }}px;
  background: var(--color-text-tertiary);
}
body[data-ground="black"] .image { border-color: var(--color-border-inverted); }
.image img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* lower-third band: rule + body + footer */
.band {
  border-top: 1px solid var(--color-border);
  padding-top: {{ (width * 0.03) | round | int }}px;
}
body[data-ground="black"] .band { border-color: var(--color-border-inverted); }

.body {
  font-size: {{ (width * 0.028) | round | int }}px;
  line-height: 1.55;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.7) | round | int }}px;
}
.subhead {
  font-size: {{ (width * 0.036) | round | int }}px;
  line-height: 1.45;
  max-width: {{ (width * 0.7) | round | int }}px;
}

.footer-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: {{ (width * 0.035) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
.wordmark { font-family: var(--font-display); letter-spacing: -0.01em; color: var(--color-text); }
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="kicker" data-slot="kicker">{{ kicker }}</div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if has_image %}
    <figure class="image"><img data-image-key="0" alt=""/></figure>
    {% endif %}
    <div class="spacer"></div>
    <div class="band">
      {% if subhead %}
      <div class="subhead" data-slot="subhead">{{ subhead }}</div>
      {% endif %}
      {% if body %}
      <div class="body" data-slot="body">{{ body }}</div>
      {% endif %}
      <div class="footer-row">
        <span class="wordmark" data-slot="footer_left">{{ footer_left }}</span>
        <span data-slot="footer_right">{{ footer_right }}</span>
      </div>
    </div>
  </div>
</body>
</html>
