<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

/* story: 160px clear top/bottom for platform UI, headline in upper third */
.sheet { height: 100%; padding: {{ (height * 0.09) | round | int }}px {{ (width * 0.07) | round | int }}px; display: flex; flex-direction: column; }

.kicker {
  font-family: var(--font-sans);
  font-size: {{ (21 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.headline {
  margin-top: {{ (height * 0.035) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (84 * tscale) | round | int }}px;
  font-weight: var(--font-weight-display, 700);
  letter-spacing: -0.02em;
  line-height: 1.0;
  max-width: {{ (width * 0.86) | round | int }}px;
}

.spacer { flex: 1; }

.image {
  width: 100%;
  height: {{ (height * 0.16) | round | int }}px;
  overflow: hidden;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md, 0px);
  box-shadow: var(--shadow-md, none);
  margin-top: {{ (height * 0.04) | round | int }}px;
  background: var(--color-text-tertiary);
}
body[data-ground="black"] .image { border-color: var(--color-border-inverted); }
.image img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* lower-third band: rule + body + footer */
.band {
  padding-top: {{ (width * 0.03) | round | int }}px;
}

.body {
  font-size: {{ (30 * tscale) | round | int }}px;
  line-height: 1.55;
  color: var(--color-text-secondary);
  max-width: {{ (width * 0.7) | round | int }}px;
}
.subhead {
  font-size: {{ (39 * tscale) | round | int }}px;
  line-height: 1.45;
  max-width: {{ (width * 0.7) | round | int }}px;
}

.footer-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: {{ (width * 0.035) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (21 * tscale) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

{% if logo %}
{% set lh = [ (width * 0.03) | round | int, 24 ] | max %}
/* brand logo — on solid ground only, clear space >= 1x its own height, never rotated/recoloured */
body { position: relative; }
.brand-logo { position: absolute; right: {{ (width * 0.07) | round | int }}px; bottom: {{ (height * 0.09) | round | int }}px; height: {{ lh }}px; width: auto; max-width: {{ (width * 0.22) | round | int }}px; object-fit: contain; display: block; }
{% endif %}
{% if has_accent %}
/* accent · kicker highlight chip — ink text on the accent fill (the accent is never a text colour);
   the padding is cancelled by an equal negative margin so nothing reflows; an empty kicker gets no chip */
.kicker:not(:empty), body[data-ground="black"] .kicker:not(:empty) {
  background: var(--color-accent, var(--color-text-inverted));
  color: var(--color-text);
  border-radius: var(--radius-sm, 0px);
  width: fit-content;
  padding: .34em .66em .34em .8em;
  margin-left: -.8em;
  margin-right: -.66em;
  margin-top: -.34em;
  margin-bottom: -.34em;
}
/* accent · edge marker — a bar flush with the canvas edge, the height of the headline */
.headline { position: relative; }
.headline:not(:empty)::before {
  content: "";
  position: absolute;
  left: -{{ (width * 0.07) | round | int }}px;
  top: .1em;
  bottom: .1em;
  width: {{ (width * 0.009) | round | int }}px;
  background: var(--color-accent, transparent);
  border-radius: 0 var(--radius-sm, 0px) var(--radius-sm, 0px) 0;
}
{% endif %}
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <div class="kicker" data-slot="kicker">{{ kicker }}</div>
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    {% if has_image %}
    <figure class="image"><img data-image-key="0" alt=""/></figure>
    {% endif %}
    <div class="spacer"></div>
    <div class="band">
      {% if subhead %}
      <div class="subhead" data-slot="subhead">{{ subhead }}</div>
      {% endif %}
      {% if body %}
      <div class="body" data-slot="body">{{ body }}</div>
      {% endif %}
      {% if footer_right %}
      <div class="footer-row">
        <span data-slot="footer_right">{{ footer_right }}</span>
      </div>
      {% endif %}
    </div>
  </div>
{% if logo %}<img class="brand-logo" data-logo src="{{ logo }}" alt="">{% endif %}
</body>
</html>
