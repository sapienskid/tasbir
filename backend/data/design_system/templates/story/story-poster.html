<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{ width }}px;
  height: {{ height }}px;
  overflow: hidden;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
body[data-ground="black"] { background: var(--color-bg-inverted); color: var(--color-text-inverted); }

.sheet {
  height: 100%;
  padding: {{ (height * 0.09) | round | int }}px {{ (width * 0.08) | round | int }}px;
  display: flex;
  flex-direction: column;
}

/* poster headline floating high on an almost-empty canvas */
.headline {
  margin-top: {{ (height * 0.1) | round | int }}px;
  font-family: var(--font-display);
  font-size: {{ (width * 0.1) | round | int }}px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 0.94;
  max-width: {{ (width * 0.84) | round | int }}px;
}

.kicker {
  margin-top: {{ (height * 0.08) | round | int }}px;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}

.spacer { flex: 1; }

.band {
  border-top: 1px solid var(--color-border);
  padding-top: {{ (width * 0.025) | round | int }}px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-sans);
  font-size: {{ (width * 0.019) | round | int }}px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
}
body[data-ground="black"] .band { border-color: var(--color-border-inverted); }
.wordmark { font-family: var(--font-display); letter-spacing: -0.01em; color: var(--color-text); }
</style>
</head>
<body {% if ground == "black" %}data-ground="black"{% endif %}>
  <div class="sheet">
    <h1 class="headline" data-slot="headline">{{ headline }}</h1>
    <div class="kicker" data-slot="kicker">{{ kicker }}</div>
    <div class="spacer"></div>
    <div class="band">
      <span class="wordmark" data-slot="footer_left">{{ footer_left }}</span>
      <span data-slot="footer_right">{{ footer_right }}</span>
    </div>
  </div>
</body>
</html>
