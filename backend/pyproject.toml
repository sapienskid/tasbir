[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasbir"
version = "0.2.0"
description = "AI-powered social media asset generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "google-genai>=1.0.0",
    "litellm>=1.60.0",
    "playwright>=1.50.0",
    "langchain-google-genai>=2.0.0",
    "openai>=1.0.0",
    "pyjwt>=2.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.7.0",
    "minio>=7.2.0",
    "structlog>=24.0.0",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.2.0",
    "python-socketio>=5.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
