[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasbir"
version = "1.0.0"
description = "AI-powered social media asset pipeline — HTML + PNG output"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy[asyncio]==2.0.51",
    "aiosqlite==0.22.1",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "langgraph==1.2.10",
    "langchain-core==1.5.3",
    "google-genai==2.16.0",
    "langchain-google-genai==4.3.2",
    "openai==2.53.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.3",
    "dicebear-core==10.4.0",
    "dicebear-styles==10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Long, intentional content strings: prompt/instruction text, embedded
# SVG/JS templates, and verbatim test speeches. Wrapping would hurt
# readability, so E501 (line length) is relaxed for these files only.
"tests/test_services/test_verbatim_copy.py" = ["E501"]
"tests/test_services/test_tokens.py" = ["E501"]
"tests/test_agents/test_state.py" = ["E501"]
"tests/test_api/test_chat.py" = ["E501"]
"tests/test_services/test_illustration.py" = ["E501"]
"tests/test_services/test_media_tools.py" = ["E501"]
"tests/test_services/test_templates.py" = ["E501"]
"app/services/design_instruction.py" = ["E501"]
"app/services/illustration.py" = ["E501"]
"app/services/llm.py" = ["E501"]
"app/services/render_server.py" = ["E501"]
"app/services/tokens.py" = ["E501"]
"app/services/tools/illustrator.py" = ["E501"]
"app/services/tools/peep_styles.py" = ["E501"]
"app/services/tools/photo.py" = ["E501"]
"app/tasks/agent_jobs.py" = ["E501"]
"app/agents/orchestrator/nodes/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
