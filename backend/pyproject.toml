[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasbir"
version = "0.4.0"
description = "AI-powered social media asset pipeline — HTML + PNG output"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.139.2",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy[asyncio]==2.0.51",
    "aiosqlite==0.22.1",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "langgraph==1.2.9",
    "langchain-core==1.4.9",
    "google-genai==2.12.1",
    "langchain-google-genai==4.2.7",
    "openai==2.30.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
