brand:
  default_name: Tasbir Blog
  default_color: "#000000"

theming:
  readable_light_text: "#ffffff"
  readable_dark_text: "#000000"
  color_engine:
    surface_base_mix_target: "#ffffff"
    surface_base_mix_ratio_from_target: 1.0
    surface_base_fallback: "#ffffff"
    surface_elevated_mix_target: "#f5f5f5"
    surface_elevated_mix_ratio_from_target: 1.0
    surface_elevated_fallback: "#f5f5f5"
    border_subtle_mix_target: "#000000"
    border_subtle_mix_ratio_from_target: 1.0
    border_subtle_fallback: "#000000"
    secondary_text_mix_target: "#333333"
    secondary_text_mix_ratio_from_target: 1.0
    secondary_text_fallback: "#333333"
    muted_text_mix_target: "#888888"
    muted_text_mix_ratio_from_target: 1.0
    muted_text_fallback: "#888888"
    accent_glow_mix_target: "#000000"
    accent_glow_mix_ratio_from_target: 1.0
    overlay_strong_mix_target: "#000000"
    overlay_strong_mix_ratio_from_target: 0.4
    shadow_color_mix_target: "#000000"
    shadow_color_mix_ratio_from_target: 0.5
    primary_text_min_contrast: 4.5
    secondary_text_min_contrast: 3.8
    muted_text_min_contrast: 3
    border_subtle_min_contrast: 1.5
    accent_foreground_min_contrast: 4
  radius:
    card: "0px"
    pill: "0px"

formats:
  instagram-portrait:
    width: 1080
    height: 1350
    caption_source: instagram_caption
    hashtag_count: 3
    default_template_id: core/editorial-base
  instagram-square:
    width: 1080
    height: 1080
    caption_source: instagram_caption
    hashtag_count: 3
    default_template_id: core/editorial-base
  instagram-story:
    width: 1080
    height: 1920
    caption_source: instagram_caption
    hashtag_count: 2
    default_template_id: core/editorial-base
  carousel-post:
    width: 1080
    height: 1350
    caption_source: carousel_slides
    hashtag_count: 0
    default_template_id: core/carousel-cover
  twitter-card:
    width: 1200
    height: 630
    caption_source: twitter_caption
    hashtag_count: 0
    default_template_id: core/bold-base
  linkedin-post:
    width: 1200
    height: 627
    caption_source: linkedin_caption
    hashtag_count: 0
    default_template_id: core/editorial-base

preview_defaults:
  title: Building a Monochromatic Swiss Content Engine That Scales Across Every Platform
  caption: A practical system for turning one source article into platform-native outputs with consistent structure, language discipline, and reusable visual identity.
  heading: Structure first. Style through tokens.
  body: Templates stay skeletal while one centralized tokenized CSS system controls color, typography, spacing, and tone so every output remains cohesive as your template library evolves.
  slide_number: 1
  total_slides: 5

templates:
  - id: core/editorial-base
    label: Editorial Base
    description: Clean Swiss editorial layout with bold serif headline and justified body text.
    file: ../templates/editorial-base.html
  - id: core/bold-base
    label: Bold Base (Light)
    description: High-contrast statement layout with CTA.
    file: ../templates/bold-base.html
  - id: core/statement-dark
    label: Statement (Dark)
    description: Inverted monochromatic layout for strong visual contrast.
    file: ../templates/statement-dark.html
  - id: core/quote-card
    label: Quote Card
    description: Elegant pull-quote layout with attribution.
    file: ../templates/quote-card.html
  - id: core/carousel-cover
    label: Carousel Cover
    description: Impactful opening slide for carousel series.
    file: ../templates/carousel-cover.html
  - id: core/carousel-content
    label: Carousel Content
    description: Supporting content slide for carousels with slide index.
    file: ../templates/carousel-content.html
  - id: core/metric-card
    label: Metric Card
    description: Data-driven slide focusing on one key number.
    file: ../templates/metric-card.html
  - id: core/cta-card
    label: CTA Card
    description: Closing statement designed intended to drive action.
    file: ../templates/cta-card.html
