    file: ../templates/data-base.html
  - id: core/quote-focus
    styles:
      - editorial
      - illustration
      - minimal
      - bold
      - data
      - monochrome-swiss
      - brutal
    label: Core Quote Focus
    archetypes:
      - quote
    file: ../templates/quote-focus.html
  - id: core/checklist-stack
    styles:
      - editorial
      - illustration
      - minimal
      - bold
      - data
      - monochrome-swiss
      - brutal
    label: Core Checklist Stack
    archetypes:
      - checklist
      - timeline
    file: ../templates/checklist-stack.html
  - id: core/metric-split
    styles:
      - editorial
      - illustration
      - minimal
      - bold
      - data
      - monochrome-swiss
      - brutal
    label: Core Metric Split
    archetypes:
      - metric
    file: ../templates/metric-split.html
  - id: core/promo-pill
    styles:
      - editorial
      - illustration
      - minimal
      - bold
      - data
      - monochrome-swiss
      - brutal
