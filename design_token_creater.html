<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design System Generator v2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0b;--surface:#141414;--surface2:#1c1c1c;--surface3:#242424;
  --border:#252525;--border2:#313131;--border3:#3d3d3d;
  --text:#e2e2e2;--text2:#999;--text3:#555;
  --accent:#fff;--accent-dim:rgba(255,255,255,0.06);
  --green:#22c55e;--red:#f43f5e;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'Fira Code',monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;display:flex;flex-direction:column}

.hdr{height:44px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.hdr-title{font-weight:700;font-size:13px;letter-spacing:-0.01em}
.hdr-pill{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--border3);border-radius:3px;color:var(--text3)}
.hdr-status{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text3);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.body{display:flex;flex:1;overflow:hidden;min-height:0}

.sb{width:290px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
.sb-input{padding:14px;border-bottom:1px solid var(--border);flex-shrink:0}
.lbl{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.vi{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:12px;padding:9px 11px;resize:none;outline:none;border-radius:5px;line-height:1.5;transition:border-color .15s}
.vi:focus{border-color:var(--border3)}
.vi::placeholder{color:var(--text3)}
.gbtn{width:100%;margin-top:9px;padding:9px;background:var(--accent);color:var(--bg);border:none;border-radius:5px;font-family:var(--font);font-weight:700;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.gbtn:hover{opacity:.85}
.gbtn:disabled{opacity:.25;cursor:not-allowed}
.presets{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0}
.pchip{font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--border2);border-radius:3px;background:transparent;color:var(--text3);cursor:pointer;transition:all .1s}
.pchip:hover{border-color:var(--border3);color:var(--text2)}
.pchip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}

.te{flex:1;overflow-y:auto}
.te::-webkit-scrollbar{width:3px}
.te::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.ts{border-bottom:1px solid var(--border)}
.tsh{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;transition:background .1s;user-select:none}
.tsh:hover{background:var(--surface2)}
.tsn{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3)}
.tsa{font-size:9px;color:var(--text3);transition:transform .2s}
.ts.op .tsa{transform:rotate(180deg)}
.tsb{display:none;padding:12px 14px;background:var(--bg)}
.ts.op .tsb{display:block}
.cg{margin-bottom:10px}
.cgl{font-size:8px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.sr{display:flex;gap:2px;border-radius:3px;overflow:hidden}
.sw{flex:1;height:20px;position:relative;cursor:default;transition:flex .15s}
.sw:hover{flex:2.5}
.swt{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);padding:2px 5px;border-radius:2px;font-family:var(--mono);font-size:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;z-index:20}
.sw:hover .swt{opacity:1}
.cpr{display:flex;align-items:center;gap:7px;padding:3px 0}
.cd{width:14px;height:14px;border-radius:2px;border:1px solid rgba(255,255,255,0.08);flex-shrink:0}
.cn{font-size:10px;font-weight:500;color:var(--text2)}
.cv{font-family:var(--mono);font-size:8px;color:var(--text3);margin-left:auto}
.tr{display:flex;align-items:baseline;gap:8px;padding:3px 0;border-bottom:1px solid var(--border)}
.tk{font-family:var(--mono);font-size:8px;color:var(--text3);min-width:28px}
.spr{display:flex;align-items:center;gap:7px;padding:2px 0}
.spb{height:3px;background:var(--text);border-radius:1px;flex-shrink:0;opacity:.5}
.spv{font-family:var(--mono);font-size:8px;color:var(--text3)}
.shrow{display:flex;align-items:center;gap:8px;padding:5px 0}
.shbox{width:28px;height:16px;background:var(--surface2);border-radius:2px;flex-shrink:0}
.shn{font-family:var(--mono);font-size:8px;color:var(--text3);min-width:20px}
.grrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.grstrip{width:56px;height:14px;border-radius:2px;flex-shrink:0}
.grn{font-family:var(--mono);font-size:8px;color:var(--text3)}
.rrrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.rrbox{width:22px;height:14px;background:var(--text2);opacity:.12;flex-shrink:0}
.rrn{font-family:var(--mono);font-size:8px;color:var(--text3);min-width:24px}
.rrv{font-family:var(--mono);font-size:8px;color:var(--text3)}
.comprow{display:flex;justify-content:space-between;align-items:center;padding:2px 0;font-size:10px}
.compk{color:var(--text3)}
.compv{font-family:var(--mono);font-size:8px;color:var(--text2)}
.te-empty{padding:24px 14px;text-align:center;color:var(--text3);font-size:11px;line-height:1.7}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.demo-sec{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;border-bottom:1px solid var(--border)}
.tabbar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);align-items:center}
.tabbtn{padding:10px 16px;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:var(--text3);transition:color .15s;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbtn:hover{color:var(--text2)}
.tabbtn.on{color:var(--text);border-bottom-color:var(--accent)}
.rgbtn{margin-left:auto;margin-right:12px;padding:4px 10px;background:transparent;border:1px solid var(--border2);border-radius:3px;font-family:var(--font);font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);cursor:pointer;transition:all .1s}
.rgbtn:hover{border-color:var(--border3);color:var(--text2)}
.demo-area{flex:1;position:relative;overflow:hidden;background:var(--surface2)}
iframe#df{width:100%;height:100%;border:none;display:none;background:#fff}
.dph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3)}
.dph-ico{font-size:28px;opacity:.25}
.dph-lbl{font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase}
.dph-sub{font-size:10px;color:var(--text3)}
.dl{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10}
.sp{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dlt{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3)}
.dls{font-size:10px;color:var(--text3)}

.exp-sec{height:200px;display:flex;flex-direction:column;flex-shrink:0;background:var(--surface)}
.exp-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
.etbtn{padding:8px 13px;font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:var(--text3);transition:color .1s}
.etbtn:hover{color:var(--text2)}
.etbtn.on{color:var(--text)}
.cpbtn{margin-left:auto;margin-right:12px;padding:4px 11px;background:transparent;border:1px solid var(--border2);border-radius:3px;font-family:var(--font);font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);cursor:pointer;transition:all .1s}
.cpbtn:hover{border-color:var(--accent);color:var(--accent)}
.cpbtn.ok{border-color:var(--green);color:var(--green)}
.ec{flex:1;overflow:auto;padding:10px 14px;font-family:var(--mono);font-size:9px;line-height:1.8;color:var(--text3);white-space:pre;background:var(--bg)}
.ec::-webkit-scrollbar{width:3px;height:3px}
.ec::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-title">Design System</span>
  <span class="hdr-pill">Generator v2</span>
  <span class="hdr-status" id="st">READY — ENTER A VIBE TO BEGIN</span>
</div>
<div class="body">
  <div class="sb">
    <div class="sb-input">
      <div class="lbl">Vibe</div>
      <textarea class="vi" id="vi" rows="3" placeholder="cold brutalist luxury… warm organic wellness… maximalist streetwear… retro-futurist tech…"></textarea>
      <button class="gbtn" id="gb" onclick="gen()">Generate System</button>
    </div>
    <div class="presets" id="pr"></div>
    <div class="te" id="te"><div class="te-empty">Generate a design system<br>to explore tokens here</div></div>
  </div>
  <div class="main">
    <div class="demo-sec">
      <div class="tabbar">
        <button class="tabbtn on" onclick="setTab('components')">Components</button>
        <button class="tabbtn" onclick="setTab('landing')">Landing Page</button>
        <button class="tabbtn" onclick="setTab('poster')">Poster</button>
        <button class="rgbtn" id="rg" style="display:none" onclick="regenDemo()">↺ Regen</button>
      </div>
      <div class="demo-area">
        <div class="dph" id="dph">
          <div class="dph-ico">◈</div>
          <div class="dph-lbl">No system generated</div>
          <div class="dph-sub">Enter a vibe and generate</div>
        </div>
        <div class="dl" id="dl">
          <div class="sp"></div>
          <div class="dlt" id="dlt">Building tokens…</div>
          <div class="dls" id="dls">Designing your system</div>
        </div>
        <iframe id="df" title="Design Preview" allow="*"></iframe>
      </div>
    </div>
    <div class="exp-sec">
      <div class="exp-tabs">
        <button class="etbtn on" onclick="setExp('css')">CSS Vars</button>
        <button class="etbtn" onclick="setExp('json')">W3C JSON</button>
        <button class="etbtn" onclick="setExp('prompt')">AI Prompt</button>
        <button class="cpbtn" id="cp" onclick="doCopy()">Copy</button>
      </div>
      <pre class="ec" id="ec">/* Generate a design system to see exports */</pre>
    </div>
  </div>
</div>
<script>
const S={tokens:null,demos:{components:null,landing:null,poster:null},tab:'components',exp:'css',vibe:''};
let aPreset=null;
let blobUrl=null;

const PRESETS=[
  {id:'luxury',l:'Luxury'},{id:'brutalist',l:'Brutalist'},
  {id:'organic',l:'Organic'},{id:'tech',l:'Dark Tech'},
  {id:'editorial',l:'Editorial'},{id:'playful',l:'Playful'},
  {id:'gothic',l:'Gothic'},{id:'retro',l:'Retro Futurist'},
  {id:'minimal',l:'Minimal'},{id:'maximalist',l:'Maximalist'},
];

const pr=document.getElementById('pr');
PRESETS.forEach(p=>{
  const b=document.createElement('button');
  b.className='pchip';b.textContent=p.l;b.dataset.id=p.id;
  b.onclick=()=>{
    aPreset=p.id===aPreset?null:p.id;
    document.querySelectorAll('.pchip').forEach(x=>x.classList.toggle('on',x.dataset.id===aPreset));
  };
  pr.appendChild(b);
});

async function api(msgs,max=1500){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:max,messages:msgs})
  });
  const d=await r.json();
  if(d.error) throw new Error(d.error.message);
  return (d.content||[]).map(b=>b.text||'').join('');
}

async function gen(){
  const vi=document.getElementById('vi').value.trim();
  const pl=aPreset?PRESETS.find(p=>p.id===aPreset)?.l:null;
  if(!vi&&!pl){alert('Enter a vibe or select a preset.');return;}
  S.vibe=[pl,vi].filter(Boolean).join(' + ');
  S.demos={components:null,landing:null,poster:null};
  document.getElementById('gb').disabled=true;
  document.getElementById('rg').style.display='none';
  setStatus('GENERATING TOKENS…');
  showLoad('Building token system…',S.vibe);

  const tp=`You are an expert design system architect. Generate a complete design token system for this vibe: "${S.vibe}"

Return ONLY valid JSON, no markdown fences, no explanation, no comments:
{
  "colors":{
    "primary":{"50":"#hex","100":"#hex","200":"#hex","300":"#hex","400":"#hex","500":"#hex","600":"#hex","700":"#hex","800":"#hex","900":"#hex"},
    "secondary":{"50":"#hex","100":"#hex","500":"#hex","700":"#hex","900":"#hex"},
    "accent":{"light":"#hex","base":"#hex","dark":"#hex"},
    "neutral":{"50":"#hex","100":"#hex","200":"#hex","300":"#hex","400":"#hex","500":"#hex","600":"#hex","700":"#hex","800":"#hex","900":"#hex"},
    "semantic":{"success":"#hex","warning":"#hex","error":"#hex","info":"#hex"},
    "surface":{"base":"#hex","subtle":"#hex","elevated":"#hex","overlay":"#hex"},
    "text":{"primary":"#hex","secondary":"#hex","muted":"#hex","inverse":"#hex","accent":"#hex"}
  },
  "typography":{
    "fontSans":"Google Font name only",
    "fontSerif":"Google Font name only",
    "fontMono":"Google Font name only",
    "scale":{"xs":11,"sm":13,"base":16,"lg":18,"xl":20,"2xl":24,"3xl":30,"4xl":36,"5xl":48,"6xl":64,"7xl":80},
    "weights":{"light":300,"regular":400,"medium":500,"semibold":600,"bold":700,"black":900},
    "tracking":{"tight":"-0.03em","normal":"0","wide":"0.04em","wider":"0.1em","widest":"0.2em"},
    "leading":{"tight":1.1,"snug":1.3,"normal":1.5,"relaxed":1.7,"loose":2.0}
  },
  "spacing":{"base":4,"scale":[2,4,6,8,12,16,20,24,32,40,48,64,80,96,128]},
  "border":{
    "width":{"hairline":"0.5px","thin":"1px","normal":"1.5px","medium":"2px","thick":"3px"},
    "radius":{"none":"0","xs":"2px","sm":"4px","md":"8px","lg":"12px","xl":"16px","2xl":"24px","3xl":"32px","full":"9999px"}
  },
  "shadow":{
    "xs":"0 1px 2px rgba(0,0,0,0.05)",
    "sm":"0 2px 4px rgba(0,0,0,0.08)",
    "md":"0 4px 12px rgba(0,0,0,0.12)",
    "lg":"0 8px 24px rgba(0,0,0,0.16)",
    "xl":"0 16px 48px rgba(0,0,0,0.22)",
    "inner":"inset 0 2px 4px rgba(0,0,0,0.08)"
  },
  "gradient":{
    "primary":"linear-gradient(135deg, #hex 0%, #hex 100%)",
    "hero":"linear-gradient(135deg, #hex 0%, #hex 50%, #hex 100%)",
    "subtle":"linear-gradient(180deg, #hex 0%, #hex 100%)",
    "surface":"linear-gradient(135deg, #hex 0%, #hex 100%)"
  },
  "motion":{
    "duration":{"instant":"50ms","fast":"100ms","normal":"200ms","slow":"350ms","slower":"500ms"},
    "easing":{"default":"cubic-bezier(0.4,0,0.2,1)","in":"cubic-bezier(0.4,0,1,1)","out":"cubic-bezier(0,0,0.2,1)","bounce":"cubic-bezier(0.34,1.56,0.64,1)"}
  },
  "component":{
    "button":{"height":"40px","heightSm":"32px","heightLg":"48px","paddingX":"16px","radius":"8px","fontWeight":600,"fontSize":"14px"},
    "card":{"padding":"24px","paddingLg":"32px","radius":"16px","shadow":"md","border":"hairline"},
    "input":{"height":"40px","paddingX":"12px","paddingY":"10px","radius":"8px","borderWidth":"1.5px"},
    "badge":{"height":"24px","paddingX":"10px","radius":"9999px","fontSize":"11px","fontWeight":600},
    "nav":{"height":"64px","paddingX":"24px"}
  },
  "meta":{
    "vibeName":"2-3 WORD ALL CAPS NAME",
    "description":"one sentence design character",
    "aesthetic":"one adjective",
    "palette":"light or dark"
  }
}`;

  try{
    const raw=await api([{role:'user',content:tp}],2000);
    const cleaned=raw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    S.tokens=JSON.parse(cleaned);
    renderTokens(S.tokens);
    updExp();
    setStatus(`TOKENS READY — ${S.tokens.meta?.vibeName||S.vibe.toUpperCase()}`);
    await genDemo(S.tab);
  }catch(e){
    hideLoad();
    setStatus('ERROR — CHECK CONSOLE');
    console.error('Token gen error:',e);
  }
  document.getElementById('gb').disabled=false;
}

async function genDemo(type){
  if(!S.tokens)return;
  S.demos[type]=null;
  showLoad(`Generating ${type} demo…`,`Applying ${S.tokens.meta?.vibeName||'design system'}…`);
  document.getElementById('rg').style.display='none';
  const css=tokCSS(S.tokens);
  const fi=fontImport(S.tokens);

  const prompts={
    components:`Create a beautiful single-file HTML design system showcase page. Output ONLY the complete HTML document starting with <!DOCTYPE html>.

${fi}

Define these CSS custom properties in :root {}:
${css}

Design system vibe: ${S.tokens.meta?.vibeName} — ${S.tokens.meta?.description}
Color mode: ${S.tokens.meta?.palette}

Build a complete page with:
1. Sticky nav with logo and navigation links and a CTA button styled with var(--color-primary-500) or appropriate primary color
2. Hero section with a large headline, subheadline, and 2-3 buttons (primary, secondary, ghost styles)
3. A 3-column feature cards grid — each card has an icon (use SVG or emoji), title, description, styled using card token values
4. A form section with labeled inputs, a select dropdown, textarea, and submit button
5. Badges/tags in 4-5 variants (success, warning, error, neutral, primary)
6. A stats row with 3-4 big numbers and labels
7. Footer with columns of links

IMPORTANT: Use the CSS variables defined above for ALL colors, spacing, fonts, shadows, and radii. Make it genuinely beautiful — bold typography, strong visual hierarchy, real personality matching the vibe. The page must be fully self-contained with no external dependencies except Google Fonts.`,

    landing:`Create a stunning single-file HTML landing page for a fictional brand that embodies this design system. Output ONLY the complete HTML document starting with <!DOCTYPE html>.

${fi}

Define these CSS custom properties in :root {}:
${css}

Design system vibe: ${S.tokens.meta?.vibeName} — ${S.tokens.meta?.description}
Color mode: ${S.tokens.meta?.palette}

Invent a compelling product name and concept that matches the vibe. Build a complete marketing page:
1. Full-width hero with massive headline, subheadline, hero image (use CSS shapes/gradients as placeholder), and CTAs
2. Social proof row (logos as text/shapes, or a testimonial strip)
3. 3-4 feature sections with alternating image+text layouts
4. A testimonials or quote section with pull quotes
5. Pricing cards or final CTA section
6. Footer with links and brand identity

IMPORTANT: Use the CSS variables defined above for ALL styling. Be bold — unexpected layout choices, dramatic typography, creative use of gradients and shadows. The page must be fully self-contained. NOT a generic SaaS template.`,

    poster:`Create a stunning single-file HTML graphic design piece that fills the viewport. Output ONLY the complete HTML document starting with <!DOCTYPE html>.

${fi}

Define these CSS custom properties in :root {}:
${css}

Design system vibe: ${S.tokens.meta?.vibeName} — ${S.tokens.meta?.description}
Color mode: ${S.tokens.meta?.palette}

Choose whichever format fits the vibe: magazine cover, event poster, typographic poster, editorial spread, data art, zine page, etc.

Make it visually DRAMATIC:
- Use large display typography from the font/scale tokens (var(--text-6xl), var(--text-7xl))
- Strong geometric or abstract elements using CSS (borders, gradients, clip-path, transforms)
- Creative use of gradient tokens as backgrounds or elements
- Unexpected spatial composition — overlap, asymmetry, diagonal, grid-breaking
- The personality of the vibe should be immediately obvious

IMPORTANT: Use the CSS variables defined above. Fill the full viewport (100vw, 100vh). Fully self-contained. Make it something someone would actually want to print or share.`
  };

  try{
    const html=await api([{role:'user',content:prompts[type]}],4000);
    // Strip any markdown fences if model wraps it
    let clean=html.trim();
    if(clean.startsWith('```')){
      clean=clean.replace(/^```html?\s*/,'').replace(/```\s*$/,'').trim();
    }
    // Ensure it starts with doctype
    if(!clean.toLowerCase().startsWith('<!doctype')){
      const idx=clean.toLowerCase().indexOf('<!doctype');
      if(idx>-1) clean=clean.substring(idx);
    }
    S.demos[type]=clean;
    showDemo(clean);
    document.getElementById('rg').style.display='';
    setStatus(`DEMO READY — ${type.toUpperCase()} / ${S.tokens.meta?.vibeName}`);
  }catch(e){
    hideLoad();
    setStatus('DEMO ERROR — CHECK CONSOLE');
    console.error('Demo gen error:',e);
  }
}

async function regenDemo(){
  S.demos[S.tab]=null;
  await genDemo(S.tab);
}

function showDemo(html){
  // Revoke previous blob URL to free memory
  if(blobUrl) URL.revokeObjectURL(blobUrl);
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  blobUrl=URL.createObjectURL(blob);
  const f=document.getElementById('df');
  f.src=blobUrl;
  f.style.display='block';
  document.getElementById('dph').style.display='none';
  document.getElementById('dl').style.display='none';
  document.getElementById('rg').style.display='';
}

async function setTab(t){
  S.tab=t;
  document.querySelectorAll('.tabbtn').forEach((b,i)=>{
    b.classList.toggle('on',['components','landing','poster'][i]===t);
  });
  if(S.demos[t]){
    showDemo(S.demos[t]);
  } else if(S.tokens){
    await genDemo(t);
  } else {
    document.getElementById('df').style.display='none';
    document.getElementById('dph').style.display='flex';
    document.getElementById('dl').style.display='none';
    document.getElementById('rg').style.display='none';
  }
}

function showLoad(t,s){
  document.getElementById('dph').style.display='none';
  document.getElementById('df').style.display='none';
  document.getElementById('dl').style.display='flex';
  document.getElementById('dlt').textContent=t;
  document.getElementById('dls').textContent=s;
}
function hideLoad(){
  document.getElementById('dl').style.display='none';
}
function setStatus(t){
  document.getElementById('st').textContent=t;
}

// ── TOKEN EXPLORER ──
function renderTokens(t){
  const el=document.getElementById('te');
  el.innerHTML='';
  el.appendChild(mkSec('Color',renderColors(t.colors),true));
  el.appendChild(mkSec('Typography',renderType(t.typography)));
  el.appendChild(mkSec('Spacing',renderSpacing(t.spacing)));
  el.appendChild(mkSec('Shadows',renderShadows(t.shadow)));
  el.appendChild(mkSec('Border & Radius',renderBorders(t.border)));
  el.appendChild(mkSec('Gradients',renderGrads(t.gradient)));
  el.appendChild(mkSec('Components',renderComps(t.component)));
}

function mkSec(title,content,open=false){
  const s=document.createElement('div');
  s.className='ts'+(open?' op':'');
  s.innerHTML=`<div class="tsh"><span class="tsn">${title}</span><span class="tsa">▾</span></div><div class="tsb"></div>`;
  s.querySelector('.tsh').addEventListener('click',()=>s.classList.toggle('op'));
  s.querySelector('.tsb').appendChild(content);
  return s;
}

function el2(tag,cls='',html=''){
  const e=document.createElement(tag);
  e.className=cls;
  e.innerHTML=html;
  return e;
}

function renderColors(c){
  const w=document.createElement('div');
  if(!c)return w;
  [['Primary',c.primary,['50','100','200','300','400','500','600','700','800','900']],
   ['Secondary',c.secondary,['50','100','500','700','900']],
   ['Accent',c.accent,['light','base','dark']],
   ['Neutral',c.neutral,['50','100','200','300','400','500','600','700','800','900']]
  ].forEach(([lbl,data,keys])=>{
    if(!data)return;
    const g=el2('div','cg',`<div class="cgl">${lbl}</div>`);
    const r=el2('div','sr');
    keys.forEach(k=>{
      if(!data[k])return;
      const s=el2('div','sw');
      s.style.background=data[k];
      s.innerHTML=`<div class="swt">${k}: ${data[k]}</div>`;
      r.appendChild(s);
    });
    g.appendChild(r);
    w.appendChild(g);
  });
  const extras=[...Object.entries(c.semantic||{}),...Object.entries(c.text||{}),...Object.entries(c.surface||{})];
  extras.forEach(([k,v])=>{
    w.appendChild(el2('div','cpr',`<div class="cd" style="background:${v}"></div><div class="cn">${k}</div><div class="cv">${v}</div>`));
  });
  return w;
}

function renderType(ty){
  const w=document.createElement('div');
  if(!ty)return w;
  w.innerHTML=`<div style="font-family:var(--mono);font-size:8px;color:var(--text3);line-height:2;margin-bottom:8px">SANS: ${ty.fontSans||''}<br>SERIF: ${ty.fontSerif||''}<br>MONO: ${ty.fontMono||''}</div>`;
  Object.entries(ty.scale||{}).forEach(([k,v])=>{
    const r=el2('div','tr');
    r.innerHTML=`<span class="tk">${k}</span><span style="font-size:${Math.min(v,28)}px;line-height:1;color:var(--text2);flex:1;overflow:hidden;white-space:nowrap">Aa</span><span style="font-family:var(--mono);font-size:8px;color:var(--text3);margin-left:6px">${v}px</span>`;
    w.appendChild(r);
  });
  return w;
}

function renderSpacing(sp){
  const w=document.createElement('div');
  if(!sp)return w;
  (sp.scale||[]).forEach(v=>{
    w.appendChild(el2('div','spr',`<div class="spb" style="width:${Math.min(v*1.4,220)}px"></div><div class="spv">${v}px</div>`));
  });
  return w;
}

function renderShadows(sh){
  const w=document.createElement('div');
  if(!sh)return w;
  Object.entries(sh).forEach(([k,v])=>{
    w.appendChild(el2('div','shrow',`<div class="shbox" style="box-shadow:${v}"></div><div class="shn">${k}</div>`));
  });
  return w;
}

function renderBorders(b){
  const w=document.createElement('div');
  if(!b||!b.radius)return w;
  w.appendChild(el2('div','cgl','Radius'));
  Object.entries(b.radius).forEach(([k,v])=>{
    w.appendChild(el2('div','rrrow',`<div class="rrbox" style="border-radius:${v};background:var(--text2);opacity:0.2"></div><div class="rrn">${k}</div><div class="rrv">${v}</div>`));
  });
  return w;
}

function renderGrads(g){
  const w=document.createElement('div');
  if(!g)return w;
  Object.entries(g).forEach(([k,v])=>{
    w.appendChild(el2('div','grrow',`<div class="grstrip" style="background:${v}"></div><div class="grn">${k}</div>`));
  });
  return w;
}

function renderComps(c){
  const w=document.createElement('div');
  if(!c)return w;
  Object.entries(c).forEach(([name,vals])=>{
    w.appendChild(el2('div','cgl',name));
    Object.entries(vals).forEach(([k,v])=>{
      w.appendChild(el2('div','comprow',`<span class="compk">${k}</span><span class="compv">${v}</span>`));
    });
  });
  return w;
}

// ── TOKEN → CSS ──
function tokCSS(t){
  if(!t)return '';
  const L=[':root {','  /* COLOR */'];
  const c=t.colors||{};
  ['primary','secondary','accent','neutral'].forEach(g=>{
    Object.entries(c[g]||{}).forEach(([k,v])=>L.push(`  --color-${g}-${k}: ${v};`));
  });
  Object.entries(c.semantic||{}).forEach(([k,v])=>L.push(`  --color-${k}: ${v};`));
  Object.entries(c.surface||{}).forEach(([k,v])=>L.push(`  --surface-${k}: ${v};`));
  Object.entries(c.text||{}).forEach(([k,v])=>L.push(`  --text-${k}: ${v};`));
  const ty=t.typography||{};
  L.push('','  /* TYPOGRAPHY */');
  if(ty.fontSans)L.push(`  --font-sans: '${ty.fontSans}', sans-serif;`);
  if(ty.fontSerif)L.push(`  --font-serif: '${ty.fontSerif}', serif;`);
  if(ty.fontMono)L.push(`  --font-mono: '${ty.fontMono}', monospace;`);
  Object.entries(ty.scale||{}).forEach(([k,v])=>L.push(`  --text-${k}: ${v}px;`));
  Object.entries(ty.tracking||{}).forEach(([k,v])=>L.push(`  --tracking-${k}: ${v};`));
  Object.entries(ty.leading||{}).forEach(([k,v])=>L.push(`  --leading-${k}: ${v};`));
  L.push('','  /* SPACING */');
  (t.spacing?.scale||[]).forEach((v,i)=>L.push(`  --space-${i+1}: ${v}px;`));
  L.push('','  /* BORDER */');
  Object.entries(t.border?.width||{}).forEach(([k,v])=>L.push(`  --border-${k}: ${v};`));
  Object.entries(t.border?.radius||{}).forEach(([k,v])=>L.push(`  --radius-${k}: ${v};`));
  L.push('','  /* SHADOW */');
  Object.entries(t.shadow||{}).forEach(([k,v])=>L.push(`  --shadow-${k}: ${v};`));
  L.push('','  /* GRADIENT */');
  Object.entries(t.gradient||{}).forEach(([k,v])=>L.push(`  --gradient-${k}: ${v};`));
  L.push('','  /* MOTION */');
  Object.entries(t.motion?.duration||{}).forEach(([k,v])=>L.push(`  --duration-${k}: ${v};`));
  Object.entries(t.motion?.easing||{}).forEach(([k,v])=>L.push(`  --easing-${k}: ${v};`));
  L.push('','  /* COMPONENT */');
  Object.entries(t.component||{}).forEach(([name,vals])=>{
    Object.entries(vals).forEach(([k,v])=>L.push(`  --${name}-${k}: ${v};`));
  });
  L.push('}');
  return L.join('\n');
}

function fontImport(t){
  const ty=t.typography||{};
  const fs=[ty.fontSans,ty.fontSerif,ty.fontMono].filter(Boolean);
  if(!fs.length)return '';
  const q=fs.map(f=>`family=${encodeURIComponent(f)}:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400`).join('&');
  return `<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?${q}&display=swap" rel="stylesheet">`;
}

// ── EXPORT ──
function getCSS(t){return tokCSS(t)||'/* No tokens yet */';}
function getJSON(t){
  if(!t)return'{}';
  return JSON.stringify({"$schema":"https://design-tokens.github.io/community-group/format/",...t},null,2);
}
function getPrompt(t){
  if(!t)return'No tokens generated.';
  const c=t.colors||{},ty=t.typography||{};
  return `DESIGN SYSTEM — ${t.meta?.vibeName||'CUSTOM'}
${t.meta?.description||''}  |  Aesthetic: ${t.meta?.aesthetic||''}  |  Mode: ${t.meta?.palette||''}

━━ COLORS ━━
Primary: ${Object.values(c.primary||{}).join(' → ')}
Secondary: ${Object.values(c.secondary||{}).join(' → ')}
Accent: ${Object.values(c.accent||{}).join(' / ')}
Neutral: ${Object.values(c.neutral||{}).join(' → ')}
Semantic: success ${c.semantic?.success} | warning ${c.semantic?.warning} | error ${c.semantic?.error} | info ${c.semantic?.info}
Surfaces: ${Object.entries(c.surface||{}).map(([k,v])=>`${k}: ${v}`).join(' | ')}
Text: ${Object.entries(c.text||{}).map(([k,v])=>`${k}: ${v}`).join(' | ')}

━━ TYPOGRAPHY ━━
Sans: ${ty.fontSans} | Serif: ${ty.fontSerif} | Mono: ${ty.fontMono}
Scale: ${Object.entries(ty.scale||{}).map(([k,v])=>`${k}:${v}px`).join(', ')}
Weights: ${Object.entries(ty.weights||{}).map(([k,v])=>`${k}:${v}`).join(', ')}
Tracking: ${Object.entries(ty.tracking||{}).map(([k,v])=>`${k}:${v}`).join(' | ')}
Leading: ${Object.entries(ty.leading||{}).map(([k,v])=>`${k}:${v}`).join(' | ')}

━━ SPACING ━━
Base: ${t.spacing?.base}px | Scale: ${(t.spacing?.scale||[]).join(', ')}px

━━ BORDER RADIUS ━━
${Object.entries((t.border?.radius)||{}).map(([k,v])=>`${k}: ${v}`).join(' | ')}

━━ SHADOWS ━━
${Object.entries(t.shadow||{}).map(([k,v])=>`${k}: ${v}`).join('\n')}

━━ GRADIENTS ━━
${Object.entries(t.gradient||{}).map(([k,v])=>`${k}: ${v}`).join('\n')}

━━ MOTION ━━
${Object.entries((t.motion?.duration)||{}).map(([k,v])=>`${k}: ${v}`).join(' | ')}
Easing default: ${t.motion?.easing?.default}

━━ COMPONENT TOKENS ━━
${Object.entries(t.component||{}).map(([n,v])=>`${n}: ${Object.entries(v).map(([k,val])=>`${k}=${val}`).join(', ')}`).join('\n')}

━━ USAGE RULES ━━
- Use ONLY the colors, fonts, spacing, and sizing values above
- Background scheme: ${t.meta?.palette}. Personality: ${t.meta?.aesthetic}
- Apply token discipline strictly — no arbitrary values outside this system`;
}

function setExp(e){
  S.exp=e;
  document.querySelectorAll('.etbtn').forEach((b,i)=>b.classList.toggle('on',['css','json','prompt'][i]===e));
  updExp();
}
function updExp(){
  const el=document.getElementById('ec');
  if(!S.tokens){el.textContent='/* Generate a design system to see exports */';return;}
  if(S.exp==='css')el.textContent=getCSS(S.tokens);
  else if(S.exp==='json')el.textContent=getJSON(S.tokens);
  else el.textContent=getPrompt(S.tokens);
}
async function doCopy(){
  await navigator.clipboard.writeText(document.getElementById('ec').textContent);
  const b=document.getElementById('cp');
  b.textContent='Copied!';b.classList.add('ok');
  setTimeout(()=>{b.textContent='Copy';b.classList.remove('ok');},1500);
}
</script>
