# ─────────────────────────────────────────────────────────────────────────
# FULL stack — existing automation stack + Tasbir (single file).
#
#   docker compose -f docker-compose.automation.yml up -d --build
#
# Resource reuse:
#   - ONE external-ish `automation-net` network shared by everything
#   - ONE `redis` (yours) — Tasbir's api/worker/beat use REDIS_URL=redis://redis:6379/0
#   - Tasbir's Playwright render service is internal-only (key-authed)
#
# Env: your existing .env must contain your stack's vars PLUS Tasbir's:
#   GEMINI_API_KEY, API_KEYS, RENDER_SERVICE_KEY (required)
#   OPENROUTER_API_KEY, PEXELS_API_KEY, PIXABAY_API_KEY, IMAGE_ALLOW_HOSTS,
#   RATE_LIMIT_PER_MIN, OUTPUT_TTL_HOURS, SKIP_VERIFY (optional)
# ─────────────────────────────────────────────────────────────────────────

name: automation

networks:
  automation-net:
    name: automation-net
    driver: bridge

volumes:
  n8n_storage:
  automation_db_data:
  redis_data:
  beszel_data:
  beszel_agent_data:
  linkding_data:
  crawl4ai_data:
  ntfy_cache:
  couchdb_data:
  frontend-dist:

x-tasbir-env: &tasbir-env
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  DATABASE_URL: sqlite+aiosqlite:///data/tasbir.db
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_KEYS: ${API_KEYS:-}
  RENDER_SERVICE_KEY: ${RENDER_SERVICE_KEY:-}
  RENDERER_URL: http://playwright:4000
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
  IMAGE_ALLOW_HOSTS: ${IMAGE_ALLOW_HOSTS:-}
  IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-10485760}
  IMAGE_MAX_REDIRECTS: ${IMAGE_MAX_REDIRECTS:-2}
  OUTPUT_TTL_HOURS: ${OUTPUT_TTL_HOURS:-24}
  DELETE_ON_DOWNLOAD: ${DELETE_ON_DOWNLOAD:-false}
  SKIP_VERIFY: ${SKIP_VERIFY:-false}

services:
  # ─── INFRASTRUCTURE & CORE ──────────────────────────────────────────────

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - automation-net
    depends_on:
      - n8n
      - linkding
      - crawl4ai
      - ntfy
      - couchdb

  automation-db:
    image: pgvector/pgvector:0.8.0-pg17
    restart: always
    container_name: automation-db
    environment:
      - POSTGRES_USER=${AUTO_DB_USER}
      - POSTGRES_PASSWORD=${AUTO_DB_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - automation_db_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${AUTO_DB_USER} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - automation-net

  redis:
    image: redis:7-alpine
    restart: always
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - automation-net

  # ─── DATABASES ─────────────────────────────────────────────────────────

  couchdb:
    image: couchdb:latest
    restart: always
    container_name: couchdb
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - automation-net

  # ─── AUTOMATION & DATA APPS ────────────────────────────────────────────

  n8n:
    image: n8nio/n8n:next
    restart: always
    container_name: n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=automation-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${AUTO_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${AUTO_DB_PASSWORD}
      - N8N_HOST=${N8N_SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      - N8N_COMMUNITY_NODES_ENABLED=true
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=${SMTP_HOST}
      - N8N_SMTP_PORT=${SMTP_PORT}
      - N8N_SMTP_USER=${SMTP_USER}
      - N8N_SMTP_PASS=${SMTP_PASSWORD}
      - N8N_SMTP_SENDER=${SMTP_FROM_EMAIL}
      - N8N_SMTP_SSL=${SMTP_SECURE}
      - FLARESOLVERR_API_URL=http://flaresolverr:8191/v1
      - CRAWL4AI_API_URL=http://crawl4ai-proxy:11235
      - NTFY_URL=http://ntfy
      - COUCHDB_URL=http://couchdb:5984
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    depends_on:
      - automation-db
      - crawl4ai
      - crawl4ai-proxy
      - ntfy
      - couchdb
    volumes:
      - n8n_storage:/home/node/.n8n
      - /home/ubuntu/n8n-local-files:/files
    networks:
      - automation-net

  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    restart: always
    environment:
      - LD_SUPERUSER_NAME=admin
      - LD_SUPERUSER_PASSWORD=${LINKDING_PASSWORD}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - linkding_data:/etc/linkding/data
    networks:
      - automation-net

  # ─── NOTIFICATIONS ─────────────────────────────────────────────────────

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: always
    command: serve
    ports:
      - "9234:9234"
    environment:
      - NTFY_LISTEN_HTTP=:9234
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ntfy_cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9234/v1/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - automation-net

  # ─── SCRAPING & UTILITY SERVICES ───────────────────────────────────────

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GEMINI_API_TOKEN=${GEMINI_API_TOKEN:-}
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
      - TZ=${GENERIC_TIMEZONE}
    ports:
      - "11235:11235"
    volumes:
      - /dev/shm:/dev/shm
      - crawl4ai_data:/app/data
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - automation-net

  crawl4ai-proxy:
    image: nginx:1.27-alpine
    container_name: crawl4ai-proxy
    restart: always
    depends_on:
      - crawl4ai
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    volumes:
      - ./crawl4ai-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    command: /bin/sh -c "envsubst '$$CRAWL4AI_API_TOKEN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    networks:
      - automation-net

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: always
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - beszel_data:/beszel_data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - automation-net

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=45876
      - KEY=${BESZEL_AGENT_KEY}
      - HUB_URL=http://localhost:8090
      - TOKEN=${BESZEL_AGENT_TOKEN}
      - TZ=${GENERIC_TIMEZONE}

  # ─── TASBIR ────────────────────────────────────────────────────────────
  # Reuses the shared `redis` + `automation-net`. API reachable by n8n at
  # http://api:8000; Playwright is internal-only (no host port).

  playwright:
    build:
      context: ./backend
      dockerfile: Dockerfile.playwright
    restart: unless-stopped
    networks:
      - automation-net
    environment:
      PORT: 4000
      RENDER_SERVICE_KEY: ${RENDER_SERVICE_KEY:-}
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1.5g

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - automation-net
    depends_on:
      redis:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    environment:
      <<: *tasbir-env
      SERVICE: api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 15s
    volumes:
      - ./backend/config:/app/config
      - ./backend/data:/app/data
      - frontend-dist:/app/static
    mem_limit: 256m

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - automation-net
    depends_on:
      redis:
        condition: service_healthy
      playwright:
        condition: service_healthy
    environment:
      <<: *tasbir-env
      SERVICE: worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend/config:/app/config
      - ./backend/data:/app/data
    mem_limit: 512m

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - automation-net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *tasbir-env
      SERVICE: beat
      PYTHONPATH: /app
    working_dir: /app/data
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend/config:/app/config
      - ./backend/data:/app/data
    mem_limit: 128m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    networks:
      - automation-net
    volumes:
      - frontend-dist:/out
    command: ["sh", "-c", "cp -rf /static/. /out/ && echo 'frontend assets staged into volume'"]
