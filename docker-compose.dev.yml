# ─────────────────────────────────────────────────────────────────────────
# Dev overlay — live-reload everything.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# - api/worker/beat: bind-mount ./backend and run reload-capable commands
#   (uvicorn --reload via watchfiles, celery restarted by watchfiles)
# - frontend: runs the Vite dev server on :5173 (proxies /tasks,/generate → api)
# - playwright: bind-mounts render_server.py + uvicorn --reload
# - UI at http://localhost:5173 · API at http://localhost:8000
# ─────────────────────────────────────────────────────────────────────────
name: tasbir-dev

services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      frontend:
        condition: service_started
    volumes:
      - ./backend:/app

  worker:
    command: watchfiles "celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2" /app/app /app/config
    volumes:
      - ./backend:/app

  beat:
    command: watchfiles "celery -A app.tasks.celery_app beat --loglevel=info" /app/app /app/config
    volumes:
      - ./backend:/app

  playwright:
    command: uvicorn render_server:app --host 0.0.0.0 --port 4000 --reload
    volumes:
      - ./backend/app/services/render_server.py:/app/render_server.py

  frontend:
    build:
      context: ./frontend
      target: build
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://api:8000
    command: sh -c "corepack enable && pnpm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
