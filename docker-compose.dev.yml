# Tasbir — local dev stack with hot reload.
# Usage: cp .env.example .env && docker compose -f docker-compose.dev.yml up --build
# URLs (dev): UI at :5173 (vite, HMR) · API at :8000 · API docs at :8000/docs

name: tasbir-dev

networks:
  tasbir-dev:
    driver: bridge

volumes:
  tasbir-dev-node: # frontend node_modules

x-shared-env: &shared-env
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  DATABASE_URL: sqlite+aiosqlite:///data/tasbir.db
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  API_KEYS: ${API_KEYS:-}
  RENDER_SERVICE_KEY: ${RENDER_SERVICE_KEY:-dev-render-secret}
  RENDERER_URL: http://playwright:4000
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
  IMAGE_ALLOW_HOSTS: ${IMAGE_ALLOW_HOSTS:-}
  IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-10485760}
  IMAGE_MAX_REDIRECTS: ${IMAGE_MAX_REDIRECTS:-2}
  OUTPUT_TTL_HOURS: ${OUTPUT_TTL_HOURS:-24}
  DELETE_ON_DOWNLOAD: ${DELETE_ON_DOWNLOAD:-false}
  SKIP_VERIFY: ${SKIP_VERIFY:-false}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - tasbir-dev
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    ports:
      - "6379:6379"

  playwright:
    image: ghcr.io/${TASBIR_IMAGE_OWNER:-sapienskid}/tasbir-playwright:${TASBIR_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - tasbir-dev
    environment:
      PORT: 4000
      RENDER_SERVICE_KEY: ${RENDER_SERVICE_KEY:-dev-render-secret}
    volumes:
      - ./backend/app/services/render_server.py:/app/render_server.py
    command: uvicorn render_server:app --host 0.0.0.0 --port 4000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1.5g

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - tasbir-dev
    depends_on:
      redis:
        condition: service_started
      playwright:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: api
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 15s
    mem_limit: 512m

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    networks:
      - tasbir-dev
    depends_on:
      redis:
        condition: service_started
      playwright:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: worker
    volumes:
      - ./backend:/app
    command: sh -c "cd /app && python -m watchfiles 'celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2' app/"
    mem_limit: 512m

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    networks:
      - tasbir-dev
    depends_on:
      redis:
        condition: service_started
    environment:
      <<: *shared-env
      SERVICE: beat
      PYTHONPATH: /app
    working_dir: /app/data
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info
    mem_limit: 128m

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /frontend
    networks:
      - tasbir-dev
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/frontend
      - tasbir-dev-node:/frontend/node_modules
    ports:
      - "5173:5173"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host"
    mem_limit: 1g
