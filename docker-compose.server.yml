# ─────────────────────────────────────────────────────────────────────────
# Server deployment overlay — join an existing Docker network (e.g. an n8n /
# automation stack) without changing the base compose.
#
# Usage (on a host that already runs a stack with an "automation-net"):
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# What it does:
#   - Declares `automation-net` as an EXTERNAL network (must already exist —
#     the other stack created it). Tasbir's `api` joins it, so n8n and friends
#     can call Tasbir at `http://api:8000`.
#   - All internal services (redis, playwright, worker, beat, frontend) stay on
#     Tasbir's private `tasbir` network — no name collisions with a server that
#     already runs its own `redis`, `crawl4ai`, etc.
#   - Port 8000 is still published to the host for direct access / cloudflared.
# ─────────────────────────────────────────────────────────────────────────

name: tasbir

networks:
  # Provided by the existing stack. Docker refuses to start if it's missing.
  automation-net:
    external: true
    name: automation-net

services:
  api:
    # Reachable from n8n on automation-net AND from Tasbir's internal services.
    networks:
      - tasbir
      - automation-net
