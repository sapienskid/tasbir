name: tasbir

networks:
  tasbir:
    driver: bridge

x-shared: &shared-env
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  DATABASE_URL: sqlite+aiosqlite:///data/tasbir.db
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - tasbir
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 128m

  playwright:
    image: mcr.microsoft.com/playwright/python:v1.61.0-noble-amd64
    restart: unless-stopped
    networks:
      - tasbir
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
    working_dir: /app
    volumes:
      - ./backend/app/services/render_server.py:/app/render_server.py
    command: >
      sh -c "pip install fastapi uvicorn playwright &&
             python -m playwright install chromium &&
             uvicorn render_server:app --host 0.0.0.0 --port 4000"
    mem_limit: 1.5g

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - tasbir
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    mem_limit: 256m

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - tasbir
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    mem_limit: 512m
