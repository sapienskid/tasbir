# Tasbir — production deploy from prebuilt GHCR images.
# Usage: cp .env.example .env && docker compose up -d
# With Cloudflare Tunnel: docker compose --profile tunnel up -d
# Pin a release with TASBIR_IMAGE_TAG=1.0.0, or leave unset for :latest.
# For development use docker-compose.dev.yml instead.

name: tasbir

networks:
  tasbir:
    driver: bridge

volumes:
  tasbir_data:

x-shared: &shared-env
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  PEXELS_API_KEY: ${PEXELS_API_KEY:-}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
  DATABASE_URL: sqlite+aiosqlite:///data/tasbir.db
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_KEYS: ${API_KEYS:-}
  RENDER_SERVICE_KEY: ${RENDER_SERVICE_KEY:-}
  RENDERER_URL: http://playwright:4000
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
  RATE_LIMIT_INTERACTIVE_PER_MIN: ${RATE_LIMIT_INTERACTIVE_PER_MIN:-600}
  IMAGE_ALLOW_HOSTS: ${IMAGE_ALLOW_HOSTS:-}
  IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-10485760}
  IMAGE_MAX_REDIRECTS: ${IMAGE_MAX_REDIRECTS:-2}
  OUTPUT_TTL_HOURS: ${OUTPUT_TTL_HOURS:-24}
  DELETE_ON_DOWNLOAD: ${DELETE_ON_DOWNLOAD:-false}
  SKIP_VERIFY: ${SKIP_VERIFY:-false}

services:
  redis:
    # Same tag the Overleaf stack pulls, so this host keeps one redis image
    # instead of two. Functionally identical — a disposable LRU cache.
    image: redis:7.4
    restart: unless-stopped
    networks:
      - tasbir
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    mem_limit: 48m

  playwright:
    image: ghcr.io/${TASBIR_IMAGE_OWNER:-sapienskid}/tasbir-playwright:${TASBIR_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - tasbir
    environment:
      PORT: 4000
      RENDER_SERVICE_KEY: ${RENDER_SERVICE_KEY:-}
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 384m

  api:
    image: ghcr.io/${TASBIR_IMAGE_OWNER:-sapienskid}/tasbir-api:${TASBIR_IMAGE_TAG:-latest}
    user: "${TASBIR_USER:-0:0}"
    restart: unless-stopped
    ports:
      # Loopback-only: the Studio/API is reached via Cloudflare Tunnel
      # (--profile tunnel). Set API_BIND=0.0.0.0:8000:8000 only if you
      # intentionally want the port on the host LAN.
      - "${API_BIND:-127.0.0.1:8000}:8000"
    networks:
      - tasbir
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 15s
    volumes:
      - tasbir_data:/app/data
    mem_limit: 192m

  worker:
    image: ghcr.io/${TASBIR_IMAGE_OWNER:-sapienskid}/tasbir-api:${TASBIR_IMAGE_TAG:-latest}
    user: "${TASBIR_USER:-0:0}"
    restart: unless-stopped
    networks:
      - tasbir
    depends_on:
      redis:
        condition: service_healthy
      playwright:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - tasbir_data:/app/data
    mem_limit: 256m

  beat:
    image: ghcr.io/${TASBIR_IMAGE_OWNER:-sapienskid}/tasbir-api:${TASBIR_IMAGE_TAG:-latest}
    user: "${TASBIR_USER:-0:0}"
    restart: unless-stopped
    networks:
      - tasbir
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: beat
      PYTHONPATH: /app
    working_dir: /app/data
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - tasbir_data:/app/data
    mem_limit: 64m

  # ── Cloudflare Tunnel (opt-in) ──────────────────────────────────────
  # Exposes the api (Studio + API on :8000) through Cloudflare without
  # opening any inbound port. Enable with:
  #   docker compose --profile tunnel up -d
  # Setup (one time, Cloudflare dashboard → Zero Trust → Networks → Tunnels):
  #   1. Create a tunnel, copy its token → CLOUDFLARED_TUNNEL_TOKEN in .env
  #   2. Public hostname: <your-domain> → Service http://api:8000
  # Ingress lives in the dashboard, so no config.yml is needed here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [tunnel]
    networks:
      - tasbir
    depends_on:
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:-missing}
    mem_limit: 64m

