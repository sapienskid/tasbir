name: tasbir

networks:
  tasbir:
    driver: bridge

x-shared: &shared-env
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  DATABASE_URL: sqlite+aiosqlite:///data/tasbir.db
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - tasbir
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 128m

  playwright:
    build:
      context: ./backend
      dockerfile: Dockerfile.playwright
    restart: unless-stopped
    networks:
      - tasbir
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1.5g

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - tasbir
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./backend/config:/app/config
      - ./backend/data:/app/data
    mem_limit: 256m

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - tasbir
    depends_on:
      redis:
        condition: service_healthy
      playwright:
        condition: service_healthy
    environment:
      <<: *shared-env
      SERVICE: worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend/config:/app/config
      - ./backend/data:/app/data
    mem_limit: 512m
