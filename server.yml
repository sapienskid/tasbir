# ntfy server config (bind-mounted read-only into the ntfy container).
# Defaults are fine for most deployments — the listener/port come from the
# NTFY_LISTEN_HTTP env var in the compose file.
#
# See https://docs.ntfy.sh/config/ for all options.

# Auth / security
# auth-file: /var/lib/ntfy/user.db

# Rate limiting (requests per minute)
# rate-limit: 30

# Cache
cache-file: /var/cache/ntfy/cache.db

# Default topic access
# auth-default-access: deny-all
