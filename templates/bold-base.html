<!--
@id: layout/statement-cta
@label: Statement CTA
@description: High-impact Swiss-style statement layout with a primary CTA block
@selection_hints: bold statement, launch announcement, conversion CTA, action-oriented message
@formats: instagram-square,instagram-portrait,carousel-post,linkedin-post

@slot cta_text | text | Short call-to-action button label  | 
@slot kicker_text | text | Small label above heading  | 
@slot footer_meta | text | Footer metadata label  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div
  class="relative z-10 grid h-full w-full grid-rows-[auto_1fr_auto] p-[var(--token-space-gutter)] text-left bg-brand-surface text-brand-primary">
  <!-- Top Meta Info -->
  <header class="flex w-full items-start justify-between border-b-2 border-brand-primary pb-4 mb-8">
    <div class="flex items-center gap-4">
      <span
        class="font-brand-body text-[14px] font-black uppercase tracking-[0.4em] border-r-2 border-brand-primary pr-4">
        {{BRAND_NAME}}
      </span>
      <span class="font-brand-body text-[14px] font-bold uppercase tracking-[0.2em] text-brand-muted empty:hidden">
        {{SLIDE_LABEL}}
      </span>
    </div>
  </header>

  <!-- Main Content Area -->
  <section class="flex flex-col justify-center">
    <div class="max-w-[95%]">
      <p class="mb-4 font-brand-body text-brand-muted font-bold uppercase tracking-[0.4em] text-[16px]">
        {{KICKER_TEXT}}
      </p>
      <h1
        class="mb-8 font-brand-display text-[clamp(56px,8vw,84px)] font-black leading-[0.9] tracking-tighter text-balance uppercase">
        {{HEADING}}
      </h1>
      <div class="w-20 h-4 bg-brand-primary mb-8"></div>
      <div class="font-brand-body text-[clamp(24px,3vw,32px)] leading-tight text-justify tracking-tighter max-w-[85%]">
        {{BODY}}
      </div>
    </div>
  </section>

  <!-- CTA and Footer -->
  <footer class="mt-8 pt-8 border-t-2 border-brand-primary flex items-end justify-between">
    <div
      class="swiss-border-thick bg-brand-primary px-10 py-5 text-brand-surface font-brand-body text-[20px] font-black uppercase tracking-[0.2em] cursor-pointer">
      {{SLOT:cta_text}}
    </div>
    <div class="text-[12px] font-brand-body font-bold uppercase tracking-[0.4em] text-brand-muted">
      {{SLOT:footer_meta}}
    </div>
  </footer>
</div>
