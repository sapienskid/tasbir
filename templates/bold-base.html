<!--
@id: layout/statement-cta
@label: Statement CTA
@description: High-impact statement layout with a primary CTA block

@slot cta_text | text | Short call-to-action button label | Read More
-->
<div
  class="relative z-10 flex h-full w-full flex-col p-[calc(var(--content-inset)*var(--layout-scale)*var(--frame-space-scale))] {{ALIGN_CLASS}}">
  {{HEADER}}
  <div class="relative {{POSITION_CLASS}} p-[calc(var(--template-panel-padding)*var(--layout-scale)*var(--frame-space-scale))]">
    {{KICKER}}
    <h1
      class="mt-[calc(var(--template-flow-kicker)*var(--layout-scale)*var(--frame-space-scale))] max-w-[var(--content-max-width)] font-brand-display text-brand-primary text-[calc(var(--template-heading-size)*var(--layout-scale)*var(--frame-type-scale))] leading-[var(--template-heading-line-height)] tracking-[var(--template-heading-letter-spacing)] [text-shadow:var(--token-shadow-title)] text-balance [overflow-wrap:anywhere] break-words">
      {{HEADING}}</h1>
    <div class="mt-[calc(var(--template-flow-heading)*var(--layout-scale)*var(--frame-space-scale))] h-px w-full bg-brand-border"></div>
    <p
      class="mt-[calc(var(--template-flow-heading)*var(--layout-scale)*var(--frame-space-scale))] max-w-[var(--caption-max-width)] font-brand-body italic text-brand-secondary text-[calc(var(--template-body-size)*var(--layout-scale)*var(--frame-type-scale))] leading-[var(--template-body-line-height)] [text-shadow:var(--token-shadow-caption)] [overflow-wrap:anywhere] break-words">
      {{BODY}}</p>
    <div
      class="mt-[calc(var(--template-flow-section)*var(--layout-scale)*var(--frame-space-scale))] inline-flex w-fit items-center bg-brand-primary px-[calc(24px*var(--layout-scale)*var(--frame-space-scale))] py-[calc(12px*var(--layout-scale)*var(--frame-space-scale))] font-brand-body text-[calc(22px*var(--layout-scale)*var(--frame-type-scale))] font-semibold uppercase tracking-[0.06em] leading-[1.1] text-brand-surface">
      {{SLOT:cta_text}}</div>
    {{FOOTER}}
  </div>
</div>
