<div class="absolute inset-y-0 left-0" style="width: 42%; background: linear-gradient(90deg, color-mix(in srgb, var(--color-brand-accent) 42%, transparent), transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: calc({{CONTENT_INSET}}px * var(--layout-scale) * var(--frame-space-scale)); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: calc(34px * var(--layout-scale) * var(--frame-space-scale));">
    {{KICKER}}
    <h1 class="mt-2 text-balance break-words" style="font-family: var(--font-display); font-size: calc(64px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1; letter-spacing: -0.02em; max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{HEADING}}</h1>
    <p class="mt-3 break-words text-[var(--color-text-secondary)]" style="font-size: calc(27px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1.3; max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{BODY}}</p>
    {{FOOTER}}
  </div>
</div>
