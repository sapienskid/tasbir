<!--
@id: layout/carousel-step-content
@label: Carousel Step Content
@description: Middle carousel slide for supporting steps and narrative points
@formats: carousel-post

@slot slide_index | text | Large decorative slide index number
-->
<div
  class="relative z-10 flex h-full w-full flex-col p-[calc(var(--content-inset)*var(--layout-scale)*var(--frame-space-scale))] {{ALIGN_CLASS}}">
  {{HEADER}}
  <div class="relative {{POSITION_CLASS}} p-[calc(var(--template-panel-padding)*var(--layout-scale)*var(--frame-space-scale))]">
    <div
      class="pointer-events-none absolute right-0 top-[-20px] z-[-1] font-brand-body text-[calc(140px*var(--layout-scale)*var(--frame-type-scale))] font-bold leading-none text-[color-mix(in_srgb,var(--color-text-primary)_10%,transparent)]">
      {{SLOT:slide_index}}</div>
    <h1
      class="mt-[calc(var(--template-flow-kicker)*var(--layout-scale)*var(--frame-space-scale))] max-w-[var(--content-max-width)] font-brand-display text-brand-primary text-[calc(var(--template-heading-secondary-size)*var(--layout-scale)*var(--frame-type-scale))] leading-[var(--template-heading-line-height)] tracking-[var(--template-heading-letter-spacing)] [text-shadow:var(--token-shadow-title)] text-balance [overflow-wrap:anywhere] break-words">
      {{HEADING}}</h1>
    <div class="mt-[calc(var(--template-flow-heading)*var(--layout-scale)*var(--frame-space-scale))] h-px w-full bg-brand-border"></div>
    <p
      class="mt-[calc(var(--template-flow-heading)*var(--layout-scale)*var(--frame-space-scale))] max-w-[var(--caption-max-width)] font-brand-body text-brand-secondary text-[calc(var(--template-body-secondary-size)*var(--layout-scale)*var(--frame-type-scale))] leading-[var(--template-body-line-height)] [text-shadow:var(--token-shadow-caption)] [overflow-wrap:anywhere] break-words">
      {{BODY}}</p>
    {{FOOTER}}
  </div>
</div>
