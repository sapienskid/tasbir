<!--
@id: layout/carousel-step-content
@label: Carousel Step Content
@description: Middle carousel slide for supporting steps and narrative points
@formats: carousel-post

@slot slide_index | text | Large decorative slide index number
-->
<div
  class="relative z-10 flex h-full w-full flex-col p-14 items-start text-left">
  <div class="flex w-full items-center justify-between gap-5">
  <span class="inline-flex w-fit items-center border border-brand-border bg-transparent px-4 py-2 font-brand-body text-sm font-medium uppercase tracking-[0.12em] leading-[1.1] text-brand-primary">{{BRAND_NAME}}</span>
  <span class="inline-flex w-fit items-center border border-brand-border bg-transparent px-4 py-2 font-brand-body text-sm font-medium uppercase tracking-[0.12em] leading-[1.1] text-brand-primary empty:hidden">{{SLIDE_LABEL}}</span>
</div>
  <div class="relative isolate z-0 mt-auto p-8">
    <div
      class="pointer-events-none absolute right-0 top-[-20px] z-[-1] font-brand-body text-[140px] font-bold leading-none text-brand-primary/10">
      {{SLOT:slide_index}}</div>
    <h1
      class="mt-2 max-w-5xl font-brand-display text-brand-primary text-5xl leading-tight tracking-tight drop-shadow-sm text-balance [overflow-wrap:anywhere] break-words">
      {{HEADING}}</h1>
    <div class="mt-4 h-px w-full bg-brand-border"></div>
    <p
      class="mt-4 max-w-4xl font-brand-body text-brand-secondary text-xl leading-relaxed drop-shadow-sm [overflow-wrap:anywhere] break-words">
      {{BODY}}</p>
  </div>
</div>
