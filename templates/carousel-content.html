<!--
@id: layout/carousel-module
@label: Carousel Step Content
@description: Swiss-style middle slide for carousel supporting steps
@selection_hints: process steps, framework breakdown, tutorial middle slides, sequential guidance
@formats: carousel-post

@slot slide_index | text | Large decorative slide index number  | 
@slot step_meta | text | Footer step metadata line  | 
@slot next_label | text | Footer next action label  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 flex h-full w-full bg-brand-surface text-brand-primary p-[var(--token-space-gutter)]">
  <div class="swiss-border-thick w-full h-full flex flex-col p-12">
    <header class="flex justify-between items-start mb-16 px-4 border-b-2 border-brand-primary pb-4">
      <div class="font-brand-body text-[16px] font-black uppercase tracking-[0.4em]">
        {{BRAND_NAME}}
      </div>
      <div class="font-brand-body text-[14px] font-bold uppercase tracking-[0.2em] text-brand-muted">
        {{SLIDE_LABEL}}
      </div>
    </header>

    <main class="flex-1 flex flex-col justify-center relative">
      <div
        class="absolute -top-12 -right-6 font-brand-display text-[220px] font-black leading-none tabular-nums pointer-events-none">
        {{SLOT:slide_index}}
      </div>

      <div class="max-w-[90%] relative z-10">
        <h1 class="font-brand-display text-[length:var(--token-type-heading)] leading-[0.98] tracking-[-0.02em] font-bold mb-8 uppercase">
          {{HEADING}}
        </h1>
        <div class="w-20 h-4 bg-brand-primary mb-8"></div>
        <div class="text-[length:var(--token-type-body)] leading-[1.18] tracking-[-0.01em] text-brand-secondary text-justify">
          {{BODY}}
        </div>
      </div>
    </main>

    <footer class="mt-12 flex justify-between items-end pt-8 border-t-2 border-brand-primary">
      <div class="font-brand-body text-[10px] font-black uppercase tracking-[0.4em] text-brand-muted">
        {{SLOT:step_meta}}
      </div>
      <div class="font-brand-body text-[12px] font-bold uppercase tracking-[0.2em]">
        {{SLOT:next_label}}
      </div>
    </footer>
  </div>
</div>
