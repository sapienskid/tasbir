<!--
@id: layout/carousel-header
@label: Carousel Cover Hero
@description: Swiss-style opening slide for carousel narratives
@selection_hints: carousel opener, series cover, strong hook, narrative intro
@formats: carousel-post

@slot series_label | text | Short series or topic label displayed above the headline  | 
@slot sidebar_prompt | text | Left vertical prompt label  | 
@slot swipe_prompt | text | Footer continuation label  | 
@slot footer_meta | text | Footer metadata label  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 grid h-full w-full grid-cols-12 bg-brand-surface text-brand-primary">
  <!-- Left Side: Decorative Sidebar -->
  <aside
    class="col-span-1 border-r border-brand-primary flex flex-col items-center justify-center py-10 bg-brand-primary text-brand-surface">
    <div
      class="rotate-[-90deg] whitespace-nowrap font-brand-body text-[14px] font-black uppercase tracking-[0.5em] origin-center">
      {{SLOT:sidebar_prompt}}
    </div>
  </aside>

  <!-- Main Content -->
  <main class="col-span-11 flex flex-col p-[var(--token-space-gutter)]">
    <header class="flex justify-between items-start mb-16 px-4">
      <div class="font-brand-body text-[18px] font-black uppercase tracking-[0.4em]">
        {{BRAND_NAME}}
      </div>
      <div
        class="font-brand-body text-[14px] font-bold uppercase tracking-[0.2em] border-2 border-brand-primary px-4 py-1">
        {{SLIDE_LABEL}}
      </div>
    </header>

    <div class="flex-1 flex flex-col justify-center px-4">
      <div
        class="inline-block border-2 border-brand-primary px-4 py-1 mb-6 font-brand-body text-[16px] font-black uppercase tracking-[0.2em] w-fit">
        {{SLOT:series_label}}
      </div>
      <h1 class="font-brand-display text-[length:var(--token-type-heading)] leading-[0.98] tracking-[-0.02em] font-bold mb-10 max-w-[90%] uppercase">
        {{HEADING}}
      </h1>
      <div class="w-32 h-6 bg-brand-primary mb-10"></div>
      <div class="text-[length:var(--token-type-body)] leading-[1.18] tracking-[-0.01em] text-brand-secondary max-w-[85%] text-justify">
        {{BODY}}
      </div>
    </div>

    <footer class="mt-auto px-4 py-8 flex items-center justify-between border-t-2 border-brand-primary">
      <div class="flex items-center gap-4">
        <span class="w-12 h-1 bg-brand-primary"></span>
        <span class="font-brand-body text-[12px] font-black uppercase tracking-[0.3em]">{{SLOT:swipe_prompt}}</span>
      </div>
      <div class="font-brand-body text-[12px] font-bold uppercase tracking-[0.2em] text-brand-muted">
        {{SLOT:footer_meta}}
      </div>
    </footer>
  </main>
</div>
