<!--
@id: layout/carousel-cover-hero
@label: Carousel Cover Hero
@description: Opening slide structure for carousel narrative series
@formats: carousel-post

@slot series_label | text | Short series or topic label displayed above the headline
-->
<div
  class="relative z-10 flex h-full w-full flex-col p-14 items-start text-left">
  {{HEADER}}
  <div class="relative isolate z-0 mt-auto p-8">
    <div
      class="mb-6 inline-block border-b-2 border-brand-primary pb-3 font-brand-body text-lg font-semibold uppercase tracking-[0.16em] text-brand-muted">
      {{SLOT:series_label}}</div>
    <h1
      class="max-w-5xl font-brand-display text-brand-primary text-6xl leading-tight tracking-tight drop-shadow-sm text-balance [overflow-wrap:anywhere] break-words">
      {{HEADING}}</h1>
    <div class="mt-4 h-[2px] w-[80px] bg-brand-primary"></div>
    <p
      class="mt-4 max-w-4xl font-brand-body text-brand-secondary text-xl leading-relaxed drop-shadow-sm [overflow-wrap:anywhere] break-words">
      {{BODY}}</p>
    {{FOOTER}}
  </div>
</div>
