<div class="absolute -left-24 top-12 h-72 w-72 rounded-full" style="background: color-mix(in srgb, var(--color-brand-glow) 50%, transparent);"></div>
<div class="absolute right-8 bottom-12 h-56 w-56 rounded-[30%]" style="background: color-mix(in srgb, var(--color-brand-accent) 44%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col gap-6" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  {{KICKER}}
  <h1 class="text-balance break-words text-[80px] leading-[0.98] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{HEADING}}</h1>
  <p class="break-words text-[33px] leading-[1.35] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{BODY}}</p>
  {{FOOTER}}
</div>
