<div class="absolute -left-24 top-12 h-72 w-72 rounded-full" style="background: color-mix(in srgb, var(--color-brand-glow) 42%, transparent);"></div>
<div class="absolute right-10 bottom-14 h-56 w-56 rounded-[30%]" style="background: color-mix(in srgb, var(--color-brand-accent) 36%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 40px 42px;">
    {{KICKER}}
    <h1 class="mt-2 text-balance break-words text-[68px] leading-[1.01] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{HEADING}}</h1>
    <p class="mt-3 break-words text-[29px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{BODY}}</p>
    {{FOOTER}}
  </div>
</div>
