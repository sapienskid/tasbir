<div class="relative z-10 flex h-full w-full flex-col gap-6" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  {{KICKER}}
  <h1 class="text-balance break-words text-[84px] leading-[0.97] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{HEADING}}</h1>
  <p class="break-words text-[34px] leading-[1.35] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{BODY}}</p>
  {{FOOTER}}
</div>
