<div class="absolute inset-x-0 top-0 h-10" style="background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--color-brand-accent) 22%, transparent) 0 30px, transparent 30px 60px);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; padding-top: calc({{CONTENT_INSET}}px + 14px); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 34px 36px;">
    <div class="flex items-start justify-between gap-6">
      <div style="max-width: calc({{CONTENT_MAX_WIDTH}}px - 250px);">
        {{KICKER}}
        <h1 class="mt-2 text-balance break-words text-[64px] leading-[1.02] tracking-[-0.02em]" style="font-family: var(--font-display); text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
        <p class="mt-3 break-words text-[28px] leading-[1.33] text-[var(--color-text-secondary)]" style="max-width: calc({{CAPTION_MAX_WIDTH}}px - 220px); text-shadow: var(--frame-caption-shadow);">{{SLOT:insight_line}}</p>
      </div>
      <div class="rounded-2xl border px-5 py-4" style="min-width: 230px; border-color: color-mix(in srgb, var(--color-brand-accent) 80%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 76%, transparent);">
        <p class="tabular-nums text-[68px] leading-none" style="font-family: var(--font-display);">{{SLOT:metric_value}}</p>
        <p class="mt-1 break-words text-[20px] leading-[1.2] text-[var(--color-text-secondary)]">{{SLOT:metric_label}}</p>
      </div>
    </div>
    {{FOOTER}}
  </div>
</div>
