<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 38px 40px;">
    <div class="inline-flex w-fit items-center rounded-full border px-4 py-2 text-[17px] font-semibold uppercase tracking-[0.08em] tabular-nums" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">Step {{SLOT:step_number}}/{{SLOT:step_total}}</div>
    {{KICKER}}
    <h1 class="mt-3 text-balance break-words text-[68px] leading-[1.01] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
    <p class="mt-3 break-words text-[29px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:body}}</p>
    {{FOOTER}}
  </div>
</div>
