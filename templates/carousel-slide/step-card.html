<div class="absolute right-10 top-10 tabular-nums rounded-full border px-4 py-2 text-[18px] font-semibold uppercase tracking-[0.08em]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 84%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 72%, transparent);">Step {{SLOT:step_number}}/{{SLOT:step_total}}</div>
<div class="relative z-10 flex h-full w-full flex-col gap-6" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  {{KICKER}}
  <h1 class="text-balance break-words text-[80px] leading-[0.98] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
  <p class="break-words text-[33px] leading-[1.35] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:body}}</p>
  {{FOOTER}}
</div>
