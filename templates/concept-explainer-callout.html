<!--
@id: layout/concept-explainer-callout
@label: Concept Explainer Callout
@description: Definition-style educational card with topic tag and callout explanation box
@formats: instagram-square,instagram-portrait,carousel-post,linkedin-post
@background_image: inline

@slot topic_label | text | Topic/category chip text | Biology
@slot callout_text | text | Main callout box explanation text
@slot support_note | text | Supporting note below callout | Add one practical example.
@slot corner_item_top | text | Top-right circular item label | Field sample
@slot corner_item_bottom | text | Bottom-right circular item label | Lab culture
@slot brand_icon | text | Monogram text for the floating brand icon
@slot brand_icon_x | number | Icon horizontal position percent (0-100) | 92
@slot brand_icon_y | number | Icon vertical position percent (0-100) | 9
@slot brand_icon_size | number | Icon circle size in px | 92
@slot brand_icon_opacity | number | Icon opacity from 0 to 1 | 0.92
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 grid h-full w-full grid-rows-[auto_minmax(0,1fr)] gap-4 p-6 text-left">
  <header class="flex w-full items-start justify-between gap-3">
    <div class="flex max-w-full flex-wrap items-center gap-2.5">
      <span
        class="inline-flex w-fit items-center border border-black/88 bg-white/58 px-3 py-1.5 font-brand-body text-[11px] font-semibold uppercase tracking-[0.12em] leading-[1.05] text-brand-primary group-data-[template-tone=dark]:border-white/84 group-data-[template-tone=dark]:bg-black/44">
        {{BRAND_NAME}}</span>
      <span
        class="inline-flex w-fit items-center border border-black/88 bg-white/58 px-3 py-1.5 font-brand-body text-[11px] font-semibold uppercase tracking-[0.12em] leading-[1.05] text-brand-primary empty:hidden group-data-[template-tone=dark]:border-white/84 group-data-[template-tone=dark]:bg-black/44">
        {{SLIDE_LABEL}}</span>
    </div>
  </header>
  <section
    class="relative h-full min-h-0 w-full overflow-hidden border border-black/86 bg-white/64 backdrop-blur-[1.25px] group-data-[template-tone=dark]:border-white/62 group-data-[template-tone=dark]:bg-black/62">
    <div class="grid h-full min-h-0 w-full grid-rows-[minmax(0,0.44fr)_minmax(0,0.56fr)]">
      <div class="relative min-h-0 overflow-hidden border-b border-black/80 group-data-[template-tone=dark]:border-white/56">
        <img src="{{IMAGE_URL}}" alt="" class="absolute inset-0 h-full w-full object-cover grayscale contrast-[1.12]" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/62 to-black/8"></div>
      </div>
      <div class="relative min-h-0 overflow-hidden bg-white/58 p-7 group-data-[template-tone=dark]:bg-black/58">
        <div
          class="inline-flex w-fit items-center border border-black/80 bg-white/86 px-4 py-2 font-brand-body text-sm font-semibold uppercase tracking-[0.09em] leading-[1.1] text-brand-primary group-data-[template-tone=dark]:border-white/70 group-data-[template-tone=dark]:bg-black/70">
          {{SLOT:topic_label}}</div>
        <h1
          class="mt-4 max-w-full font-brand-display text-[clamp(40px,5.8vw,64px)] font-semibold leading-[1.01] tracking-[-0.01em] text-brand-primary [overflow-wrap:anywhere] break-words">
          {{HEADING}}</h1>
        <p
          class="mt-3 max-w-full font-brand-body text-[clamp(19px,2.3vw,28px)] leading-[1.28] text-brand-secondary [overflow-wrap:anywhere] break-words">
          {{BODY}}</p>
        <div
          class="mt-4 border border-black/76 bg-white/70 p-4 group-data-[template-tone=dark]:border-white/60 group-data-[template-tone=dark]:bg-black/66">
          <p
            class="m-0 font-brand-body text-[clamp(18px,2.15vw,26px)] leading-[1.3] text-brand-secondary [overflow-wrap:anywhere] break-words">
            {{SLOT:callout_text}}</p>
        </div>
        <p
          class="mt-3 font-brand-body text-[clamp(12px,1.35vw,15px)] uppercase tracking-[0.09em] leading-[1.2] text-brand-muted [overflow-wrap:anywhere] break-words">
          {{SLOT:support_note}}</p>
        <div class="pointer-events-none absolute inset-0">
          <span
            class="absolute right-4 top-4 inline-flex h-[106px] w-[106px] items-center justify-center rounded-full border border-black/68 bg-white/78 p-2 text-center font-brand-body text-[11px] uppercase tracking-[0.05em] leading-[1.2] text-brand-secondary group-data-[template-tone=dark]:border-white/70 group-data-[template-tone=dark]:bg-black/52">{{SLOT:corner_item_top}}</span>
          <span
            class="absolute bottom-5 right-5 inline-flex h-[106px] w-[106px] items-center justify-center rounded-full border border-black/68 bg-white/78 p-2 text-center font-brand-body text-[11px] uppercase tracking-[0.05em] leading-[1.2] text-brand-secondary group-data-[template-tone=dark]:border-white/70 group-data-[template-tone=dark]:bg-black/52">{{SLOT:corner_item_bottom}}</span>
        </div>
      </div>
    </div>
  </section>
</div>
