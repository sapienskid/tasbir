<!--
@id: layout/concept-explainer
@label: Concept Explainer Callout
@description: Modern Swiss-style educational layout with image and high-contrast callout
@selection_hints: educational explainer, concept breakdown, myth vs reality, teach and clarify
@formats: instagram-square,instagram-portrait,carousel-post,linkedin-post
@background_image: inline

@slot topic_label | text | Topic/category chip text  | 
@slot callout_text | text | Main callout box explanation text | 
@slot support_note | text | Supporting note below callout  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 grid h-full w-full grid-cols-12 bg-brand-surface text-brand-primary">
  <!-- Left Side: Image Content -->
  <div class="col-span-12 h-1/2 relative border-b-4 border-brand-primary overflow-hidden">
    <img src="{{IMAGE_URL}}" alt=""
      class="absolute inset-0 h-full w-full object-cover grayscale contrast-125 brightness-90" />
    <div
      class="absolute top-0 left-0 bg-brand-primary text-brand-surface px-6 py-3 font-brand-body text-[16px] font-black uppercase tracking-[0.4em]">
      {{SLIDE_LABEL}}
    </div>
  </div>

  <!-- Right Side: Text Context -->
  <div class="col-span-12 h-1/2 p-[var(--token-space-gutter)] flex flex-col justify-between">
    <div class="max-w-[95%]">
      <div
        class="inline-block border-2 border-brand-primary px-4 py-1 mb-4 font-brand-body text-[14px] font-black uppercase tracking-[0.2em]">
        {{SLOT:topic_label}}
      </div>
      <h1
        class="mb-4 font-brand-display text-[clamp(40px,5.5vw,64px)] font-black leading-[0.9] tracking-tighter uppercase">
        {{HEADING}}
      </h1>
      <div
        class="mb-6 font-brand-body text-[clamp(18px,2.2vw,24px)] leading-tight text-justify tracking-tight text-brand-secondary">
        {{BODY}}
      </div>
    </div>

    <div class="grid grid-cols-12 gap-6 items-end">
      <div class="col-span-8 swiss-border-thick p-6 bg-brand-surface border-2 border-brand-primary">
        <div class="m-0 font-brand-body text-[clamp(16px,2vw,22px)] font-bold italic leading-tight text-brand-primary">
          {{SLOT:callout_text}}
        </div>
      </div>
      <div class="col-span-4 text-right flex flex-col items-end gap-3">
        <p class="font-brand-body text-[12px] font-black uppercase tracking-[0.4em] text-brand-muted">
          {{SLOT:support_note}}
        </p>
        <div
          class="inline-flex px-4 h-12 bg-brand-primary items-center justify-center text-brand-surface font-brand-body font-black uppercase tracking-tighter text-[14px]">
          {{BRAND_NAME}}
        </div>
      </div>
    </div>
  </div>
</div>
