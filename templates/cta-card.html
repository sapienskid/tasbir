<!--
@id: layout/cta-card
@label: Final CTA Card
@description: High-impact Swiss-style closing card to drive specific actions
@selection_hints: campaign closer, subscribe or buy CTA, final slide, next-step action
@formats: instagram-square,instagram-portrait,carousel-post,linkedin-post

@slot cta_text | text | Short call-to-action button label  | 
@slot footer_note | text | Small footer text  | 
@slot rights_note | text | Footer legal or archival note  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div
  class="relative z-10 flex flex-col h-full w-full bg-brand-primary text-brand-surface p-[var(--token-space-gutter)]">
  <header class="flex justify-between items-start mb-16">
    <div class="font-brand-body text-[16px] font-black uppercase tracking-[0.4em]">
      {{BRAND_NAME}}
    </div>
    <div class="font-brand-body text-[16px] font-bold uppercase tracking-[0.2em] text-brand-surface/70">
      {{SLIDE_LABEL}}
    </div>
  </header>

  <main class="flex-1 flex flex-col justify-center items-center text-center max-w-[85%] mx-auto">
    <h1
      class="font-brand-display text-[clamp(64px,9vw,96px)] font-black leading-[0.85] tracking-tighter uppercase mb-6">
      {{HEADING}}
    </h1>
    <div class="w-24 h-4 bg-brand-surface mb-10"></div>
    <div class="font-brand-body text-[clamp(24px,3vw,34px)] leading-tight tracking-tighter mb-12 opacity-90">
      {{BODY}}
    </div>

    <div
      class="inline-flex items-center gap-6 border-b-4 border-brand-surface pb-2 text-[clamp(28px,3.5vw,40px)] font-brand-body font-black uppercase tracking-widest cursor-pointer hover:bg-brand-surface hover:text-brand-primary transition-colors px-6">
      {{SLOT:cta_text}}
      <span>→</span>
    </div>
  </main>

  <footer class="mt-auto flex justify-between items-end pt-8 border-t-2 border-brand-surface/30">
    <div class="font-brand-body text-[12px] font-black uppercase tracking-[0.2em] text-brand-surface/60">
      {{SLOT:footer_note}}
    </div>
    <div class="font-brand-body text-[12px] font-bold uppercase tracking-[0.1em] text-brand-surface/60">
      {{SLOT:rights_note}}
    </div>
  </footer>
</div>
