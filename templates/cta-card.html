<!--
@id: layout/final-cta-card
@label: Final CTA Card
@description: Closing card structure to drive one next action

@slot cta_text | text | Short call-to-action button label | Learn More
-->
<div
  class="relative z-10 flex h-full w-full flex-col p-14 items-start text-left">
  <div class="flex w-full items-center justify-between gap-5">
  <span class="inline-flex w-fit items-center border border-brand-border bg-transparent px-4 py-2 font-brand-body text-sm font-medium uppercase tracking-[0.12em] leading-[1.1] text-brand-primary">{{BRAND_NAME}}</span>
  <span class="inline-flex w-fit items-center border border-brand-border bg-transparent px-4 py-2 font-brand-body text-sm font-medium uppercase tracking-[0.12em] leading-[1.1] text-brand-primary empty:hidden">{{SLIDE_LABEL}}</span>
</div>
  <div class="relative isolate z-0 mt-auto p-8">
    <h1
      class="max-w-5xl font-brand-display text-brand-primary text-6xl leading-tight tracking-tight drop-shadow-sm text-balance [overflow-wrap:anywhere] break-words">
      {{HEADING}}</h1>
    <div class="mt-4 h-px w-full bg-brand-border"></div>
    <p
      class="mt-4 max-w-4xl font-brand-body italic text-brand-secondary text-3xl leading-relaxed drop-shadow-sm [overflow-wrap:anywhere] break-words">
      {{BODY}}</p>
    <div
      class="mt-6 inline-flex w-fit items-center bg-brand-primary px-6 py-3 font-brand-body text-2xl font-semibold uppercase tracking-[0.06em] leading-[1.1] text-brand-surface">
      {{SLOT:cta_text}}</div>
  </div>
</div>
