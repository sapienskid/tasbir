<!--
@id: layout/editorial
@label: Editorial Classic
@description: Modern Swiss editorial layout with asymmetric grid and high contrast
@formats: instagram-square,instagram-portrait,carousel-post,linkedin-post

@slot sidebar_label | text | Small vertical label for the sidebar | PERSPECTIVES
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 flex h-full w-full bg-brand-surface text-brand-primary">
  <!-- Sidebar Branding -->
  <aside class="w-[80px] border-r-2 border-brand-primary flex flex-col items-center justify-between py-10">
    <div
      class="rotate-[-90deg] whitespace-nowrap font-brand-body text-[12px] font-black uppercase tracking-[0.5em] origin-center">
      {{BRAND_NAME}}
    </div>
    <div
      class="rotate-[-90deg] whitespace-nowrap font-brand-body text-[12px] font-bold uppercase tracking-[0.3em] text-brand-muted origin-center">
      {{SLOT:sidebar_label}}
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col p-[var(--token-space-gutter)]">
    <header class="flex justify-between items-start mb-12">
      <div
        class="font-brand-body text-[14px] font-bold uppercase tracking-[0.3em] border-2 border-brand-primary px-4 py-1">
        {{SLIDE_LABEL}}
      </div>
      <div class="font-brand-body text-[14px] font-bold uppercase tracking-[0.2em] text-brand-muted">
        VOL. 01 / ISSUE 04
      </div>
    </header>

    <div class="flex-1 flex flex-col justify-end max-w-[95%]">
      <p class="mb-4 font-brand-body text-brand-muted font-bold uppercase tracking-[0.4em] text-[15px]">
        {{KICKER_TEXT}}
      </p>
      <h1
        class="mb-10 font-brand-display text-[clamp(48px,7vw,78px)] font-black leading-[0.9] tracking-tighter uppercase border-l-[12px] border-brand-primary pl-8">
        {{HEADING}}
      </h1>
      <p
        class="font-brand-body text-[clamp(22px,2.8vw,30px)] leading-tight text-justify tracking-tighter text-brand-secondary">
        {{BODY}}
      </p>
    </div>

    <footer class="mt-16 w-full h-1 bg-brand-primary relative">
      <div class="absolute right-0 top-3 font-brand-body text-[12px] font-bold uppercase tracking-[0.4em]">
        PUBLISHED SYSTEM RECORD / 2024
      </div>
    </footer>
  </main>
</div>
