<!--
@id: layout/editorial-classic
@label: Editorial Classic
@description: Classic editorial single-column headline and summary block
-->
<div
  class="relative z-10 flex h-full w-full flex-col p-14 items-start text-left">
  {{HEADER}}
  <div class="relative isolate z-0 mt-auto p-8">
    {{KICKER}}
    <h1
      class="mt-2 max-w-5xl font-brand-display text-brand-primary text-6xl leading-tight tracking-tight drop-shadow-sm text-balance [overflow-wrap:anywhere] break-words">
      {{HEADING}}</h1>
    <div class="mt-4 h-px w-full bg-brand-border"></div>
    <p
      class="mt-4 max-w-4xl font-brand-body italic text-brand-secondary text-2xl leading-relaxed drop-shadow-sm [overflow-wrap:anywhere] break-words">
      {{BODY}}</p>
    {{FOOTER}}
  </div>
</div>
