<!--
@id: core/editorial-base
@label: Editorial Base
@description: Clean Swiss editorial layout with bold serif headline and justified body text
-->
<div class="content-shell {{ALIGN_CLASS}}">
  {{HEADER}}
  <div class="content-panel {{POSITION_CLASS}}">
    {{KICKER}}
    <h1 class="heading-primary flow-after-kicker content-limit text-balance word-safe">{{HEADING}}</h1>
    <div class="rule-line flow-after-heading"></div>
    <p class="body-primary flow-after-heading caption-limit word-safe">{{BODY}}</p>
    {{FOOTER}}
  </div>
</div>
