<!--
@id: layout/editorial
@label: Editorial Statement
@description: High-impact editorial statement layout with bold headline and supporting body text
@selection_hints: editorial statement, bold headline with context, campaign message, impactful quote
@formats: instagram-square,instagram-portrait,carousel-post,linkedin-post
@frame_tone: dark

@slot HEADING | text | The main statement or headline text to display prominently | 
@slot BODY | text | Supporting body text or subheading to provide context or elaboration |
@slot illustration_seed | text | Deterministic seed for generated illustration layer |

-->

  class="illustration-surface relative flex flex-col h-full w-full text-brand-primary p-[var(--token-space-gutter)]">

    class="{{ILLUSTRATION_VISIBILITY_CLASS}} pointer-events-none  z-30 {{ILLUSTRATION_ELEMENT_CLASS}}">{{ILLUSTRATION_ELEMENT_SVG}}</span>

    <h1 class="font-brand-display text-[length:var(--token-type-heading)] leading-[0.98] tracking-[-0.02em] font-bold mb-10 capitalize">
      {{HEADING}}
    </h1>
    <div class="text-[length:var(--token-type-body)] pb-16 leading-[1.18] tracking-[-0.01em] text-brand-secondary text-left italic">
      {{BODY}}
    </div>
  </main>
