<!--
@id: layout/grid-feature
@label: Grid Item Feature
@description: Swiss-style featured modular card for grid compositions
@formats: instagram-square,instagram-portrait,instagram-story,carousel-post,twitter-card,linkedin-post
@background_image: inline

@slot item_tag | text | Small category or section label  | 
@slot item_title | text | Feature card title text | 
@slot item_body | text | Feature supporting text | 
@slot item_meta | text | Optional byline or source line  | 
@slot footer_meta | text | Footer trailing metadata line  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 flex h-full w-full bg-brand-surface text-brand-primary p-[var(--token-space-gutter)]">
  <div class="swiss-border-thick w-full h-full flex flex-col p-10 overflow-hidden border-2 border-brand-primary">
    <header class="mb-8 flex items-start justify-between">
      <div class="font-brand-body text-[16px] font-black uppercase tracking-[0.4em]">
        {{BRAND_NAME}}
      </div>
      <div
        class="border-2 border-brand-primary px-4 py-1 font-brand-body text-[14px] font-bold uppercase tracking-[0.2em]">
        {{SLIDE_LABEL}}
      </div>
    </header>

    <div class="relative flex min-h-0 flex-1 flex-col">
      <div class="relative mb-8 h-[48%] shrink-0 overflow-hidden border-4 border-brand-primary">
        <img src="{{IMAGE_URL}}" alt=""
          class="absolute inset-0 h-full w-full object-cover grayscale contrast-125 saturate-0" />
        <div
          class="absolute right-0 top-0 bg-brand-primary px-4 py-2 font-brand-body text-[12px] font-black uppercase tracking-[0.3em] text-brand-surface">
          {{SLOT:item_tag}}
        </div>
      </div>

      <div class="flex min-h-0 flex-1 flex-col">
        <h1
          class="mb-6 font-brand-display text-[clamp(40px,6vw,72px)] font-black leading-[0.9] tracking-tighter uppercase">
          {{SLOT:item_title}}
        </h1>
        <p
          class="mb-8 line-clamp-3 font-brand-body text-[clamp(24px,3vw,34px)] leading-tight tracking-tighter text-brand-secondary text-justify">
          {{SLOT:item_body}}
        </p>
      </div>

      <footer
        class="mt-auto flex items-end justify-between border-t-4 border-brand-primary pt-6 font-brand-body text-[14px] font-black uppercase tracking-[0.3em]">
        <div>{{SLOT:item_meta}}</div>
        <div class="text-brand-muted">{{SLOT:footer_meta}}</div>
      </footer>
    </div>
  </div>
</div>
