<!--
@id: layout/grid-item-card
@label: Grid Item Card
@description: Single reusable grid item card for building external boards and collages
@formats: instagram-square,instagram-portrait,instagram-story,carousel-post,twitter-card,linkedin-post

@slot item_tag | text | Small category or section label | Insight
@slot item_title | text | Card title text
@slot item_body | text | Supporting body text
@slot item_meta | text | Optional byline or source line | By Editorial Team
-->
<div class="template-inline-media relative z-10 flex h-full w-full flex-col {{ALIGN_CLASS}}" style="--template-panel-padding:0;">
  <div class="px-[calc(22px*var(--layout-scale)*var(--frame-space-scale))] pt-[calc(22px*var(--layout-scale)*var(--frame-space-scale))]">
    {{HEADER}}
  </div>
  <div class="relative {{POSITION_CLASS}} flex h-full min-h-0 flex-col p-0">
    <article class="relative flex min-h-0 flex-1 flex-col overflow-hidden bg-transparent">
      <div class="min-h-0 basis-1/2 bg-cover bg-center bg-no-repeat" style="background-image: url('{{IMAGE_URL}}');"></div>
      <div
        class="pointer-events-none absolute left-0 right-0 top-0 h-1/2 bg-[linear-gradient(0deg,color-mix(in_srgb,var(--color-overlay-strong)_36%,transparent)_0%,transparent_70%)]">
      </div>
      <div
        class="flex min-h-0 flex-1 flex-col gap-[calc(12px*var(--layout-scale))] bg-[color-mix(in_srgb,var(--color-overlay-strong)_16%,transparent)] p-[calc(24px*var(--layout-scale)*var(--frame-space-scale))]">
        <div
          class="font-brand-body text-brand-muted text-[calc(16px*var(--layout-scale)*var(--frame-type-scale))] font-semibold uppercase tracking-[0.08em] leading-[1.2]">
          {{SLOT:item_tag}}</div>
        <h1
          class="m-0 font-brand-body text-brand-primary text-[calc(44px*var(--layout-scale)*var(--frame-type-scale))] leading-[1.06] [overflow-wrap:anywhere] break-words">
          {{SLOT:item_title}}</h1>
        <p
          class="m-0 font-brand-body text-brand-secondary text-[calc(22px*var(--layout-scale)*var(--frame-type-scale))] leading-[1.26] [overflow-wrap:anywhere] break-words">
          {{SLOT:item_body}}</p>
        <p
          class="m-[auto_0_0] font-brand-body text-brand-muted text-[calc(16px*var(--layout-scale)*var(--frame-type-scale))] uppercase tracking-[0.06em] leading-[1.2] [overflow-wrap:anywhere] break-words">
          {{SLOT:item_meta}}</p>
      </div>
    </article>
    {{FOOTER}}
  </div>
</div>
