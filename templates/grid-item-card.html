<!--
@id: layout/grid-item-card
@label: Grid Item Card
@description: Single reusable grid item card for building external boards and collages
@formats: instagram-square,instagram-portrait,instagram-story,carousel-post,twitter-card,linkedin-post

@slot item_tag | text | Small category or section label | Insight
@slot item_title | text | Card title text
@slot item_body | text | Supporting body text
@slot item_meta | text | Optional byline or source line | By Editorial Team
-->
<div class="content-shell template-grid-item-card template-inline-media {{ALIGN_CLASS}}">
  {{HEADER}}
  <div class="content-panel {{POSITION_CLASS}}">
    <article class="grid-item-card">
      <div class="grid-item-media" style="background-image: url('{{IMAGE_URL}}');"></div>
      <div class="grid-item-media-overlay"></div>
      <div class="grid-item-content">
        <div class="grid-item-tag">{{SLOT:item_tag}}</div>
        <h1 class="grid-item-title word-safe">{{SLOT:item_title}}</h1>
        <p class="grid-item-body word-safe">{{SLOT:item_body}}</p>
        <p class="grid-item-meta word-safe">{{SLOT:item_meta}}</p>
      </div>
    </article>
    {{FOOTER}}
  </div>
</div>
