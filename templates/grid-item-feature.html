<!--
@id: layout/grid-item-feature
@label: Grid Item Feature
@description: Emphasis variant of a single reusable grid item card for board compositions
@formats: instagram-square,instagram-portrait,instagram-story,carousel-post,twitter-card,linkedin-post
@background_image: inline

@slot item_tag | text | Small category or section label | Feature
@slot item_title | text | Feature card title text
@slot item_body | text | Feature supporting text
@slot item_meta | text | Optional byline or source line | By Editorial Team
-->
<div class="relative z-10 flex h-full w-full flex-col items-start text-left">
  <div class="px-6 pt-6">
    {{HEADER}}
  </div>
  <div class="relative isolate z-0 mt-auto flex h-full min-h-0 flex-col p-0">
    <article class="relative flex min-h-0 flex-1 flex-col overflow-hidden bg-transparent">
      <img src="{{IMAGE_URL}}" alt="" class="min-h-0 basis-1/2 w-full object-cover" />
      <div
        class="pointer-events-none absolute left-0 right-0 top-0 h-1/2 bg-gradient-to-t from-black/40 to-transparent">
      </div>
      <div
        class="flex min-h-0 flex-1 flex-col gap-3 bg-black/15 p-6">
        <div
          class="font-brand-body text-brand-muted text-base font-semibold uppercase tracking-[0.08em] leading-[1.2]">
          {{SLOT:item_tag}}</div>
        <h1
          class="m-0 font-brand-body text-brand-primary text-6xl leading-[1.06] [overflow-wrap:anywhere] break-words">
          {{SLOT:item_title}}</h1>
        <p
          class="m-0 font-brand-body text-brand-secondary text-2xl leading-[1.26] [overflow-wrap:anywhere] break-words">
          {{SLOT:item_body}}</p>
        <p
          class="m-[auto_0_0] font-brand-body text-brand-muted text-base uppercase tracking-[0.06em] leading-[1.2] [overflow-wrap:anywhere] break-words">
          {{SLOT:item_meta}}</p>
      </div>
    </article>
    {{FOOTER}}
  </div>
</div>
