<!--
@id: layout/grid-item-feature
@label: Grid Item Feature
@description: Emphasis variant of a single reusable grid item card for board compositions
@formats: instagram-square,instagram-portrait,instagram-story,carousel-post,twitter-card,linkedin-post
@background_image: inline

@slot item_tag | text | Small category or section label | Feature
@slot item_title | text | Feature card title text
@slot item_body | text | Feature supporting text
@slot item_meta | text | Optional byline or source line | By Editorial Team
@slot brand_icon | text | Monogram text for the floating brand icon
@slot brand_icon_x | number | Icon horizontal position percent (0-100) | 92
@slot brand_icon_y | number | Icon vertical position percent (0-100) | 9
@slot brand_icon_size | number | Icon circle size in px | 92
@slot brand_icon_opacity | number | Icon opacity from 0 to 1 | 0.92
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 grid h-full w-full grid-rows-[auto_minmax(0,1fr)] gap-4 p-6 text-left">
  <header class="flex w-full items-start justify-between gap-3">
    <div class="flex max-w-full flex-wrap items-center gap-2.5">
      <span
        class="inline-flex w-fit items-center border border-black/88 bg-white/58 px-3 py-1.5 font-brand-body text-[11px] font-semibold uppercase tracking-[0.12em] leading-[1.05] text-brand-primary group-data-[template-tone=dark]:border-white/84 group-data-[template-tone=dark]:bg-black/44">
        {{BRAND_NAME}}</span>
      <span
        class="inline-flex w-fit items-center border border-black/88 bg-white/58 px-3 py-1.5 font-brand-body text-[11px] font-semibold uppercase tracking-[0.12em] leading-[1.05] text-brand-primary empty:hidden group-data-[template-tone=dark]:border-white/84 group-data-[template-tone=dark]:bg-black/44">
        {{SLIDE_LABEL}}</span>
    </div>
  </header>
  <section
    class="relative flex h-full min-h-0 w-full flex-col overflow-hidden border border-black/86 bg-white/86 backdrop-blur-[1.25px] group-data-[template-tone=dark]:border-white/62 group-data-[template-tone=dark]:bg-black/84">
    <div class="relative h-[50%] min-h-0 w-full overflow-hidden border-b border-black/80 group-data-[template-tone=dark]:border-white/56">
      <img src="{{IMAGE_URL}}" alt="" class="absolute inset-0 h-full w-full object-cover grayscale contrast-[1.12]" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/62 to-black/8"></div>
    </div>
    <div
      class="flex min-h-0 flex-1 flex-col gap-2 border-t border-black/74 bg-white/72 p-5 group-data-[template-tone=dark]:border-white/56 group-data-[template-tone=dark]:bg-black/72">
      <p class="m-0 font-brand-body text-[clamp(12px,1.35vw,15px)] font-semibold uppercase tracking-[0.09em] leading-[1.2] text-brand-secondary">
        {{SLOT:item_tag}}</p>
      <h1
        class="m-0 font-brand-display text-[clamp(40px,6vw,66px)] leading-[0.98] tracking-[-0.013em] text-brand-primary [overflow-wrap:anywhere] break-words">
        {{SLOT:item_title}}</h1>
      <p
        class="m-0 font-brand-body text-[clamp(19px,2.5vw,28px)] leading-[1.28] text-brand-secondary [overflow-wrap:anywhere] break-words">
        {{SLOT:item_body}}</p>
      <p
        class="m-0 pt-1 font-brand-body text-[clamp(12px,1.35vw,15px)] uppercase tracking-[0.09em] leading-[1.2] text-brand-muted [overflow-wrap:anywhere] break-words">
        {{SLOT:item_meta}}</p>
    </div>
  </section>
</div>
