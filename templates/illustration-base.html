<div class="absolute -left-[6%] top-[6%] rounded-full" style="width: calc(320px * var(--layout-scale)); height: calc(320px * var(--layout-scale)); background: color-mix(in srgb, var(--color-brand-glow) 48%, transparent);"></div>
<div class="absolute right-[7%] bottom-[9%] rounded-[30%]" style="width: calc(240px * var(--layout-scale)); height: calc(240px * var(--layout-scale)); background: color-mix(in srgb, var(--color-brand-accent) 36%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: calc({{CONTENT_INSET}}px * var(--layout-scale) * var(--frame-space-scale)); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: calc(38px * var(--layout-scale) * var(--frame-space-scale));">
    {{KICKER}}
    <h1 class="mt-2 text-balance break-words" style="font-family: var(--font-display); font-size: calc(68px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1.01; letter-spacing: -0.02em; max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{HEADING}}</h1>
    <p class="mt-3 break-words text-[var(--color-text-secondary)]" style="font-size: calc(29px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1.34; max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{BODY}}</p>
    {{FOOTER}}
  </div>
</div>
