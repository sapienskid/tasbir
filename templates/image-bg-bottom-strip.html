<!--
@id: layout/image-bg-bottom-strip
@label: Image Background Bottom Strip
@description: Full-bleed image background with a strong bottom content strip
@selection_hints: lower-third headline, teaser over photo, social promo card, image-led statement
@formats: instagram-square,instagram-portrait,instagram-story,twitter-card,linkedin-post,carousel-post
@background_image: global
@slot body | text | Main body text content to display in the bottom-anchored strip  |
@slot illustration_seed | text | Deterministic seed for generated illustration layer |

-->
<div class="relative z-10 flex h-full w-full flex-col justify-end p-[clamp(18px,2.8vw,44px)] text-brand-primary">
  <span aria-hidden="true" data-illustration-mark="1"
    class="{{ILLUSTRATION_VISIBILITY_CLASS}} pointer-events-none absolute z-30 {{ILLUSTRATION_ELEMENT_CLASS}}"></span>

  <section class="illustration-surface w-full border-4 border-brand-primary p-[clamp(16px,2.3vw,32px)]">

    <div class="text-[length:var(--token-type-body)] leading-[1.18] tracking-[-0.01em] text-brand-secondary mb-5">
      {{BODY}}
    </div>
  </section>
</div>
