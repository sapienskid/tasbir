<!--
@id: layout/image-bg-bottom-strip
@label: Image Background Bottom Strip
@description: Full-bleed image background with a strong bottom content strip
@selection_hints: lower-third headline, teaser over photo, social promo card, image-led statement
@formats: instagram-square,instagram-portrait,instagram-story,twitter-card,linkedin-post,carousel-post
@background_image: global

@slot strip_tag | text | Tag label displayed above the main heading  | 
@slot strip_meta | text | Metadata text at the bottom strip footer  | 
@slot cta_text | text | Call-to-action label in the strip footer  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 flex h-full w-full flex-col justify-between p-[clamp(18px,2.8vw,44px)] text-brand-primary">
  <header class="w-fit border-2 border-brand-primary bg-brand-surface px-4 py-2">
    <p class="font-brand-body text-[clamp(10px,0.9vw,12px)] font-black uppercase tracking-[0.26em]">
      {{BRAND_NAME}}
    </p>
  </header>

  <section class="w-full border-4 border-brand-primary bg-brand-surface p-[clamp(16px,2.3vw,32px)]">
    <p class="mb-3 font-brand-body text-[clamp(10px,0.9vw,12px)] font-black uppercase tracking-[0.26em]">
      {{SLOT:strip_tag}}
    </p>
    <h1 class="font-brand-display text-[length:var(--token-type-heading)] leading-[0.98] tracking-[-0.02em] font-bold mb-4 uppercase">
      {{HEADING}}
    </h1>
    <div class="text-[length:var(--token-type-body)] leading-[1.18] tracking-[-0.01em] text-brand-secondary mb-5">
      {{BODY}}
    </div>

    <footer class="flex items-center justify-between gap-4 border-t-2 border-brand-primary pt-3">
      <p class="font-brand-body text-[clamp(10px,0.88vw,12px)] font-bold uppercase tracking-[0.22em] text-brand-muted">
        {{SLOT:strip_meta}}
      </p>
      <p class="border-2 border-brand-primary px-3 py-1 font-brand-body text-[clamp(10px,0.88vw,12px)] font-black uppercase tracking-[0.22em]">
        {{SLOT:cta_text}}
      </p>
    </footer>
  </section>
</div>
