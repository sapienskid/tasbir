<!--
@id: layout/image-bg-center-panel
@label: Image Background Center Panel
@description: Full-bleed image background with centered text panel
@selection_hints: quote over image, centered thesis, campaign message, balanced hero overlay
@formats: instagram-square,instagram-portrait,instagram-story,twitter-card,linkedin-post,carousel-post
@background_image: global

@slot panel_tag | text | Compact tag above the centered heading  | 
@slot panel_meta | text | Metadata below the centered body copy  | 
@slot cta_text | text | Small call-to-action text inside panel footer  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
@slot illustration_seed | text | Deterministic seed for generated illustration layer |
-->
<div class="relative z-10 flex h-full w-full items-center justify-center p-[clamp(18px,2.8vw,44px)] text-brand-primary">
  <span aria-hidden="true" data-illustration-mark="1"
    class="{{ILLUSTRATION_VISIBILITY_CLASS}} pointer-events-none absolute z-30 {{ILLUSTRATION_ELEMENT_CLASS}}"></span>
  <section class="illustration-surface w-full max-w-[92%] border-4 border-brand-primary p-[clamp(18px,2.5vw,36px)] text-center">

    <div class="text-[length:var(--token-type-body)] leading-[1.18] tracking-[-0.01em] text-brand-secondary mx-auto mb-5 max-w-[94%]">
      {{BODY}}
    </div>
    
  </section>
  
  
</div>
