<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 34px 38px;">
    <div class="inline-flex w-fit items-center rounded-full border px-4 py-2 text-[14px] font-semibold uppercase tracking-[0.1em]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 76%, transparent);">{{SLOT:kicker}}</div>
    <h1 class="mt-4 text-balance break-words text-[64px] leading-[1.02] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
    <div class="mt-4 flex flex-col gap-3" style="max-width: {{CAPTION_MAX_WIDTH}}px;">
      <div class="rounded-xl border px-4 py-3 text-[23px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">1. {{SLOT:step_1}}</div>
      <div class="rounded-xl border px-4 py-3 text-[23px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">2. {{SLOT:step_2}}</div>
      <div class="rounded-xl border px-4 py-3 text-[23px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">3. {{SLOT:step_3}}</div>
    </div>
    {{FOOTER}}
  </div>
</div>
