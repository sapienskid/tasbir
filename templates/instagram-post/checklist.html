<div class="absolute right-10 top-12 rounded-2xl border px-5 py-4" style="border-color: color-mix(in srgb, var(--color-border-subtle) 84%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 76%, transparent);">
  <p class="text-[14px] font-semibold uppercase tracking-[0.1em] text-[var(--color-text-muted)]">{{SLOT:kicker}}</p>
</div>
<div class="relative z-10 flex h-full w-full flex-col gap-5" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance text-[66px] leading-[1] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
  <div class="mt-2 flex flex-col gap-3" style="max-width: {{CAPTION_MAX_WIDTH}}px;">
    <div class="rounded-xl border px-4 py-3 text-[24px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 80%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 72%, transparent);">1. {{SLOT:step_1}}</div>
    <div class="rounded-xl border px-4 py-3 text-[24px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 80%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 72%, transparent);">2. {{SLOT:step_2}}</div>
    <div class="rounded-xl border px-4 py-3 text-[24px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 80%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 72%, transparent);">3. {{SLOT:step_3}}</div>
  </div>
  {{FOOTER}}
</div>
