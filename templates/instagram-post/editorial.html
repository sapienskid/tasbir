<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 42px 46px;">
    <h1 class="text-balance break-words text-[72px] leading-[1.01] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
    <p class="mt-3 break-words text-[31px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
    {{FOOTER}}
  </div>
</div>
