<div class="absolute inset-0" style="background-image: linear-gradient(color-mix(in srgb, var(--color-border-subtle) 28%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--color-border-subtle) 24%, transparent) 1px, transparent 1px); background-size: 88px 88px;"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 40px 44px;">
    <div class="inline-flex w-fit items-center rounded-full border px-5 py-2 text-[14px] font-semibold uppercase tracking-[0.09em]" style="border-color: color-mix(in srgb, var(--color-brand-accent) 72%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 76%, transparent);">{{BRAND_NAME}}</div>
    <h1 class="mt-4 text-balance break-words text-[68px] leading-[1.02] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
    <p class="mt-3 break-words text-[30px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
    {{FOOTER}}
  </div>
</div>
