<div class="absolute -right-16 -top-20 h-72 w-72 rounded-full" style="background: color-mix(in srgb, var(--color-brand-accent) 52%, transparent);"></div>
<div class="absolute -left-20 bottom-36 h-64 w-64 rounded-full" style="background: color-mix(in srgb, var(--color-brand-glow) 52%, transparent);"></div>
<div class="absolute right-24 top-44 h-36 w-36 rotate-12 rounded-[40px] border" style="border-color: color-mix(in srgb, var(--color-brand-accent) 72%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 44%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col gap-7" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance text-[78px] leading-[0.98] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
  <p class="text-[34px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
  {{FOOTER}}
</div>
