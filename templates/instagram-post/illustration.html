<div class="absolute -right-16 -top-20 h-72 w-72 rounded-full" style="background: color-mix(in srgb, var(--color-brand-accent) 42%, transparent);"></div>
<div class="absolute -left-20 bottom-36 h-64 w-64 rounded-full" style="background: color-mix(in srgb, var(--color-brand-glow) 44%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 40px 44px;">
    <h1 class="text-balance break-words text-[70px] leading-[1.01] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
    <p class="mt-3 break-words text-[30px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
    {{FOOTER}}
  </div>
</div>
