<div class="absolute left-12 top-10 text-[220px] leading-none text-[var(--color-brand-accent)]" style="font-family: var(--font-display); opacity: 0.28;">“</div>
<div class="relative z-10 flex h-full w-full flex-col gap-6" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <p class="text-[20px] font-semibold uppercase tracking-[0.12em] text-[var(--color-text-muted)]">{{SLOT:kicker}}</p>
  <h1 class="text-balance text-[70px] leading-[1] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:quote_text}}</h1>
  <p class="text-[24px] leading-[1.3] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">— {{SLOT:quote_author}}</p>
  <p class="text-[30px] leading-[1.3] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:insight_line}}</p>
  {{FOOTER}}
</div>
