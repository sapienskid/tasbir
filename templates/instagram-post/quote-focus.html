<div class="absolute left-12 top-12 text-[160px] leading-none text-[var(--color-brand-accent)]" style="font-family: var(--font-display); opacity: 0.18;">“</div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 34px 38px;">
    <p class="break-words text-[19px] font-semibold uppercase tracking-[0.12em] text-[var(--color-text-muted)]">{{SLOT:kicker}}</p>
    <h1 class="mt-2 text-balance break-words text-[62px] leading-[1.02] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:quote_text}}</h1>
    <p class="mt-3 break-words text-[24px] leading-[1.22] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">— {{SLOT:quote_author}}</p>
    <p class="mt-2 break-words text-[27px] leading-[1.32] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:insight_line}}</p>
    {{FOOTER}}
  </div>
</div>
