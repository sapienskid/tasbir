<div class="absolute inset-y-0 right-0 w-[36%]" style="background: linear-gradient(180deg, color-mix(in srgb, var(--color-brand-accent) 54%, transparent), color-mix(in srgb, var(--color-overlay-strong) 88%, transparent));"></div>
<div class="absolute right-12 top-16 rounded-2xl border px-6 py-4" style="border-color: color-mix(in srgb, var(--color-brand-accent) 80%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 76%, transparent);">
  <p class="text-[18px] uppercase tracking-[0.1em] text-[var(--color-text-muted)]">{{SLOT:kicker}}</p>
  <p class="text-[86px] leading-none" style="font-family: var(--font-display);">{{SLOT:metric_value}}</p>
  <p class="text-[24px] leading-[1.2] text-[var(--color-text-secondary)]">{{SLOT:metric_label}}</p>
</div>
<div class="relative z-10 flex h-full w-full flex-col gap-6" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance text-[78px] leading-[0.98] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: calc({{CONTENT_MAX_WIDTH}}px - 220px); text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
  <p class="text-[32px] leading-[1.32] text-[var(--color-text-secondary)]" style="max-width: calc({{CAPTION_MAX_WIDTH}}px - 220px); text-shadow: var(--frame-caption-shadow);">{{SLOT:insight_line}}</p>
  {{FOOTER}}
</div>
