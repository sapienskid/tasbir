<div class="absolute inset-y-0 right-0" style="width: 34%; background: linear-gradient(180deg, color-mix(in srgb, var(--color-brand-accent) 46%, transparent), color-mix(in srgb, var(--color-overlay-strong) 64%, transparent));"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 34px 36px;">
    <div class="inline-flex w-fit items-center rounded-full border px-4 py-2 text-[14px] font-semibold uppercase tracking-[0.09em]" style="border-color: color-mix(in srgb, var(--color-brand-accent) 78%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 76%, transparent);">{{SLOT:kicker}}</div>
    <div class="mt-4 flex items-start justify-between gap-6">
      <div style="max-width: calc({{CONTENT_MAX_WIDTH}}px - 280px);">
        <h1 class="text-balance break-words text-[66px] leading-[1.01] tracking-[-0.02em]" style="font-family: var(--font-display); text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
        <p class="mt-3 break-words text-[29px] leading-[1.33] text-[var(--color-text-secondary)]" style="max-width: calc({{CAPTION_MAX_WIDTH}}px - 260px); text-shadow: var(--frame-caption-shadow);">{{SLOT:insight_line}}</p>
      </div>
      <div class="rounded-2xl border px-5 py-4" style="min-width: 250px; border-color: color-mix(in srgb, var(--color-brand-accent) 80%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 76%, transparent);">
        <p class="tabular-nums text-[74px] leading-none" style="font-family: var(--font-display);">{{SLOT:metric_value}}</p>
        <p class="mt-1 break-words text-[22px] leading-[1.2] text-[var(--color-text-secondary)]">{{SLOT:metric_label}}</p>
      </div>
    </div>
    {{FOOTER}}
  </div>
</div>
