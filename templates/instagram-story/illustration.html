<div class="absolute -top-16 left-10 h-80 w-80 rounded-full" style="background: color-mix(in srgb, var(--color-brand-accent) 40%, transparent);"></div>
<div class="absolute right-10 top-44 h-56 w-56 rounded-full" style="background: color-mix(in srgb, var(--color-brand-glow) 50%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col justify-end" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-6" style="padding: 40px 42px;">
    <h1 class="text-balance break-words text-[76px] leading-[0.99] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
    <p class="mt-4 break-words text-[34px] leading-[1.3] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
    {{FOOTER}}
  </div>
</div>
