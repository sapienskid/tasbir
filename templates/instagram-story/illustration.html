<div class="absolute -top-16 left-8 h-80 w-80 rounded-full" style="background: color-mix(in srgb, var(--color-brand-accent) 48%, transparent);"></div>
<div class="absolute right-8 top-40 h-56 w-56 rounded-full" style="background: color-mix(in srgb, var(--color-brand-glow) 64%, transparent);"></div>
<div class="absolute inset-x-0 bottom-0 h-[58%]" style="background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--color-overlay-strong) 90%, transparent));"></div>
<div class="relative z-10 flex h-full w-full flex-col justify-end gap-8" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance text-[92px] leading-[0.96] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
  <p class="text-[40px] leading-[1.32] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
  {{FOOTER}}
</div>
