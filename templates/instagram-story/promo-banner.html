<div class="relative z-10 flex h-full w-full flex-col justify-end" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-6" style="padding: 40px 42px;">
    <div class="inline-flex w-fit items-center rounded-full border px-5 py-2 text-[15px] font-semibold uppercase tracking-[0.09em]" style="border-color: color-mix(in srgb, var(--color-brand-accent) 80%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">{{SLOT:kicker}}</div>
    <h1 class="mt-4 text-balance break-words text-[76px] leading-[0.99] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
    <p class="mt-3 break-words text-[34px] leading-[1.28] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:supporting_line}}</p>
    <div class="mt-6 inline-flex w-fit items-center rounded-full px-6 py-3 text-[23px] font-semibold" style="background: var(--color-brand-accent); color: var(--color-brand-accent-foreground);">{{SLOT:cta_text}}</div>
    {{FOOTER}}
  </div>
</div>
