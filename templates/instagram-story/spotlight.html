<div class="absolute inset-x-0 bottom-0 h-[48%]" style="background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--color-overlay-strong) 92%, transparent));"></div>
<div class="relative z-10 flex h-full w-full flex-col justify-end gap-8" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance break-words text-[98px] leading-[0.96] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
  <p class="break-words text-[44px] leading-[1.32] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
  {{FOOTER}}
</div>
