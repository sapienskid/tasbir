<div class="relative z-10 flex h-full w-full flex-col justify-end" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-6" style="padding: 38px 40px;">
    <div class="flex items-start gap-6">
      <div class="relative" style="width: 46px; min-height: 430px;">
        <div class="absolute left-[22px] top-0 h-full w-[2px]" style="background: linear-gradient(color-mix(in srgb, var(--color-brand-accent) 80%, transparent), transparent);"></div>
        <div class="absolute left-3 top-10 h-8 w-8 rounded-full border" style="border-color: color-mix(in srgb, var(--color-brand-accent) 80%, transparent); background: color-mix(in srgb, var(--color-brand-accent) 28%, var(--color-surface-base));"></div>
        <div class="absolute left-3 top-56 h-8 w-8 rounded-full border" style="border-color: color-mix(in srgb, var(--color-brand-accent) 80%, transparent); background: color-mix(in srgb, var(--color-brand-accent) 28%, var(--color-surface-base));"></div>
      </div>
      <div style="max-width: calc({{CONTENT_MAX_WIDTH}}px - 120px);">
        <h1 class="text-balance break-words text-[74px] leading-[0.99] tracking-[-0.02em]" style="font-family: var(--font-display); text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
        <p class="mt-4 break-words text-[33px] leading-[1.3] text-[var(--color-text-secondary)]" style="max-width: calc({{CAPTION_MAX_WIDTH}}px - 120px); text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
      </div>
    </div>
    {{FOOTER}}
  </div>
</div>
