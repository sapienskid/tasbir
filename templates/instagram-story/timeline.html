<div class="absolute left-16 top-20 h-[78%] w-[2px]" style="background: linear-gradient(color-mix(in srgb, var(--color-brand-accent) 82%, transparent), transparent);"></div>
<div class="absolute left-[52px] top-60 h-8 w-8 rounded-full border" style="border-color: color-mix(in srgb, var(--color-brand-accent) 82%, transparent); background: color-mix(in srgb, var(--color-brand-accent) 30%, var(--color-surface-base));"></div>
<div class="absolute left-[52px] top-[55%] h-8 w-8 rounded-full border" style="border-color: color-mix(in srgb, var(--color-brand-accent) 82%, transparent); background: color-mix(in srgb, var(--color-brand-accent) 30%, var(--color-surface-base));"></div>
<div class="relative z-10 flex h-full w-full flex-col justify-end gap-8" style="padding: {{CONTENT_INSET}}px; padding-left: calc({{CONTENT_INSET}}px + 44px); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance text-[90px] leading-[0.96] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
  <p class="text-[40px] leading-[1.3] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
  {{FOOTER}}
</div>
