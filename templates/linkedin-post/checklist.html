<div class="absolute left-0 top-0 h-full" style="width: 8px; background: color-mix(in srgb, var(--color-brand-accent) 84%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; padding-left: calc({{CONTENT_INSET}}px + 20px); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 28px 32px;">
    <p class="break-words text-[14px] font-semibold uppercase tracking-[0.1em] text-[var(--color-text-muted)]">{{SLOT:kicker}}</p>
    <h1 class="mt-1 text-balance break-words text-[48px] leading-[1.04] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
    <div class="mt-4 grid grid-cols-2 gap-3" style="max-width: {{CAPTION_MAX_WIDTH}}px;">
      <div class="rounded-xl border px-4 py-3 text-[19px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">1. {{SLOT:step_1}}</div>
      <div class="rounded-xl border px-4 py-3 text-[19px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">2. {{SLOT:step_2}}</div>
      <div class="rounded-xl border px-4 py-3 text-[19px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">3. {{SLOT:step_3}}</div>
      <div class="rounded-xl border px-4 py-3 text-[19px]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">4. {{SLOT:step_4}}</div>
    </div>
    {{FOOTER}}
  </div>
</div>
