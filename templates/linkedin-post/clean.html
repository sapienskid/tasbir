<div class="absolute left-0 top-0 h-full" style="width: 8px; background: color-mix(in srgb, var(--color-brand-accent) 82%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; padding-left: calc({{CONTENT_INSET}}px + 20px); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 32px 36px;">
    <h1 class="text-balance break-words text-[54px] leading-[1.02] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
    <p class="mt-2 break-words text-[25px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
    {{FOOTER}}
  </div>
</div>
