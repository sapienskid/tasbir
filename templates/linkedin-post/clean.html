<div class="absolute left-0 top-0 h-full w-2" style="background: color-mix(in srgb, var(--color-brand-accent) 84%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col gap-4" style="padding: {{CONTENT_INSET}}px; padding-left: calc({{CONTENT_INSET}}px + 18px); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance break-words text-[58px] leading-[1] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
  <p class="break-words text-[26px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
  {{FOOTER}}
</div>
