<div class="absolute -right-10 -top-14 h-56 w-56 rounded-full" style="background: color-mix(in srgb, var(--color-brand-accent) 42%, transparent);"></div>
<div class="absolute inset-x-0 bottom-0 h-[44%]" style="background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--color-overlay-strong) 86%, transparent));"></div>
<div class="relative z-10 flex h-full w-full flex-col gap-4" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance break-words text-[56px] leading-[1] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
  <p class="break-words text-[26px] leading-[1.35] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
  {{FOOTER}}
</div>
