<div class="absolute left-16 top-12 h-40 w-40 rounded-[28px]" style="background: color-mix(in srgb, var(--color-brand-glow) 54%, transparent);"></div>
<div class="absolute right-16 bottom-10 h-36 w-36 rotate-12 rounded-full" style="background: color-mix(in srgb, var(--color-brand-accent) 52%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col gap-4" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance text-[56px] leading-[1] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
  <p class="text-[25px] leading-[1.35] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
  {{FOOTER}}
</div>
