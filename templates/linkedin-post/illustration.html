<div class="absolute left-16 top-14 h-40 w-40 rounded-[28px]" style="background: color-mix(in srgb, var(--color-brand-glow) 44%, transparent);"></div>
<div class="absolute right-16 bottom-12 h-32 w-32 rotate-12 rounded-full" style="background: color-mix(in srgb, var(--color-brand-accent) 44%, transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 30px 34px;">
    <h1 class="text-balance break-words text-[52px] leading-[1.02] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
    <p class="mt-2 break-words text-[24px] leading-[1.34] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
    {{FOOTER}}
  </div>
</div>
