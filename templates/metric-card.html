<!--
@id: layout/single-metric-focus
@label: Single Metric Focus
@description: Data-focused layout emphasizing one metric and supporting interpretation

@slot metric_value | text | The primary metric or number to display prominently
@slot metric_label | text | Short label describing what the metric measures
@slot headline | text | Supporting headline text shown below the metric
-->
<div
  class="relative z-10 flex h-full w-full flex-col p-14 items-start text-left">
  {{HEADER}}
  <div class="relative isolate z-0 mt-auto p-8">
    <div class="mb-6 flex flex-col gap-1">
      <div
        class="font-brand-display text-brand-primary text-7xl leading-none tabular-nums">
        {{SLOT:metric_value}}</div>
      <div
        class="font-brand-body text-brand-secondary text-xl leading-[1.2]">
        {{SLOT:metric_label}}</div>
    </div>
    <div class="mt-4 h-px w-full bg-brand-border"></div>
    <h1
      class="mt-4 max-w-5xl font-brand-display text-brand-primary text-5xl leading-tight tracking-tight drop-shadow-sm text-balance [overflow-wrap:anywhere] break-words">
      {{SLOT:headline}}</h1>
    <p
      class="mt-4 max-w-4xl font-brand-body text-brand-secondary text-xl leading-relaxed drop-shadow-sm [overflow-wrap:anywhere] break-words">
      {{BODY}}</p>
    {{FOOTER}}
  </div>
</div>
