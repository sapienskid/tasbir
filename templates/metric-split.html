<div class="top-band top-band--metric"></div>
<div class="content-shell content-shell--metric-topband template-metric {{ALIGN_CLASS}}">
  {{HEADER}}
  <div class="content-panel push-end">
    <div class="metric-layout">
      <div class="metric-content">
        {{KICKER}}
        <h1 class="heading-secondary flow-after-kicker text-balance word-safe">{{SLOT:headline}}</h1>
        <p class="body-secondary flow-after-heading caption-limit-metric word-safe">{{SLOT:insight_line}}</p>
      </div>
      <div class="metric-card">
        <p class="tabular-nums metric-value">{{SLOT:metric_value}}</p>
        <p class="metric-label flow-after-kicker word-safe">{{SLOT:metric_label}}</p>
      </div>
    </div>
    {{FOOTER}}
  </div>
</div>
