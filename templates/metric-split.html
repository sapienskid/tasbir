<div class="absolute inset-x-0 top-0 metric-top-band"></div>
<div class="content-shell content-shell--metric-topband {{ALIGN_CLASS}}">
  {{HEADER}}
  <div class="mt-auto panel-pad-30">
    <div class="flex items-start justify-between panel-gap-18">
      <div class="content-max-minus-metric">
        {{KICKER}}
        <h1 class="mt-2 text-balance break-words heading-display-58">{{SLOT:headline}}</h1>
        <p class="mt-3 break-words body-lead-26 caption-max-minus-metric">{{SLOT:insight_line}}</p>
      </div>
      <div class="metric-card">
        <p class="tabular-nums metric-value">{{SLOT:metric_value}}</p>
        <p class="mt-1 break-words metric-label">{{SLOT:metric_label}}</p>
      </div>
    </div>
    {{FOOTER}}
  </div>
</div>
