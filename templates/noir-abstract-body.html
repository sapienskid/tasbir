<!--
@id: layout/noir-abstract-body
@label: Noir Abstract Body
@description: Dark layout with abstract geometric marks above editorial title and body
@selection_hints: premium dark aesthetic, reflective essay, emotional narrative, cinematic tone
@formats: instagram-portrait,carousel-post
@frame_tone: dark
@background_image: inline

@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 flex h-full w-full flex-col bg-brand-surface px-[54px] py-[48px] text-brand-primary">
  <div class="mx-auto w-[76%] max-w-[760px] overflow-hidden rounded-md border border-brand-primary/20">
    <div class="aspect-[36/26] w-full">
      <img src="{{IMAGE_URL}}" alt=""
        class="h-full w-full object-cover grayscale contrast-125 brightness-105 saturate-0" />
    </div>
  </div>

  <div class="mt-auto">
    <h1
      class="max-w-[96%] font-brand-display text-[clamp(67px,7.7vw,94px)] font-semibold leading-[0.9] tracking-[-0.012em] text-balance">
      {{HEADING}}
    </h1>
    <div
      class="mt-[20px] max-w-[97%] font-brand-body text-[clamp(34px,3.5vw,49px)] font-medium leading-[1.21] tracking-[-0.01em] text-brand-secondary">
      {{BODY}}
    </div>
  </div>
</div>
