<!--
@id: layout/noir-abstract-byline
@label: Noir Abstract Byline
@description: Dark abstract cover layout with centered mark, serif headline, and byline
@formats: instagram-portrait,carousel-post
@frame_tone: dark
@background_image: inline

@slot byline | text | Author byline shown at the bottom left  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 flex h-full w-full flex-col bg-brand-surface px-[58px] py-[56px] text-brand-primary">
  <div class="mx-auto mt-[10px] w-[62%] max-w-[620px] overflow-hidden rounded-md border border-brand-primary/20">
    <div class="aspect-[36/26] w-full">
      <img src="{{IMAGE_URL}}" alt=""
        class="h-full w-full object-cover grayscale contrast-125 brightness-105 saturate-0" />
    </div>
  </div>

  <h1
    class="mt-[74px] max-w-[95%] font-brand-display text-[clamp(76px,8.2vw,106px)] font-semibold leading-[0.9] tracking-[-0.012em] text-balance">
    {{HEADING}}
  </h1>

  <p
    class="mt-auto font-brand-body text-[clamp(34px,3.4vw,48px)] font-medium leading-[1.16] tracking-[-0.01em] text-brand-secondary">
    {{SLOT:byline}}
  </p>
</div>
