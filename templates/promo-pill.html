<div class="relative z-10 flex h-full w-full flex-col" style="padding: calc({{CONTENT_INSET}}px * var(--layout-scale) * var(--frame-space-scale)); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: calc(34px * var(--layout-scale) * var(--frame-space-scale));">
    {{KICKER}}
    <h1 class="mt-3 text-balance break-words" style="font-family: var(--font-display); font-size: calc(62px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1; letter-spacing: -0.02em; max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
    <p class="mt-3 break-words text-[var(--color-text-secondary)]" style="font-size: calc(26px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1.3; max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:supporting_line}}</p>
    <div class="mt-6 inline-flex w-fit items-center rounded-full" style="padding: calc(12px * var(--layout-scale) * var(--frame-space-scale)) calc(24px * var(--layout-scale) * var(--frame-space-scale)); font-size: calc(24px * var(--layout-scale) * var(--frame-type-scale)); font-weight: 700; background: var(--color-brand-accent); color: var(--color-brand-accent-foreground);">{{SLOT:cta_text}}</div>
    {{FOOTER}}
  </div>
</div>
