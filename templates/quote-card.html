<!--
@id: layout/quote-attribution
@label: Quote Attribution
@description: Pull-quote layout with author and role attribution

@slot quote_text | text | The quote or pull-quote text to display prominently
@slot quote_author | text | Name of the person being quoted | Editorial Team
@slot author_role | text | Role or title of the quoted person
-->
<div
  class="pointer-events-none absolute left-[8%] top-[7%] font-brand-display text-[148px] leading-[0.8] text-brand-primary opacity-[0.12]">
  "</div>
<div
  class="relative z-10 flex h-full w-full flex-col p-14 items-start text-left">
  {{HEADER}}
  <div class="relative isolate z-0 mt-auto p-8">
    <h1
      class="mt-2 max-w-5xl font-brand-display italic text-brand-primary text-5xl leading-tight tracking-tight drop-shadow-sm text-balance [overflow-wrap:anywhere] break-words">
      {{SLOT:quote_text}}</h1>
    <div class="mt-4 h-px w-[60px] bg-brand-border"></div>
    <div class="mt-4">
      <p
        class="font-brand-body text-brand-primary text-lg font-semibold uppercase tracking-[0.08em] leading-[1.2]">
        {{SLOT:quote_author}}</p>
      <p
        class="mt-0.5 font-brand-body italic text-brand-muted text-lg leading-[1.3]">
        {{SLOT:author_role}}</p>
    </div>
    {{FOOTER}}
  </div>
</div>
