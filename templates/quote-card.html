<!--
@id: layout/quote-card
@label: Quote Attribution
@description: High-impact Swiss-style pull-quote layout with author attribution
@formats: instagram-square,instagram-portrait,carousel-post,linkedin-post

@slot quote_text | text | The quote or pull-quote text to display prominently | 
@slot quote_author | text | Name of the person being quoted  | 
@slot author_role | text | Role or title of the quoted person  | 
@slot brand_icon_url | image_url | SVG or image URL for the brand icon layer | /images/brand/icon.svg
@slot brand_icon_x | number | Brand icon horizontal position in percent | 95.6
@slot brand_icon_y | number | Brand icon vertical position in percent | 96.3
@slot brand_icon_size | number | Brand icon size in px | 34
@slot brand_icon_opacity | number | Brand icon opacity | 0.95
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 flex h-full w-full bg-brand-surface text-brand-primary p-[var(--token-space-gutter)]">
  <div class="swiss-border-thick w-full h-full p-12 flex flex-col justify-between relative overflow-hidden">
    <!-- Large Background Quote Mark -->
    <div
      class="absolute -top-10 -left-6 font-brand-display text-[260px] font-black leading-none opacity-10 pointer-events-none">
      “
    </div>

    <header class="flex justify-between items-start mb-8 border-b-2 border-brand-primary pb-4">
      <div class="font-brand-body text-[16px] font-black uppercase tracking-[0.4em]">
        {{BRAND_NAME}}
      </div>
      <div class="font-brand-body text-[14px] font-bold uppercase tracking-[0.2em] text-brand-muted">
        {{SLIDE_LABEL}}
      </div>
    </header>

    <main class="flex-1 flex flex-col justify-center">
      <h1
        class="font-brand-display text-[clamp(42px,5.5vw,68px)] font-black leading-[0.9] tracking-tighter uppercase mb-8">
        {{SLOT:quote_text}}
      </h1>
      <div class="swiss-rule h-1 w-24 bg-brand-primary mb-8"></div>
    </main>

    <footer class="flex items-center gap-6">
      <div
        class="w-auto px-6 h-16 bg-brand-primary shrink-0 flex items-center justify-center text-brand-surface font-brand-body font-black text-[24px] uppercase tracking-tighter">
        {{BRAND_NAME}}
      </div>
      <div>
        <p class="font-brand-body text-[20px] font-black uppercase tracking-widest mb-1">
          {{SLOT:quote_author}}
        </p>
        <p class="font-brand-body text-[14px] font-bold uppercase tracking-[0.3em] text-brand-muted">
          {{SLOT:author_role}}
        </p>
      </div>
    </footer>
  </div>
</div>
