<!--
@id: layout/quote-attribution
@label: Quote Attribution
@description: Pull-quote layout with author and role attribution

@slot quote_text | text | The quote or pull-quote text to display prominently
@slot quote_author | text | Name of the person being quoted | Editorial Team
@slot author_role | text | Role or title of the quoted person
-->
<div
  class="pointer-events-none absolute left-[8%] top-[7%] font-brand-display text-[calc(148px*var(--layout-scale)*var(--frame-type-scale))] leading-[0.8] text-brand-primary opacity-[0.12]">
  "</div>
<div
  class="relative z-10 flex h-full w-full flex-col p-[calc(var(--content-inset)*var(--layout-scale)*var(--frame-space-scale))] {{ALIGN_CLASS}}"
  style="--template-panel-padding:34px;--template-heading-quote-size:56px;--template-body-quote-size:24px;--template-body-secondary-size:24px;--template-flow-kicker:var(--token-space-sm);--template-flow-heading:var(--token-space-sm);">
  {{HEADER}}
  <div class="relative {{POSITION_CLASS}} p-[calc(var(--template-panel-padding)*var(--layout-scale)*var(--frame-space-scale))]">
    <h1
      class="mt-[calc(var(--template-flow-kicker)*var(--layout-scale)*var(--frame-space-scale))] max-w-[var(--content-max-width)] font-brand-display italic text-brand-primary text-[calc(var(--template-heading-quote-size)*var(--layout-scale)*var(--frame-type-scale))] leading-[var(--template-heading-line-height)] tracking-[var(--template-heading-letter-spacing)] [text-shadow:var(--token-shadow-title)] text-balance [overflow-wrap:anywhere] break-words">
      {{SLOT:quote_text}}</h1>
    <div class="mt-[calc(var(--template-flow-heading)*var(--layout-scale)*var(--frame-space-scale))] h-px w-[60px] bg-brand-border"></div>
    <div class="mt-[calc(var(--token-space-sm)*var(--layout-scale)*var(--frame-space-scale))]">
      <p
        class="font-brand-body text-brand-primary text-[calc(18px*var(--layout-scale)*var(--frame-type-scale))] font-semibold uppercase tracking-[0.08em] leading-[1.2]">
        {{SLOT:quote_author}}</p>
      <p
        class="mt-[calc(2px*var(--layout-scale))] font-brand-body italic text-brand-muted text-[calc(18px*var(--layout-scale)*var(--frame-type-scale))] leading-[1.3]">
        {{SLOT:author_role}}</p>
    </div>
    {{FOOTER}}
  </div>
</div>
