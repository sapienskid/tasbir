<div class="quote-mark">“</div>
<div class="content-shell template-quote {{ALIGN_CLASS}}">
  {{HEADER}}
  <div class="content-panel push-end">
    {{KICKER}}
    <h1 class="heading-quote flow-after-kicker content-limit text-balance word-safe">{{SLOT:quote_text}}</h1>
    <p class="body-quote-attribution flow-after-heading caption-limit word-safe">- {{SLOT:quote_author}}</p>
    <p class="body-secondary flow-after-subheading caption-limit word-safe">{{SLOT:insight_line}}</p>
    {{FOOTER}}
  </div>
</div>
