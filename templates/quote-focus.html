<div class="absolute left-[8%] top-[7%] text-[var(--color-brand-accent)]" style="font-family: var(--font-display); font-size: calc(148px * var(--layout-scale) * var(--frame-type-scale)); line-height: 0.8; opacity: 0.22;">“</div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: calc({{CONTENT_INSET}}px * var(--layout-scale) * var(--frame-space-scale)); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: calc(34px * var(--layout-scale) * var(--frame-space-scale));">
    {{KICKER}}
    <h1 class="mt-2 text-balance break-words" style="font-family: var(--font-display); font-size: calc(60px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1.03; letter-spacing: -0.02em; max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:quote_text}}</h1>
    <p class="mt-3 break-words text-[var(--color-text-secondary)]" style="font-size: calc(24px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1.22; max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">- {{SLOT:quote_author}}</p>
    <p class="mt-2 break-words text-[var(--color-text-secondary)]" style="font-size: calc(24px * var(--layout-scale) * var(--frame-type-scale)); line-height: 1.32; max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:insight_line}}</p>
    {{FOOTER}}
  </div>
</div>
