<!--
@id: layout/split-copy-media
@label: Split Copy Media
@description: Top copy panel with bottom media panel for editorial and story-first posts
@formats: instagram-story,twitter-card,linkedin-post,instagram-portrait
@background_image: inline

@slot byline | text | Author/byline text | By Editorial Team
@slot publish_date | text | Publish date text | January 2026
@slot media_caption | text | Caption or annotation for lower media zone | Visual context placeholder
-->
<div class="relative z-10 flex h-full w-full flex-col items-start text-left">
  <div class="px-6 pt-6">
    <div class="flex w-full items-center justify-between gap-5">
  <span class="inline-flex w-fit items-center border border-brand-border bg-transparent px-4 py-2 font-brand-body text-sm font-medium uppercase tracking-[0.12em] leading-[1.1] text-brand-primary">{{BRAND_NAME}}</span>
  <span class="inline-flex w-fit items-center border border-brand-border bg-transparent px-4 py-2 font-brand-body text-sm font-medium uppercase tracking-[0.12em] leading-[1.1] text-brand-primary empty:hidden">{{SLIDE_LABEL}}</span>
</div>
  </div>
  <div class="relative isolate z-0 mt-auto flex h-full min-h-0 flex-col p-0">
    <div
      class="flex min-h-0 basis-1/2 flex-col justify-end bg-black/15 p-6">
      <h1
        class="max-w-5xl font-brand-display text-brand-primary text-6xl leading-tight tracking-tight drop-shadow-sm text-balance [overflow-wrap:anywhere] break-words">
        {{HEADING}}</h1>
      <p
        class="mt-4 max-w-4xl font-brand-body italic text-brand-secondary text-2xl leading-relaxed drop-shadow-sm [overflow-wrap:anywhere] break-words">
        {{BODY}}</p>
      <div class="mt-6 flex flex-wrap items-center gap-2">
        <span
          class="font-brand-body text-brand-muted text-base uppercase tracking-[0.03em] leading-[1.2]">{{SLOT:byline}}</span>
        <span
          class="font-brand-body text-brand-muted text-base uppercase tracking-[0.03em] leading-[1.2]">{{SLOT:publish_date}}</span>
      </div>
    </div>
    <div class="relative flex min-h-0 flex-1 items-end overflow-hidden bg-black/10">
      <img src="{{IMAGE_URL}}" alt="" class="absolute inset-0 h-full w-full object-cover" />
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent">
      </div>
      <div
        class="relative z-[1] p-4 font-brand-body text-brand-primary text-lg leading-[1.3] [overflow-wrap:anywhere] break-words">
        {{SLOT:media_caption}}</div>
    </div>
  </div>
</div>
