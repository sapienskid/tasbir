<!--
@id: layout/split-hero
@label: Split Copy Media
@description: Swiss-style split layout with copy and media integration
@formats: instagram-story,twitter-card,linkedin-post,instagram-portrait,carousel-post
@background_image: inline

@slot byline | text | Author/byline text | ANALYST: J. DOE
@slot publish_date | text | Publish date text | Q1 2026
@slot media_caption | text | Caption or annotation for media | FIG. 01 / PROTOTYPE
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 flex h-full w-full bg-brand-surface text-brand-primary">
  <!-- Copy Panel -->
  <section class="w-1/2 p-[var(--token-space-gutter)] flex flex-col justify-between border-r-4 border-brand-primary">
    <header class="mb-12">
      <div class="font-brand-body text-[16px] font-black uppercase tracking-[0.4em] mb-2">
        {{BRAND_NAME}}
      </div>
      <div class="font-brand-body text-[14px] font-bold uppercase tracking-[0.2em] text-brand-muted">
        {{SLIDE_LABEL}}
      </div>
    </header>

    <main class="flex-1 flex flex-col justify-center">
      <h1
        class="font-brand-display text-[clamp(44px,6vw,84px)] font-black leading-[0.9] tracking-tighter uppercase mb-8">
        {{HEADING}}
      </h1>
      <p
        class="font-brand-body text-[clamp(20px,2.5vw,30px)] leading-tight text-justify tracking-tight text-brand-secondary mb-10">
        {{BODY}}
      </p>
      <div class="flex items-center gap-6 pt-6 border-t-2 border-brand-primary/20">
        <span
          class="font-brand-body text-[12px] font-black uppercase tracking-widest border-2 border-brand-primary px-3 py-1">{{SLOT:byline}}</span>
        <span
          class="font-brand-body text-[12px] font-bold uppercase tracking-[0.3em] text-brand-muted">{{SLOT:publish_date}}</span>
      </div>
    </main>

    <footer class="mt-12 text-[10px] font-brand-body font-bold uppercase tracking-[0.4em] text-brand-muted">
      VERIFIED / 2024 SYSTEM RECORD
    </footer>
  </section>

  <!-- Media Panel -->
  <section class="w-1/2 relative bg-brand-elevated overflow-hidden p-8">
    <div class="absolute inset-0 m-8 border-2 border-brand-primary overflow-hidden">
      <img src="{{IMAGE_URL}}" alt=""
        class="absolute inset-0 h-full w-full object-cover grayscale contrast-125 brightness-105" />
      <div
        class="absolute bottom-4 left-4 right-4 bg-brand-primary text-brand-surface p-4 font-brand-body text-[14px] font-black uppercase tracking-widest text-center shadow-2xl">
        {{SLOT:media_caption}}
      </div>
    </div>
  </section>
</div>
