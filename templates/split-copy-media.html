<!--
@id: layout/split-copy-media
@label: Split Copy Media
@description: Top copy panel with bottom media panel for editorial and story-first posts
@formats: instagram-story,twitter-card,linkedin-post,instagram-portrait

@slot byline | text | Author/byline text | By Editorial Team
@slot publish_date | text | Publish date text | January 2026
@slot media_caption | text | Caption or annotation for lower media zone | Visual context placeholder
-->
<div class="template-inline-media relative z-10 flex h-full w-full flex-col {{ALIGN_CLASS}}"
  style="--template-panel-padding:0;--template-heading-size:58px;--template-body-size:28px;">
  <div class="px-[calc(22px*var(--layout-scale)*var(--frame-space-scale))] pt-[calc(22px*var(--layout-scale)*var(--frame-space-scale))]">
    {{HEADER}}
  </div>
  <div class="relative {{POSITION_CLASS}} flex h-full min-h-0 flex-col p-0">
    <div
      class="flex min-h-0 basis-1/2 flex-col justify-end bg-[color-mix(in_srgb,var(--color-overlay-strong)_16%,transparent)] p-[calc(26px*var(--layout-scale)*var(--frame-space-scale))]">
      <h1
        class="max-w-[var(--content-max-width)] font-brand-display text-brand-primary text-[calc(var(--template-heading-size)*var(--layout-scale)*var(--frame-type-scale))] leading-[var(--template-heading-line-height)] tracking-[var(--template-heading-letter-spacing)] [text-shadow:var(--token-shadow-title)] text-balance [overflow-wrap:anywhere] break-words">
        {{HEADING}}</h1>
      <p
        class="mt-[calc(var(--template-flow-heading)*var(--layout-scale)*var(--frame-space-scale))] max-w-[var(--caption-max-width)] font-brand-body italic text-brand-secondary text-[calc(var(--template-body-size)*var(--layout-scale)*var(--frame-type-scale))] leading-[var(--template-body-line-height)] [text-shadow:var(--token-shadow-caption)] [overflow-wrap:anywhere] break-words">
        {{BODY}}</p>
      <div class="mt-[calc(var(--template-flow-section)*var(--layout-scale)*var(--frame-space-scale))] flex flex-wrap items-center gap-[calc(10px*var(--layout-scale))]">
        <span
          class="font-brand-body text-brand-muted text-[calc(16px*var(--layout-scale)*var(--frame-type-scale))] uppercase tracking-[0.03em] leading-[1.2]">{{SLOT:byline}}</span>
        <span
          class="font-brand-body text-brand-muted text-[calc(16px*var(--layout-scale)*var(--frame-type-scale))] uppercase tracking-[0.03em] leading-[1.2]">{{SLOT:publish_date}}</span>
      </div>
    </div>
    <div class="relative flex min-h-0 flex-1 items-end overflow-hidden bg-[color-mix(in_srgb,var(--color-overlay-strong)_12%,transparent)]">
      <div class="absolute inset-0 bg-cover bg-center bg-no-repeat" style="background-image: url('{{IMAGE_URL}}');"></div>
      <div
        class="absolute inset-0 bg-[linear-gradient(0deg,color-mix(in_srgb,var(--color-overlay-strong)_48%,transparent)_0%,transparent_68%)]">
      </div>
      <div
        class="relative z-[1] p-[calc(18px*var(--layout-scale)*var(--frame-space-scale))] font-brand-body text-brand-primary text-[calc(18px*var(--layout-scale)*var(--frame-type-scale))] leading-[1.3] [overflow-wrap:anywhere] break-words">
        {{SLOT:media_caption}}</div>
    </div>
    {{FOOTER}}
  </div>
</div>
