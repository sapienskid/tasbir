<!--
@id: layout/split-copy-media
@label: Split Copy Media
@description: Top copy panel with bottom media panel for editorial and story-first posts
@formats: instagram-story,twitter-card,linkedin-post,instagram-portrait
@background_image: inline

@slot byline | text | Author/byline text | By Editorial Team
@slot publish_date | text | Publish date text | January 2026
@slot media_caption | text | Caption or annotation for lower media zone | Visual context placeholder
@slot brand_icon | text | Monogram text for the floating brand icon
@slot brand_icon_x | number | Icon horizontal position percent (0-100) | 92
@slot brand_icon_y | number | Icon vertical position percent (0-100) | 9
@slot brand_icon_size | number | Icon circle size in px | 92
@slot brand_icon_opacity | number | Icon opacity from 0 to 1 | 0.92
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div class="relative z-10 grid h-full w-full grid-rows-[auto_minmax(0,1fr)] gap-4 p-6 text-left">
  <header class="flex w-full items-start justify-between gap-3">
    <div class="flex max-w-full flex-wrap items-center gap-2.5">
      <span
        class="inline-flex w-fit items-center border border-black/88 bg-white/58 px-3 py-1.5 font-brand-body text-[11px] font-semibold uppercase tracking-[0.12em] leading-[1.05] text-brand-primary group-data-[template-tone=dark]:border-white/84 group-data-[template-tone=dark]:bg-black/44">
        {{BRAND_NAME}}</span>
      <span
        class="inline-flex w-fit items-center border border-black/88 bg-white/58 px-3 py-1.5 font-brand-body text-[11px] font-semibold uppercase tracking-[0.12em] leading-[1.05] text-brand-primary empty:hidden group-data-[template-tone=dark]:border-white/84 group-data-[template-tone=dark]:bg-black/44">
        {{SLIDE_LABEL}}</span>
    </div>
  </header>
  <section
    class="relative h-full min-h-0 w-full overflow-hidden border border-black/86 bg-white/64 backdrop-blur-[1.25px] group-data-[template-tone=dark]:border-white/62 group-data-[template-tone=dark]:bg-black/62">
    <div class="grid h-full min-h-0 w-full grid-rows-[minmax(0,1.02fr)_minmax(0,0.98fr)]">
      <div
        class="relative flex min-h-0 flex-col gap-4 border-b border-black/80 bg-white/60 p-7 group-data-[template-tone=dark]:border-white/56 group-data-[template-tone=dark]:bg-black/60">
        <h1
          class="m-0 max-w-full font-brand-display text-[clamp(42px,6vw,66px)] font-semibold leading-[0.99] tracking-[-0.012em] text-brand-primary text-balance [overflow-wrap:anywhere] break-words">
          {{HEADING}}</h1>
        <p
          class="m-0 max-w-full font-brand-body text-[clamp(20px,2.4vw,30px)] italic leading-[1.32] text-brand-secondary [overflow-wrap:anywhere] break-words">
          {{BODY}}</p>
        <div class="mt-2 flex flex-wrap items-center gap-3">
          <span
            class="font-brand-body text-[clamp(12px,1.35vw,15px)] uppercase tracking-[0.09em] leading-[1.2] text-brand-muted">{{SLOT:byline}}</span>
          <span
            class="font-brand-body text-[clamp(12px,1.35vw,15px)] uppercase tracking-[0.09em] leading-[1.2] text-brand-muted">{{SLOT:publish_date}}</span>
        </div>
      </div>
      <div class="relative min-h-0 overflow-hidden">
        <img src="{{IMAGE_URL}}" alt="" class="absolute inset-0 h-full w-full object-cover grayscale contrast-[1.12]" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/62 to-black/8"></div>
        <p
          class="absolute bottom-4 right-4 z-[1] max-w-[80%] border border-black/80 bg-white/80 p-4 text-right font-brand-body text-base leading-[1.32] text-brand-primary [overflow-wrap:anywhere] break-words group-data-[template-tone=dark]:border-white/70 group-data-[template-tone=dark]:bg-black/74">
          {{SLOT:media_caption}}</p>
      </div>
    </div>
  </section>
</div>
