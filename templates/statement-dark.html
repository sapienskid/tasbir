<!--
@id: layout/statement-impact
@label: Statement Impact
@description: High-impact Swiss-style statement layout for dark themes
@formats: instagram-square,instagram-portrait,carousel-post,linkedin-post
@frame_tone: dark

@slot cta_text | text | Short call-to-action button label | VIEW CASE
@slot footer_label | text | Small footer metadata | ARCHIVE-01
@slot brand_icon_visible | text | Set to 0 to hide icon layer | 1
-->
<div
  class="relative z-10 flex flex-col h-full w-full bg-brand-surface text-brand-primary p-[var(--token-space-gutter)]">
  <header class="flex justify-between items-start mb-20">
    <div class="font-brand-body text-[18px] font-black uppercase tracking-[0.4em]">
      {{BRAND_NAME}}
    </div>
    <div
      class="font-brand-body text-[14px] font-bold uppercase tracking-[0.2em] border-2 border-brand-primary px-4 py-1">
      {{SLIDE_LABEL}}
    </div>
  </header>

  <main class="flex-1 flex flex-col justify-center max-w-[85%] mx-auto text-center">
    <p class="mb-6 font-brand-body text-brand-muted font-bold uppercase tracking-[0.4em] text-[16px]">
      {{KICKER_TEXT}}
    </p>
    <h1
      class="mb-10 font-brand-display text-[clamp(60px,8.5vw,92px)] font-black leading-[0.85] tracking-tighter uppercase">
      {{HEADING}}
    </h1>
    <div class="w-full h-1 bg-brand-primary mb-10"></div>
    <p
      class="font-brand-body text-[clamp(26px,3.2vw,36px)] leading-[1.1] tracking-tighter text-center max-w-[90%] mx-auto italic">
      {{BODY}}
    </p>
  </main>

  <footer class="mt-20 pt-8 border-t-2 border-brand-primary flex items-end justify-between">
    <div
      class="swiss-border-thick bg-brand-primary px-10 py-5 text-brand-surface font-brand-body text-[22px] font-black uppercase tracking-[0.2em] cursor-pointer">
      {{SLOT:cta_text}}
    </div>
    <div class="text-[12px] font-brand-body font-bold uppercase tracking-[0.4em] text-brand-muted">
      {{SLOT:footer_label}} / 2024
    </div>
  </footer>
</div>
