<!--
@id: core/statement-dark
@label: Statement Dark
@description: Inverted monochromatic layout for strong visual contrast

@slot cta_text | text | Short call-to-action button label | Read More
-->
<div class="content-shell template-dark {{ALIGN_CLASS}}">
    {{HEADER}}
    <div class="content-panel {{POSITION_CLASS}}">
        {{KICKER}}
        <h1 class="heading-primary flow-after-kicker content-limit text-balance word-safe">{{HEADING}}</h1>
        <div class="rule-line rule-line--inverted flow-after-heading"></div>
        <p class="body-primary flow-after-heading caption-limit word-safe">{{BODY}}</p>
        <div class="cta-pill cta-pill--inverted flow-after-section">{{SLOT:cta_text}}</div>
        {{FOOTER}}
    </div>
</div>
