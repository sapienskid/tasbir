<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{SAFE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>{{TEMPLATE_CSS}}</style>
  <style>
    :root {
      --canvas-width: {{CANVAS_WIDTH}}px;
      --canvas-height: {{CANVAS_HEIGHT}}px;
      --font-display: var(--token-font-display, "Cormorant Garamond", Georgia, "Times New Roman", serif);
      --font-body: var(--token-font-body, "Inter", "Manrope", sans-serif);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: var(--canvas-width);
      height: var(--canvas-height);
      overflow: hidden;
      font-family: var(--font-body);
      background: var(--token-color-surface-base);
      color: var(--token-color-text-primary);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

<body>
  <div class="group relative isolate h-full w-full overflow-hidden bg-brand-surface" data-template-id="{{TEMPLATE_ID}}"
    data-template-tone="{{TEMPLATE_TONE}}">

    <!-- Background Content Layer -->
    <div class="absolute inset-0 z-0 {{IMAGE_VISIBILITY_CLASS}}">
      <img src="{{IMAGE_URL}}" alt=""
        class="h-full w-full object-cover grayscale contrast-125 brightness-90 saturate-0" />
      <div class="absolute inset-0 bg-brand-primary/10 mix-blend-multiply"></div>
    </div>

    <!-- Architectural Frame -->
    <div
      class="pointer-events-none absolute inset-0 z-[50] border-[12px] border-brand-primary/5 group-data-[template-tone=dark]:border-white/5">
    </div>

    <!-- Brand Icon -->
    <div class="pointer-events-none absolute z-[60] {{BRAND_ICON_VISIBILITY_CLASS}}"
      style="left: {{BRAND_ICON_LEFT}}%; top: {{BRAND_ICON_TOP}}%; width: {{BRAND_ICON_SIZE}}px; height: {{BRAND_ICON_SIZE}}px; transform: translate(-50%, -50%); opacity: {{BRAND_ICON_OPACITY}};">
      <img src="{{BRAND_ICON_URL}}" alt=""
        class="h-full w-full object-contain group-data-[template-tone=dark]:invert {{BRAND_ICON_IMAGE_VISIBILITY_CLASS}}" />
      <div
        class="flex h-full w-full items-center justify-center border-2 border-brand-primary bg-brand-surface font-brand-body font-black uppercase tracking-widest text-brand-primary {{BRAND_ICON_TEXT_VISIBILITY_CLASS}}"
        style="font-size: calc({{BRAND_ICON_SIZE}}px * 0.35);">
        {{BRAND_ICON_TEXT}}
      </div>
    </div>

    <!-- Main Content Slot -->
    <div class="relative z-[100] h-full w-full">{{CONTENT}}</div>
  </div>
</body>

</html>
