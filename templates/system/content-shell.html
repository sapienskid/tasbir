<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{SAFE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>{{TEMPLATE_CSS}}</style>
  <style>
    :root {
      --canvas-width: {{CANVAS_WIDTH}}px;
      --canvas-height: {{CANVAS_HEIGHT}}px;
      --font-display: var(--token-font-display, "Playfair Display", Georgia, "Times New Roman", serif);
      --font-body: var(--token-font-body, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: var(--canvas-width);
      height: var(--canvas-height);
      overflow: hidden;
      font-family: var(--font-body);
      background: var(--token-color-surface-base);
      color: var(--token-color-text-primary);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

<body>
  <div class="relative isolate h-full w-full overflow-hidden bg-brand-surface" data-template-id="{{TEMPLATE_ID}}"
    data-template-tone="{{TEMPLATE_TONE}}">
    <div class="pointer-events-none absolute inset-0 z-10 {{IMAGE_VISIBILITY_CLASS}}">
      <img src="{{IMAGE_URL}}" alt="" class="h-full w-full object-cover" />
    </div>
    <div class="pointer-events-none absolute inset-0 z-20 bg-black/50"></div>
    <div class="pointer-events-none absolute inset-0 z-30 bg-gradient-to-br from-brand-accent/20 to-transparent"></div>
    <div class="pointer-events-none absolute inset-0 z-40 border border-brand-border/30"></div>
    <div class="relative z-[70] h-full w-full">{{CONTENT}}</div>
  </div>
</body>

</html>
