<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{SAFE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>{{TEMPLATE_CSS}}</style>
  <style>
    :root {
      --canvas-width: {{CANVAS_WIDTH}}px;
      --canvas-height: {{CANVAS_HEIGHT}}px;
      --font-display: var(--token-font-display, "Cormorant Garamond", Georgia, "Times New Roman", serif);
      --font-body: var(--token-font-body, "Inter", "Manrope", sans-serif);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: var(--canvas-width);
      height: var(--canvas-height);
      overflow: hidden;
      font-family: var(--font-body);
      background: var(--token-color-surface-base);
      color: var(--token-color-text-primary);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    [data-color-swap="swap"][data-template-tone="default"] {
      --color-black: #FFFFFF;
      --color-white: #000000;
      --token-color-text-primary: #FFFFFF;
      --token-color-text-secondary: #DDDDDD;
      --token-color-text-muted: #AAAAAA;
      --token-color-surface-base: #000000;
      --token-color-surface-elevated: #111111;
      --token-color-border-subtle: #FFFFFF;
      --token-color-brand-accent: #FFFFFF;
      --token-color-brand-accent-foreground: #000000;
      --token-color-overlay-strong: rgba(255, 255, 255, 0.45);
      --color-text-primary: #FFFFFF;
      --color-text-secondary: #DDDDDD;
      --color-text-muted: #AAAAAA;
      --color-surface-base: #000000;
      --color-surface-elevated: #111111;
      --color-border-subtle: #FFFFFF;
      --color-brand-accent: #FFFFFF;
      --color-brand-accent-foreground: #000000;
      --color-brand-primary: #FFFFFF;
      --color-brand-secondary: #DDDDDD;
      --color-brand-muted: #AAAAAA;
      --color-brand-surface: #000000;
      --color-brand-elevated: #111111;
      --color-brand-border: #FFFFFF;
    }

    [data-color-swap="swap"][data-template-tone="dark"] {
      --color-black: #000000;
      --color-white: #FFFFFF;
      --token-color-text-primary: #000000;
      --token-color-text-secondary: #222222;
      --token-color-text-muted: #555555;
      --token-color-surface-base: #FFFFFF;
      --token-color-surface-elevated: #F8F8F8;
      --token-color-border-subtle: #000000;
      --token-color-brand-accent: #000000;
      --token-color-brand-accent-foreground: #FFFFFF;
      --token-color-overlay-strong: rgba(0, 0, 0, 0.6);
      --color-text-primary: #000000;
      --color-text-secondary: #222222;
      --color-text-muted: #555555;
      --color-surface-base: #FFFFFF;
      --color-surface-elevated: #F8F8F8;
      --color-border-subtle: #000000;
      --color-brand-accent: #000000;
      --color-brand-accent-foreground: #FFFFFF;
      --color-brand-primary: #000000;
      --color-brand-secondary: #222222;
      --color-brand-muted: #555555;
      --color-brand-surface: #FFFFFF;
      --color-brand-elevated: #F8F8F8;
      --color-brand-border: #000000;
    }

    [data-color-swap="swap"] .rich-mermaid {
      border-color: rgba(241, 245, 249, 0.28);
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
    }

    [data-color-swap="swap"] .rich-text pre,
    [data-color-swap="swap"] .rich-text code {
      border-color: rgba(241, 245, 249, 0.24);
      background: rgba(241, 245, 249, 0.12);
      color: inherit;
    }

    .rich-text {
      display: block;
      max-width: 100%;
    }

    .rich-text-inline {
      display: inline;
      max-width: 100%;
    }

    .rich-text p {
      margin: 0;
    }

    .rich-text p+p {
      margin-top: 0.34em;
    }

    .rich-text ul,
    .rich-text ol {
      margin: 0.35em 0 0.35em 1.15em;
      padding: 0;
    }

    .rich-text li {
      margin: 0.16em 0;
    }

    .rich-text blockquote {
      margin: 0.35em 0;
      padding: 0 0 0 0.6em;
      border-left: 2px solid currentColor;
      opacity: 0.86;
    }

    .rich-text pre {
      margin: 0.35em 0;
      padding: 0.35em 0.45em;
      border-radius: 0.35em;
      border: 1px solid rgba(15, 23, 42, 0.22);
      background: rgba(15, 23, 42, 0.08);
      overflow: hidden;
      white-space: pre-wrap;
      font-family: "Courier New", "Liberation Mono", monospace;
      font-size: 0.74em;
      line-height: 1.2;
    }

    .rich-text code {
      font-family: "Courier New", "Liberation Mono", monospace;
      font-size: 0.8em;
      border-radius: 0.2em;
      background: rgba(15, 23, 42, 0.08);
      padding: 0.08em 0.26em;
    }

    .rich-text a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.1em;
    }

    .rich-math {
      display: inline-block;
      max-width: 100%;
      vertical-align: middle;
      white-space: normal;
    }

    .rich-math-block {
      display: block;
      margin: 0.35em 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .rich-mermaid {
      width: 100%;
      max-width: 100%;
      margin: 0.35em 0;
      padding: 0.3em;
      border-radius: 0.35em;
      border: 1px solid rgba(15, 23, 42, 0.2);
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      overflow: hidden;
      display: block;
      line-height: 1;
    }

    .rich-mermaid-inline {
      display: inline-block;
      width: auto;
      max-width: 100%;
      vertical-align: middle;
    }

    .rich-mermaid svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    .rich-mermaid-inline svg {
      width: auto;
      max-width: 100%;
    }

    .rich-mermaid-error {
      white-space: pre-wrap;
      font-family: "Courier New", "Liberation Mono", monospace;
      font-size: 0.66em;
      line-height: 1.2;
    }
  </style>
</head>

<body>
  <div class="group relative isolate h-full w-full overflow-hidden bg-brand-surface" data-template-id="{{TEMPLATE_ID}}"
    data-template-tone="{{TEMPLATE_TONE}}" data-color-swap="{{COLOR_SWAP_MODE}}">

    <!-- Background Content Layer -->
    <div class="absolute inset-0 z-0 {{IMAGE_VISIBILITY_CLASS}}">
      <img src="{{IMAGE_URL}}" alt=""
        class="h-full w-full object-cover grayscale contrast-125 brightness-90 saturate-0" />
      <div class="absolute inset-0 bg-brand-primary/10 mix-blend-multiply"></div>
    </div>

    <!-- Architectural Frame -->
    <div
      class="pointer-events-none absolute inset-0 z-[50] border-[12px] border-brand-primary/5">
    </div>

    <!-- Brand Icon -->
    <div class="pointer-events-none absolute z-[60] {{BRAND_ICON_VISIBILITY_CLASS}}"
      style="left: {{BRAND_ICON_LEFT}}%; top: {{BRAND_ICON_TOP}}%; width: {{BRAND_ICON_SIZE}}px; height: {{BRAND_ICON_SIZE}}px; transform: translate(-50%, -50%); opacity: {{BRAND_ICON_OPACITY}};">
      <img src="{{BRAND_ICON_URL}}" alt=""
        class="h-full w-full object-contain {{BRAND_ICON_INVERT_CLASS}} {{BRAND_ICON_IMAGE_VISIBILITY_CLASS}}" />
      <div
        class="flex h-full w-full items-center justify-center border-2 border-brand-primary bg-brand-surface font-brand-body font-black uppercase tracking-widest text-brand-primary {{BRAND_ICON_TEXT_VISIBILITY_CLASS}}"
        style="font-size: calc({{BRAND_ICON_SIZE}}px * 0.35);">
        {{BRAND_ICON_TEXT}}
      </div>
    </div>

    <!-- Main Content Slot -->
    <div class="relative z-[100] h-full w-full">{{CONTENT}}</div>
  </div>
  <script>{{MERMAID_RUNTIME_JS}}</script>
  <script>
    (() => {
      const runtimeWindow = window;
      runtimeWindow.__RICH_RENDER_DONE__ = false;

      const decodeMermaid = (value) => {
        try {
          return decodeURIComponent(value);
        } catch {
          return value;
        }
      };

      const renderMermaidDiagrams = async () => {
        const mermaidNodes = Array.from(document.querySelectorAll(".rich-mermaid[data-mermaid]"));
        if (mermaidNodes.length === 0) {
          runtimeWindow.__RICH_RENDER_DONE__ = true;
          return;
        }

        const mermaidRuntime = runtimeWindow.mermaid;
        if (!mermaidRuntime || typeof mermaidRuntime.initialize !== "function" || typeof mermaidRuntime.render !== "function") {
          mermaidNodes.forEach((node) => {
            node.textContent = decodeMermaid(node.getAttribute("data-mermaid") || "");
            node.classList.add("rich-mermaid-error");
          });
          runtimeWindow.__RICH_RENDER_DONE__ = true;
          return;
        }

        mermaidRuntime.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: "neutral",
          fontFamily: "Inter, Manrope, sans-serif",
          suppressErrorRendering: true
        });

        let index = 0;
        for (const node of mermaidNodes) {
          const source = decodeMermaid(node.getAttribute("data-mermaid") || "");
          if (!source.trim()) {
            node.remove();
            continue;
          }

          try {
            const result = await mermaidRuntime.render(`rich-mermaid-${index++}`, source);
            node.innerHTML = result.svg;
          } catch {
            node.textContent = source;
            node.classList.add("rich-mermaid-error");
          }
        }

        runtimeWindow.__RICH_RENDER_DONE__ = true;
      };

      Promise.resolve()
        .then(renderMermaidDiagrams)
        .catch(() => {
          runtimeWindow.__RICH_RENDER_DONE__ = true;
        });
    })();
  </script>
</body>

</html>
