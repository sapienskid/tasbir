<!doctype html>
<html>
{{HEAD_HTML}}

<body>
  <div class="relative isolate h-full w-full overflow-hidden" data-template-id="{{TEMPLATE_ID}}"
    data-template-tone="{{FRAME_TONE}}">
    <div class="pointer-events-none absolute inset-0 z-0 bg-brand-surface"></div>
    <div class="pointer-events-none absolute inset-0 z-10 {{IMAGE_VISIBILITY_CLASS}}">
      <img src="{{IMAGE_URL}}" alt="" class="h-full w-full object-cover" />
    </div>
    <div class="pointer-events-none absolute inset-0 z-20 bg-black/50"></div>
    <div class="pointer-events-none absolute inset-0 z-30 bg-gradient-to-br from-brand-accent/20 to-transparent"></div>
    <div class="pointer-events-none absolute inset-0 z-50 border border-brand-border/30"></div>
    <div class="relative z-[70] h-full w-full">{{CONTENT}}</div>
    <div class="absolute z-[80] {{BRAND_ICON_CORNER_CLASS}}">
      <img src="{{BRAND_ICON_URL}}" alt="" class="h-8 w-auto object-contain" />
    </div>
  </div>
</body>

</html>
