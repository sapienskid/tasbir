<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{SAFE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>{{TEMPLATE_CSS}}</style>
  <style>
    :root {
      --canvas-width: {{CANVAS_WIDTH}}px;
      --canvas-height: {{CANVAS_HEIGHT}}px;

      --font-display: var(--token-font-display, "Playfair Display", Georgia, "Times New Roman", serif);
      --font-body: var(--token-font-body, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif);
      --token-font-heading: var(--font-display);
      --token-font-body: var(--font-body);

      --token-color-text-primary: {{TOKEN_PRIMARY_TEXT}};
      --token-color-text-secondary: {{TOKEN_SECONDARY_TEXT}};
      --token-color-text-muted: {{TOKEN_MUTED_TEXT}};
      --token-color-surface-base: {{TOKEN_SURFACE_BASE}};
      --token-color-surface-elevated: {{TOKEN_SURFACE_ELEVATED}};
      --token-color-border-subtle: {{TOKEN_BORDER_SUBTLE}};
      --token-color-brand-accent: {{TOKEN_ACCENT}};
      --token-color-brand-accent-foreground: {{TOKEN_ACCENT_FOREGROUND}};
      --token-color-overlay-strong: {{TOKEN_OVERLAY_STRONG}};

      --color-text-primary: var(--token-color-text-primary);
      --color-text-secondary: var(--token-color-text-secondary);
      --color-text-muted: var(--token-color-text-muted);
      --color-surface-base: var(--token-color-surface-base);
      --color-surface-elevated: var(--token-color-surface-elevated);
      --color-border-subtle: var(--token-color-border-subtle);
      --color-brand-accent: var(--token-color-brand-accent);
      --color-brand-accent-foreground: var(--token-color-brand-accent-foreground);
      --color-brand-glow: {{TOKEN_ACCENT_GLOW}};
      --color-overlay-strong: var(--token-color-overlay-strong);

      --shadow-soft: none;
      --radius-card: {{TOKEN_RADIUS_CARD}};
      --radius-pill: {{TOKEN_RADIUS_PILL}};
      --token-radius-card: {{TOKEN_RADIUS_CARD}};
      --token-radius-pill: {{TOKEN_RADIUS_PILL}};
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: var(--canvas-width);
      height: var(--canvas-height);
      overflow: hidden;
      font-family: var(--font-body);
      background: var(--color-surface-base);
      color: var(--color-text-primary);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
