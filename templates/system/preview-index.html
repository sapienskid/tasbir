<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System / Workspace</title>
  <style>{{TEMPLATE_CSS}}</style>
  <style>
    body {
      margin: 0;
      background-color: #f5f5f5;
    }

    .swiss-input {
      border: 2px solid #000;
      padding: 10px 14px;
      font-family: inherit;
      font-weight: 600;
      background: #fff;
      color: #000;
      border-radius: 0;
      outline: none;
    }

    .swiss-input:focus {
      background: #000;
      color: #fff;
    }

    .swiss-btn {
      border: 2px solid #000;
      padding: 10px 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 0;
      transition: all 0.2s ease;
    }

    .swiss-btn-primary {
      background: #000;
      color: #fff;
    }

    .swiss-btn-primary:hover {
      background: #fff;
      color: #000;
    }

    .swiss-btn-secondary {
      background: #fff;
      color: #000;
    }

    .swiss-btn-secondary:hover {
      background: #000;
      color: #fff;
    }

    .template-btn {
      text-align: left;
      padding: 12px 16px;
      border: 2px solid #000;
      background: #fff;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 11px;
    }

    .template-btn.active {
      background: #000;
      color: #fff;
    }

    .template-btn:not(.active):hover {
      background: #f0f0f0;
    }
  </style>
</head>

<body class="min-h-screen text-black font-brand-body">
  <div class="mx-auto flex min-h-screen w-full max-w-[2000px] flex-col gap-0 lg:flex-row">
    <!-- Sidebar -->
    <aside class="flex w-full shrink-0 flex-col gap-8 bg-white border-r-[4px] border-black p-10 lg:w-[480px]">
      <header class="space-y-4">
        <p class="m-0 text-[12px] font-black uppercase tracking-[0.4em] text-brand-muted">V_MODULE / WORKSPACE</p>
        <h1 class="font-brand-display text-[48px] leading-[0.85] font-black uppercase tracking-tighter">System Console
        </h1>
        <p class="text-[16px] font-bold text-brand-secondary leading-tight max-w-[320px]">
          Direct parameter injection and architectural rendering for single narrative modules.
        </p>
      </header>

      <div class="grid grid-cols-1 gap-6">
        <label class="grid gap-2 text-[12px] font-black uppercase tracking-[0.2em]" for="formatSelect">
          Injection Mode
          <select id="formatSelect" class="swiss-input text-base"></select>
        </label>

        <div class="grid grid-cols-2 gap-4">
          <label class="grid gap-2 text-[12px] font-black uppercase tracking-[0.2em]" for="titleInput">
            Meta Title
            <input id="titleInput" class="swiss-input text-sm" />
          </label>
          <label class="grid gap-2 text-[12px] font-black uppercase tracking-[0.2em]" for="captionInput">
            Descriptor
            <input id="captionInput" class="swiss-input text-sm" />
          </label>
        </div>

        <label class="grid gap-2 text-[12px] font-black uppercase tracking-[0.2em]" for="headingInput">
          Primary Heading
          <input id="headingInput" class="swiss-input text-sm" />
        </label>

        <label class="grid gap-2 text-[12px] font-black uppercase tracking-[0.2em]" for="bodyInput">
          Narrative Body
          <input id="bodyInput" class="swiss-input text-sm" />
        </label>

        <label class="grid gap-2 text-[12px] font-black uppercase tracking-[0.2em]" for="brandNameInput">
          System Identity
          <input id="brandNameInput" class="swiss-input text-sm" />
        </label>

        <label class="grid gap-2 text-[12px] font-black uppercase tracking-[0.2em]" for="imageUrlInput">
          Asset Reference
          <input id="imageUrlInput" class="swiss-input text-sm" placeholder="URL://" />
        </label>
      </div>

      <div class="flex flex-col gap-4 pt-4 border-t-2 border-black/10">
        <div class="grid grid-cols-2 gap-4">
          <button id="applyBtn" class="swiss-btn swiss-btn-primary">Apply</button>
          <button id="reloadBtn" class="swiss-btn swiss-btn-secondary">Reload</button>
        </div>
        <button id="resetBtn" class="swiss-btn swiss-btn-secondary w-full">Reset System</button>
      </div>

      <div class="grid grid-cols-1 gap-4">
        <a id="openTabLink" class="swiss-btn swiss-btn-primary text-center flex items-center justify-center"
          target="_blank" rel="noopener noreferrer">ENTER_MODULE</a>
        <a id="downloadPngLink" class="swiss-btn swiss-btn-secondary text-center flex items-center justify-center"
          target="_blank" rel="noopener noreferrer">EXPORT_PNG</a>
        <a class="text-[12px] font-black uppercase tracking-[0.4em] text-brand-muted text-center hover:text-black transition-colors"
          href="/preview/gallery">Open Gallery Gallery</a>
      </div>

      <label class="inline-flex items-center gap-3 text-[12px] font-black uppercase tracking-[0.1em]"
        for="autoRefreshInput">
        <input id="autoRefreshInput" type="checkbox" class="h-5 w-5" checked />
        Auto-sync Repository
      </label>

      <section class="grid gap-4 border-t-4 border-black pt-8">
        <h2 class="text-[14px] font-black uppercase tracking-[0.3em] text-black">Available Modules</h2>
        <div id="templateButtons" class="grid max-h-[30vh] grid-cols-1 gap-3 overflow-y-auto pr-2"></div>
      </section>
    </aside>

    <!-- Main Preview Area -->
    <main class="flex min-h-screen flex-1 flex-col bg-black">
      <div class="flex items-center justify-between gap-4 border-b-2 border-white/20 px-8 py-5">
        <div class="flex items-center gap-4">
          <div class="w-12 h-[2px] bg-white"></div>
          <p id="statusLabel" class="text-[12px] font-black uppercase tracking-[0.4em] text-white">SYSTEM_READY</p>
        </div>
        <p id="routeLabel" class="truncate text-[10px] font-black tracking-widest text-white/40 uppercase"></p>
      </div>
      <div class="flex-1 flex items-center justify-center overflow-auto p-12">
        <div class="relative isolate shadow-[0_60px_120px_rgba(0,0,0,0.8)]">
          <iframe id="previewFrame" title="Template preview" class="block border-0 bg-white"></iframe>
        </div>
      </div>
    </main>
  </div>

  <script id="preview-defaults" type="application/json">{{PREVIEW_DEFAULTS_JSON}}</script>
  <script>
    (() => {
      const defaults = JSON.parse(document.getElementById("preview-defaults")?.textContent || "{}");
      const fieldConfig = [
        ["title", "titleInput"],
        ["caption", "captionInput"],
        ["heading", "headingInput"],
        ["body", "bodyInput"],
        ["brandName", "brandNameInput"],
        ["imageUrl", "imageUrlInput"]
      ];

      const state = {
        catalog: null,
        catalogVersion: "",
        format: "",
        templateId: ""
      };

      const formatSelect = document.getElementById("formatSelect");
      const templateButtons = document.getElementById("templateButtons");
      const autoRefreshInput = document.getElementById("autoRefreshInput");
      const previewFrame = document.getElementById("previewFrame");
      const statusLabel = document.getElementById("statusLabel");
      const routeLabel = document.getElementById("routeLabel");
      const openTabLink = document.getElementById("openTabLink");
      const downloadPngLink = document.getElementById("downloadPngLink");

      function fieldElement(fieldKey) {
        const entry = fieldConfig.find(([key]) => key === fieldKey);
        return entry ? document.getElementById(entry[1]) : null;
      }

      function getFieldValue(fieldKey) {
        const input = fieldElement(fieldKey);
        return input ? input.value.trim() : "";
      }

      function setFieldValue(fieldKey, value) {
        const input = fieldElement(fieldKey);
        if (input) {
          input.value = value || "";
        }
      }

      function templateById(templateId) {
        const templates = Array.isArray(state.catalog?.templates) ? state.catalog.templates : [];
        return templates.find((template) => template.id === templateId);
      }

      function formatById(formatId) {
        const formats = Array.isArray(state.catalog?.formats) ? state.catalog.formats : [];
        return formats.find((format) => format.id === formatId);
      }

      function templatesForFormat(formatId) {
        const mapping = state.catalog?.templates_by_format || {};
        const ids = mapping[formatId];
        return Array.isArray(ids) ? ids : [];
      }

      function setStatus(label) {
        statusLabel.textContent = label;
      }

      function syncUrl() {
        const next = new URL(window.location.href);
        next.searchParams.set("format", state.format);
        next.searchParams.set("templateId", state.templateId);
        for (const [fieldKey] of fieldConfig) {
          const value = getFieldValue(fieldKey);
          if (value) {
            next.searchParams.set(fieldKey, value);
          } else {
            next.searchParams.delete(fieldKey);
          }
        }
        history.replaceState(null, "", next.toString());
      }

      function buildTemplateUrl(includeCacheBust) {
        const params = new URLSearchParams();
        params.set("templateId", state.templateId);
        for (const [fieldKey] of fieldConfig) {
          const value = getFieldValue(fieldKey);
          if (value) {
            params.set(fieldKey, value);
          }
        }
        if (includeCacheBust) {
          params.set("_t", String(Date.now()));
        }
        return "/template/" + encodeURIComponent(state.format) + "?" + params.toString();
      }

      function buildScreenshotUrl() {
        const params = new URLSearchParams();
        params.set("format", state.format);
        params.set("templateId", state.templateId);
        for (const [fieldKey] of fieldConfig) {
          const value = getFieldValue(fieldKey);
          if (value) {
            params.set(fieldKey, value);
          }
        }
        return "/preview/screenshot?" + params.toString();
      }

      function applyPreview() {
        const format = formatById(state.format);
        if (!format) {
          return;
        }

        previewFrame.width = String(format.width);
        previewFrame.height = String(format.height);

        const url = buildTemplateUrl(true);
        previewFrame.src = url;
        routeLabel.textContent = "ENDPOINT::" + state.format.toUpperCase() + "::ID_" + state.templateId.replaceAll("/", "_").toUpperCase();
        openTabLink.href = url;
        downloadPngLink.href = buildScreenshotUrl();
        downloadPngLink.download = state.format + "-" + state.templateId.replaceAll("/", "_") + ".png";
        syncUrl();
        setStatus("READY_FOR_INSPECTION");
      }

      function refreshPreviewFrameOnly() {
        const format = formatById(state.format);
        if (!format) {
          return;
        }

        previewFrame.width = String(format.width);
        previewFrame.height = String(format.height);
        const url = buildTemplateUrl(true);
        previewFrame.src = url;
        openTabLink.href = url;
        downloadPngLink.href = buildScreenshotUrl();
      }

      function renderTemplateButtons() {
        templateButtons.innerHTML = "";
        const ids = templatesForFormat(state.format);
        if (ids.length === 0) {
          const empty = document.createElement("p");
          empty.className = "border-2 border-dashed border-black/10 p-4 text-[10px] font-black uppercase tracking-widest text-black/20";
          empty.textContent = "NULL_MODULES_IN_FORMAT";
          templateButtons.appendChild(empty);
          return;
        }

        for (const id of ids) {
          const template = templateById(id);
          const button = document.createElement("button");
          button.type = "button";
          button.className = "template-btn";
          if (id === state.templateId) {
            button.classList.add("active");
          }
          button.textContent = (template?.label || id).toUpperCase();
          button.addEventListener("click", () => {
            state.templateId = id;
            renderTemplateButtons();
            applyPreview();
          });
          templateButtons.appendChild(button);
        }
      }

      function renderFormatOptions() {
        const formats = Array.isArray(state.catalog?.formats) ? state.catalog.formats : [];
        formatSelect.innerHTML = "";
        for (const format of formats) {
          const option = document.createElement("option");
          option.value = format.id;
          option.textContent = format.id.toUpperCase() + " [" + format.width + "x" + format.height + "]";
          formatSelect.appendChild(option);
        }

        if (!formats.some((format) => format.id === state.format)) {
          state.format = formats[0]?.id || "";
        }

        const ids = templatesForFormat(state.format);
        if (!ids.includes(state.templateId)) {
          state.templateId = ids[0] || "";
        }

        formatSelect.value = state.format;
      }

      function loadInitialFromUrl() {
        const url = new URL(window.location.href);
        state.format = url.searchParams.get("format")?.trim() || "";
        state.templateId = url.searchParams.get("templateId")?.trim() || "";

        for (const [fieldKey] of fieldConfig) {
          const value = url.searchParams.get(fieldKey);
          setFieldValue(fieldKey, value ?? defaults[fieldKey] ?? "");
        }
      }

      async function reloadCatalog() {
        try {
          const response = await fetch("/template-catalog?_t=" + Date.now(), { cache: "no-store" });
          if (!response.ok) {
            setStatus("FATAL: CATALOG_FAILED");
            return;
          }

          const catalog = await response.json();
          state.catalog = catalog;
          state.catalogVersion = catalog.catalog_version || "";
          renderFormatOptions();
          renderTemplateButtons();
          applyPreview();
        } catch (_error) {
          setStatus("FATAL: SERVER_UNAVAILABLE");
        }
      }

      async function pollCatalog() {
        if (!autoRefreshInput.checked) {
          return;
        }
        try {
          const response = await fetch("/template-catalog?_t=" + Date.now(), { cache: "no-store" });
          if (!response.ok) {
            return;
          }
          const next = await response.json();
          if ((next.catalog_version || "") === state.catalogVersion) {
            refreshPreviewFrameOnly();
            return;
          }
          state.catalog = next;
          state.catalogVersion = next.catalog_version || "";
          renderFormatOptions();
          renderTemplateButtons();
          applyPreview();
          setStatus("MODULES_SYNCED");
        } catch (_error) {
          // Keep last stable state.
        }
      }

      document.getElementById("applyBtn").addEventListener("click", () => {
        state.format = formatSelect.value;
        renderFormatOptions();
        renderTemplateButtons();
        applyPreview();
      });

      document.getElementById("reloadBtn").addEventListener("click", () => {
        applyPreview();
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        for (const [fieldKey] of fieldConfig) {
          setFieldValue(fieldKey, defaults[fieldKey] ?? "");
        }
        applyPreview();
      });

      formatSelect.addEventListener("change", () => {
        state.format = formatSelect.value;
        const ids = templatesForFormat(state.format);
        state.templateId = ids[0] || "";
        renderTemplateButtons();
        applyPreview();
      });

      loadInitialFromUrl();
      void reloadCatalog();
      setInterval(() => {
        void pollCatalog();
      }, 1500);
    })();
  </script>
</body>

</html>
