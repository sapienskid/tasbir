<div class="absolute inset-y-0 left-0" style="width: 42%; background: linear-gradient(90deg, color-mix(in srgb, var(--color-brand-accent) 34%, transparent), transparent);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 32px 36px;">
    <h1 class="text-balance break-words text-[54px] leading-[1] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
    <p class="mt-2 break-words text-[24px] leading-[1.3] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
    {{FOOTER}}
  </div>
</div>
