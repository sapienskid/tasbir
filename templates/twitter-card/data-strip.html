<div class="absolute inset-x-0 top-0 h-12" style="background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--color-brand-accent) 24%, transparent) 0 26px, color-mix(in srgb, var(--color-surface-elevated) 66%, transparent) 26px 52px);"></div>
<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; padding-top: calc({{CONTENT_INSET}}px + 20px); {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 30px 34px;">
    <p class="break-words text-[14px] font-semibold uppercase tracking-[0.09em] text-[var(--color-text-muted)]">Data-led insight</p>
    <h1 class="mt-1 text-balance break-words text-[50px] leading-[1.02] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{TITLE}}</h1>
    <p class="mt-2 break-words text-[23px] leading-[1.3] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{CAPTION}}</p>
    <div class="mt-6 inline-flex w-fit items-center rounded-full border px-4 py-2 text-[13px] font-semibold uppercase tracking-[0.08em]" style="border-color: color-mix(in srgb, var(--color-border-subtle) 76%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">{{BRAND_NAME}}</div>
    {{FOOTER}}
  </div>
</div>
