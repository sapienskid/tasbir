<div class="relative z-10 flex h-full w-full flex-col" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <div class="mt-auto" style="padding: 32px 36px;">
    <div class="inline-flex w-fit items-center rounded-full border px-4 py-2 text-[14px] font-semibold uppercase tracking-[0.1em]" style="border-color: color-mix(in srgb, var(--color-brand-accent) 78%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 74%, transparent);">{{SLOT:kicker}}</div>
    <h1 class="mt-4 text-balance break-words text-[52px] leading-[1] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
    <p class="mt-2 break-words text-[23px] leading-[1.3] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:supporting_line}}</p>
    <div class="mt-6 inline-flex w-fit items-center rounded-full px-5 py-2 text-[19px] font-semibold" style="background: var(--color-brand-accent); color: var(--color-brand-accent-foreground);">{{SLOT:cta_text}}</div>
    {{FOOTER}}
  </div>
</div>
