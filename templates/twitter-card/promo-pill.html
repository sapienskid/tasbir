<div class="absolute right-10 top-10 rounded-full border px-4 py-2 text-[14px] font-semibold uppercase tracking-[0.1em]" style="border-color: color-mix(in srgb, var(--color-brand-accent) 88%, transparent); background: color-mix(in srgb, var(--color-surface-elevated) 72%, transparent);">{{SLOT:kicker}}</div>
<div class="absolute inset-x-0 bottom-0 h-[36%]" style="background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--color-brand-accent) 58%, var(--color-overlay-strong)));"></div>
<div class="relative z-10 flex h-full w-full flex-col gap-3" style="padding: {{CONTENT_INSET}}px; {{ALIGNMENT_STYLE}}">
  {{HEADER}}
  <h1 class="text-balance break-words text-[58px] leading-[1] tracking-[-0.02em]" style="font-family: var(--font-display); max-width: {{CONTENT_MAX_WIDTH}}px; text-shadow: var(--frame-title-shadow);">{{SLOT:headline}}</h1>
  <p class="break-words text-[26px] leading-[1.28] text-[var(--color-text-secondary)]" style="max-width: {{CAPTION_MAX_WIDTH}}px; text-shadow: var(--frame-caption-shadow);">{{SLOT:supporting_line}}</p>
  <div class="mt-auto inline-flex w-fit items-center rounded-full px-5 py-2 text-[20px] font-semibold" style="background: var(--color-brand-accent); color: var(--color-brand-accent-foreground);">{{SLOT:cta_text}}</div>
  {{FOOTER}}
</div>
